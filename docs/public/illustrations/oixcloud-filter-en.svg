<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Filter lines, regions and names</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Filter lines, regions and names</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ oixCloud</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Node Filter</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">Save</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><circle cx="477" cy="241" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="477" y="246" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="82" y="266" font-size="14" fill="#697384" font-weight="400" text-anchor="start">○ Any  →  ✓ Only  →  ⊖ Exclude</text><text x="81" y="312" font-size="15" fill="#767982" font-weight="400" text-anchor="start">Lines</text><rect x="76" y="328" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="132" y="352" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">Edge</text><rect x="199" y="328" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="255" y="352" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">CIA</text><rect x="322" y="328" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="378" y="352" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">IXP</text><rect x="76" y="375" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="132" y="399" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">Fusion</text><rect x="199" y="375" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="255" y="399" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">GIA</text><circle cx="468" cy="327" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="332" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="81" y="440" font-size="15" fill="#767982" font-weight="400" text-anchor="start">Regions</text><rect x="76" y="455" width="113" height="36" rx="18" fill="#dfebff" stroke="#8db7ff"/><text x="132" y="479" font-size="15" fill="#0068d8" font-weight="500" text-anchor="middle">HK</text><rect x="199" y="455" width="113" height="36" rx="18" fill="#dfebff" stroke="#8db7ff"/><text x="255" y="479" font-size="15" fill="#0068d8" font-weight="500" text-anchor="middle">JP</text><rect x="322" y="455" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="378" y="479" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">SG</text><rect x="68" y="517" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="550" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Name contains</text><text x="456" y="550" font-size="16" fill="#85858d" font-weight="400" text-anchor="end">HK|JP</text><path d="M84 570H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="603" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Name excludes</text><text x="456" y="603" font-size="16" fill="#85858d" font-weight="400" text-anchor="end">Test|Maintenance</text><text x="83" y="656" font-size="18" fill="#202124" font-weight="600" text-anchor="start">Preview</text><circle cx="467" cy="647" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="467" y="652" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="68" y="677" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="710" font-size="20" fill="#a5a5ad" font-weight="400" text-anchor="start">⌕  Search nodes</text><path d="M84 730H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="763" font-size="20" fill="#202124" font-weight="400" text-anchor="start">HK · Example A</text><text x="456" y="763" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">✓</text><path d="M84 783H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="816" font-size="20" fill="#202124" font-weight="400" text-anchor="start">JP · Example B</text><text x="456" y="816" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">✓</text><text x="83" y="876" font-size="17" fill="#007aff" font-weight="400" text-anchor="start">Restore Default</text><text x="468" y="876" font-size="15" fill="#727279" font-weight="400" text-anchor="end">2 of 12 nodes kept</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">oixCloud → Node Filter</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Cycle each filter</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Choose Any, Only or Exclude for lines and</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">regions. Available tags depend on the</text><text x="552" y="444" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">account.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Inspect the preview</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Names accept regular expressions. Preview</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">search does not change the filter.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Save and refresh</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Only some lines are shown here. Wait for</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">managed nodes to refresh after saving.</text></g></svg>
