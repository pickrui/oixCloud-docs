<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 在最近活动中找到请求与节点</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在最近活动中找到请求与节点</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">账户信息</text><g transform="translate(-100 0)"><rect x="245" y="305" width="808" height="91" rx="12" fill="#fff" stroke="none"/><text x="271" y="338" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">最近活动</text><text x="271" y="375" font-size="26" fill="#476994" font-weight="650" text-anchor="start">2</text><text x="537" y="338" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">订阅访问</text><text x="537" y="375" font-size="26" fill="#476994" font-weight="650" text-anchor="start">1</text><text x="804" y="338" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">登录记录</text><text x="804" y="375" font-size="26" fill="#476994" font-weight="650" text-anchor="start">1</text><rect x="245" y="420" width="808" height="280" rx="12" fill="#fff" stroke="none"/><text x="267" y="457" font-size="21" fill="#405675" font-weight="600" text-anchor="start">最近活动记录</text><rect x="245" y="475" width="808" height="43" rx="0" fill="#edf2fa" stroke="none"/><text x="265" y="503" font-size="16" fill="#202124" font-weight="400" text-anchor="start">长连接</text><text x="412" y="503" font-size="16" fill="#202124" font-weight="400" text-anchor="start">活动请求</text><text x="567" y="503" font-size="16" fill="#202124" font-weight="400" text-anchor="start">Working nodes</text><text x="763" y="503" font-size="16" fill="#202124" font-weight="400" text-anchor="start">上行/下行</text><text x="936" y="503" font-size="16" fill="#202124" font-weight="400" text-anchor="start">时间</text><text x="275" y="557" font-size="19" fill="#202124" font-weight="400" text-anchor="start">8</text><text x="437" y="557" font-size="19" fill="#202124" font-weight="400" text-anchor="start">24</text><text x="620" y="557" font-size="19" fill="#4277c8" font-weight="600" text-anchor="start">2 ⌄</text><rect x="598" y="525" width="74" height="50" rx="10" fill="none" stroke="#d27336"/><circle cx="668" cy="529" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="668" y="534" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="753" y="557" font-size="17" fill="#202124" font-weight="400" text-anchor="start">1 / 5 MiB</text><text x="925" y="557" font-size="17" fill="#202124" font-weight="400" text-anchor="start">10:00</text><rect x="905" y="525" width="113" height="50" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="529" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="534" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="398" y="476" width="320" height="42" rx="10" fill="none" stroke="#d27336"/><circle cx="714" cy="480" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="714" y="485" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="551" y="582" width="331" height="89" rx="9" fill="#f0f5fd" stroke="none"/><text x="570" y="617" font-size="18" fill="#202124" font-weight="400" text-anchor="start">香港 · 示例 A</text><text x="570" y="650" font-size="18" fill="#202124" font-weight="400" text-anchor="start">日本 · 示例 B</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先对照发生时间</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">图中为虚构分钟记录，按问题发生的时区核</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">对</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">看活动请求与节点数</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">长连接、活动请求与 Working nodes 是</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">不同数据</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">点节点数展开详情</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">核对当时使用哪些节点，再与客户端记录对</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">照</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 账户信息 → 最近活动记录</text></g></svg>
