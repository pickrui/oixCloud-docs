<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">OpenClash · Change the upstream DNS for websites</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Change the upstream DNS for websites</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">Services</text><text x="337" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="64" y="248" font-size="32" fill="#344454" font-weight="650" text-anchor="start">Overwrite Settings</text><text x="65" y="303" font-size="22" fill="#376b91" font-weight="600" text-anchor="start">DNS Settings</text><rect x="65" y="332" width="986" height="313" rx="8" fill="#fff" stroke="#dae0e5"/><text x="91" y="394" font-size="21" fill="#354958" font-weight="600" text-anchor="start">☑  Custom DNS Setting</text><circle cx="530" cy="370" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="530" y="375" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="92" y="466" font-size="18" fill="#526879" font-weight="550" text-anchor="start">Add Custom DNS Servers</text><rect x="91" y="493" width="933" height="85" rx="7" fill="#f6f9fb" stroke="#d5dee6"/><text x="116" y="545" font-size="22" fill="#38688c" font-weight="400" text-anchor="start">☑</text><text x="181" y="544" font-size="21" fill="#354958" font-weight="600" text-anchor="start">nameserver</text><text x="449" y="544" font-size="21" fill="#354958" font-weight="400" text-anchor="start">192.0.2.53</text><text x="711" y="544" font-size="20" fill="#354958" font-weight="400" text-anchor="start">UDP</text><text x="864" y="544" font-size="20" fill="#354958" font-weight="400" text-anchor="start">53</text><circle cx="1007" cy="500" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1007" y="505" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="830" y="677" width="199" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="929.5" y="703" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Apply Settings</text><rect x="826" y="673" width="207" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1029" cy="677" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1029" y="682" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enable the override</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Leave this off to keep the</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">managed profile’s DNS settings.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose nameserver</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Enable the entry and set the</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">resolver address, protocol and</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">port.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Apply Settings</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Check the running profile, then</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">test DNS from an included LAN</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">device.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Overwrite Settings → DNS Settings</text></g></svg>
