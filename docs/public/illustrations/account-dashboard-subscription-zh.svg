<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 在用户中心复制完整订阅地址</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在用户中心复制完整订阅地址</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">用户中心</text><g transform="translate(-100 0)"><rect x="245" y="305" width="808" height="418" rx="12" fill="#fff" stroke="#d5deea"/><text x="270" y="354" font-size="23" fill="#405675" font-weight="650" text-anchor="start">订阅地址</text><rect x="257" y="316" width="238" height="56" rx="10" fill="none" stroke="#d27336"/><circle cx="491" cy="320" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="491" y="325" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="270" y="425" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Clash/Stash</text><rect x="270" y="444" width="385" height="44" rx="7" fill="#f7f9fc" stroke="#d5deea"/><text x="287" y="473" font-size="19" fill="#657b97" font-weight="400" text-anchor="start">••••••••••••</text><rect x="690" y="445" width="108" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="744" y="471" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">复制</text><rect x="686" y="441" width="116" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="798" cy="445" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="798" y="450" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="858" y="472" font-size="17" fill="#476394" font-weight="500" text-anchor="middle">二维码</text><text x="976" y="472" font-size="17" fill="#476394" font-weight="500" text-anchor="middle">导入</text><path d="M270 531H1025" stroke="#dedee3" stroke-width="1"/><text x="270" y="581" font-size="22" fill="#405675" font-weight="650" text-anchor="start">Provider</text><rect x="257" y="544" width="185" height="55" rx="10" fill="none" stroke="#d27336"/><circle cx="438" cy="548" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="438" y="553" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="270" y="655" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Clash/Stash</text><rect x="445" y="624" width="386" height="49" rx="7" fill="#f7f9fc" stroke="#d5deea"/><text x="465" y="655" font-size="19" fill="#657b97" font-weight="400" text-anchor="start">••••••••••••</text><rect x="866" y="629" width="140" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="936" y="655" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">复制</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">展开订阅地址</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">有生效套餐时可以看到这个入口，专用客户</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">端可直接登录</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">复制对应格式</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">以 Clash/Stash 为例，将完整地址粘贴</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">到客户端的远程订阅栏</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">区分 Provider</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">已有配置需要引用节点列表时，才使用这里</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">的地址</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：用户中心 → 订阅地址</text></g></svg>
