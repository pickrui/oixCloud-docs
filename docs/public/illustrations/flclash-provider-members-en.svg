<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Add a third-party provider to your group</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Desktop</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Add a third-party provider to your group</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Dashboard</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Proxies</text><rect x="40" y="335" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="359" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">Profiles</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><text x="76" y="719" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">Override</text><rect x="30" y="165" width="1060" height="618" rx="0" fill="#00000044" stroke="none"/><rect x="175" y="235" width="770" height="435" rx="27" fill="#fff6f8" stroke="#ddcbd2"/><text x="199" y="277" font-size="26" fill="#8a5260" font-weight="400" text-anchor="start">‹</text><text x="560" y="278" font-size="23" fill="#332b2e" font-weight="600" text-anchor="middle">Select proxies</text><text x="917" y="278" font-size="24" fill="#8a5260" font-weight="600" text-anchor="end">✓</text><circle cx="932" cy="253" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="932" y="258" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="200" y="315" width="720" height="42" rx="10" fill="#f3e8ee" stroke="none"/><text x="219" y="343" font-size="18" fill="#93818b" font-weight="400" text-anchor="start">⌕ Search</text><text x="206" y="403" font-size="17" fill="#895b70" font-weight="600" text-anchor="start">Proxy providers</text><rect x="201" y="426" width="718" height="65" rx="13" fill="#f0dce7" stroke="none"/><text x="227" y="467" font-size="22" fill="#493241" font-weight="600" text-anchor="start">ThirdParty</text><path d="M860 459l5 5 11-13" fill="none" stroke="#8a5260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="197" y="422" width="726" height="73" rx="10" fill="none" stroke="#d27336"/><circle cx="919" cy="426" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="919" y="431" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="206" y="541" font-size="17" fill="#895b70" font-weight="600" text-anchor="start">Policy groups</text><text x="227" y="589" font-size="21" fill="#51414b" font-weight="400" text-anchor="start">Proxy Selection</text><rect x="842" y="567" width="23" height="23" rx="3" fill="#fff" stroke="#b7a2ae"/><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Add the provider to the</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">library first</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">ThirdParty is the fictional</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">source name. Keep the managed</text><text x="42" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">profile selected.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Select the provider in</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Members</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Under Proxy providers, check your</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> saved third-party source.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Save and set a rule target</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Target this group with a personal</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> rule, apply, then select a node</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">under Proxies.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Managed profile → Override → Overlay → Proxy group → Members</text></g></svg>
