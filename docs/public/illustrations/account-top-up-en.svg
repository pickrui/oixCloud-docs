<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Choose a method and check the top-up amount</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose a method and check the top-up amount</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Cashier</text><g transform="translate(-100 0)"><rect x="245" y="304" width="808" height="445" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="341" font-size="22" fill="#405675" font-weight="600" text-anchor="start">Choose a payment method</text><rect x="267" y="361" width="358" height="62" rx="8" fill="#edf3fd" stroke="#4c74d8"/><text x="290" y="400" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Example channel</text><path d="M590 391l5 5 11-13" fill="none" stroke="#4c74d8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="259" y="353" width="374" height="78" rx="10" fill="none" stroke="#d27336"/><circle cx="629" cy="357" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="629" y="362" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="474" font-size="18" fill="#596b85" font-weight="600" text-anchor="start">Recharge amount · CNY</text><rect x="811" y="448" width="219" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="865.75" y="473" font-size="16" fill="#222" font-weight="400" text-anchor="middle">USD</text><rect x="923.5" y="451" width="103.5" height="33" rx="6" fill="#fff" stroke="none"/><text x="975.25" y="473" font-size="16" fill="#222" font-weight="600" text-anchor="middle">CNY</text><rect x="803" y="440" width="235" height="55" rx="10" fill="none" stroke="#d27336"/><circle cx="1034" cy="444" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1034" y="449" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="267" y="503" width="553" height="50" rx="7" fill="#fff" stroke="#d5deea"/><text x="284" y="536" font-size="22" fill="#445a77" font-weight="400" text-anchor="start">100.00</text><rect x="845" y="508" width="185" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="937.5" y="534" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Pay</text><rect x="841" y="504" width="193" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="508" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="513" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="267" y="602" font-size="18" fill="#596b85" font-weight="400" text-anchor="start">Order amount</text><text x="1030" y="602" font-size="23" fill="#405675" font-weight="650" text-anchor="end">CNY 100.00</text><text x="267" y="652" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">Your balance is credited in CNY. USD amounts are for reference.</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose a payment method</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The channel is fictional. Use a</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">method currently offered on the</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">page.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the input currency</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">This example uses CNY. USD input</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">requires confirming the CNY order</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> amount.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Pay using this order</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Follow its QR code or link, then</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">check Top-up History after</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">payment.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Cashier</text></g></svg>
