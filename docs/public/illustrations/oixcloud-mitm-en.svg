<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Install this device’s MITM certificate</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Install this device’s MITM certificate</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ MITM</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">MITM Certificates</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><text x="82" y="269" font-size="15" fill="#727279" font-weight="400" text-anchor="start">This Device</text><rect x="68" y="281" width="404" height="280" rx="14" fill="#fff" stroke="none"/><text x="84" y="308" font-size="20" fill="#202124" font-weight="400" text-anchor="start">oixCloud CA</text><text x="84" y="332" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">Root Certificate</text><path d="M84 349H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="281" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="285" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="290" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="382" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Install Trust Profile</text><path d="M84 402H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="349" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="353" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="358" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="435" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Export Public Certificate</text><path d="M84 455H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="488" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Replace Certificate on This Device</text><path d="M84 508H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="541" font-size="20" fill="#d23d3d" font-weight="400" text-anchor="start">Delete from This Device</text><text x="83" y="595" font-size="15" fill="#85858d" font-weight="400" text-anchor="start">Changes here affect only this device.</text><text x="82" y="650" font-size="15" fill="#727279" font-weight="400" text-anchor="start">oixCloud</text><rect x="68" y="662" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="695" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Status</text><text x="456" y="695" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Not logged in</text><path d="M84 715H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="748" font-size="20" fill="#a5a5ad" font-weight="400" text-anchor="start">Create and Use on This Device</text><path d="M84 768H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="801" font-size="20" fill="#a5a5ad" font-weight="400" text-anchor="start">Import PKCS#12 into Account</text><circle cx="468" cy="662" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="667" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Settings → MITM → MITM Certificates</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Inspect This Device</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">This example has a generated certificate</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">but no signed-in account.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Install Trust Profile</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Complete installation and full trust in</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">iOS Settings.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Manage account certificates</text><text x="598" y="814" font-size="23" fill="#273952" font-weight="600" text-anchor="start">separately</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Account actions are unavailable while</text><text x="552" y="884" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">signed out. Do not replace local</text><text x="552" y="915" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">certificates casually.</text></g></svg>
