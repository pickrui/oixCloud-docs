<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Review the account before deletion</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Review the account before deletion</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Delete Account</text><g transform="translate(-100 0)"><rect x="245" y="295" width="808" height="456" rx="12" fill="#fff" stroke="#d5deea"/><text x="273" y="340" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Account to delete</text><text x="273" y="377" font-size="20" fill="#405675" font-weight="400" text-anchor="start">reader@example.com</text><text x="273" y="414" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">Deletion is permanent. Balance and commission are forfeited.</text><rect x="259" y="305" width="760" height="127" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="309" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="314" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="273" y="474" font-size="19" fill="#32765e" font-weight="600" text-anchor="start">Passkey verified</text><text x="273" y="516" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Email code</text><rect x="273" y="528" width="425" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="286" y="557" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">—</text><rect x="734" y="526" width="267" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="867.5" y="552" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Send code</text><rect x="259" y="486" width="760" height="104" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="490" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="495" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="275" y="626" width="20" height="20" rx="3" fill="#fff" stroke="#8b9ab0"/><text x="310" y="643" font-size="16" fill="#596b85" font-weight="400" text-anchor="start">I understand the consequences and confirm that I want to delete my account</text><rect x="273" y="680" width="728" height="41" rx="7" fill="#d5dade" stroke="none"/><text x="637" y="706" font-size="16" fill="#56606b" font-weight="600" text-anchor="middle">Confirm Delete</text><rect x="260" y="606" width="759" height="128" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="610" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="615" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the account</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Check the email. Plans, balance,</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">commission and purchase records</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">will be lost.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Complete both checks</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Verify your identity, then enter</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the code sent to the account</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">email.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Confirm deletion</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Acknowledge the consequences and</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">confirm only when ready.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Account Settings → Go to account deletion</text></g></svg>
