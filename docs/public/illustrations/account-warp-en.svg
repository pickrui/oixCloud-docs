<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Check WARP fallback and the IPv4 Only override</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Check WARP fallback and the IPv4 Only override</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">WARP</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="43" rx="8" fill="#fff" stroke="#d5deea"/><text x="349" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Overview</text><text x="549" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Protocols</text><text x="749" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Relay</text><rect x="849" y="304" width="200" height="35" rx="6" fill="#e2edff" stroke="none"/><text x="949" y="327" font-size="15" fill="#326cc4" font-weight="600" text-anchor="middle">Exit</text><rect x="245" y="365" width="808" height="410" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="400" font-size="21" fill="#405675" font-weight="600" text-anchor="start">WARP</text><text x="267" y="435" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">Changes save automatically</text><text x="267" y="470" font-size="15" fill="#326cc4" font-weight="600" text-anchor="start">How it works and what to know ▾</text><rect x="267" y="497" width="400" height="39" rx="6" fill="#f7f9fc" stroke="#d5deea"/><text x="283" y="523" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">⌕ HK</text><rect x="680" y="500" width="84" height="33" rx="16" fill="#e2edff" stroke="#a9c3ee"/><text x="722" y="522" font-size="14" fill="#326cc4" font-weight="600" text-anchor="middle">All 3</text><rect x="768" y="500" width="84" height="33" rx="16" fill="#fff" stroke="#d5deea"/><text x="810" y="522" font-size="14" fill="#657b97" font-weight="600" text-anchor="middle">Enabled 2</text><rect x="856" y="500" width="84" height="33" rx="16" fill="#fff" stroke="#d5deea"/><text x="898" y="522" font-size="14" fill="#657b97" font-weight="600" text-anchor="middle">Disabled 1</text><rect x="944" y="500" width="84" height="33" rx="16" fill="#fff" stroke="#d5deea"/><text x="986" y="522" font-size="12.006319115323851" fill="#657b97" font-weight="600" text-anchor="middle">Unavailable 0</text><rect x="246" y="573" width="806" height="37" rx="0" fill="#edf2fa" stroke="none"/><rect x="267" y="583" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="293" y="598" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="start">Node</text><text x="582" y="598" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="middle">WARP</text><text x="724" y="598" font-size="15" fill="#5c6e89" font-weight="600" text-anchor="middle">Smart fallback</text><text x="925" y="598" font-size="15" fill="#5c6e89" font-weight="600" text-anchor="middle">Egress preference</text><rect x="267" y="626" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="642" font-size="18" fill="#314f78" font-weight="600" text-anchor="start">HK · Example A</text><rect x="557" y="621" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="592" cy="635.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="699" y="621" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="714" cy="635.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="841" y="617" width="168" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="883" y="642" font-size="16" fill="#222" font-weight="400" text-anchor="middle">IPv4</text><rect x="928" y="620" width="78" height="33" rx="6" fill="#fff" stroke="none"/><text x="967" y="642" font-size="16" fill="#222" font-weight="600" text-anchor="middle">IPv6</text><path d="M264 664H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="680" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="696" font-size="18" fill="#314f78" font-weight="600" text-anchor="start">HK · Example B</text><rect x="557" y="675" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="592" cy="689.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="699" y="675" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="734" cy="689.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="861" y="673" width="128" height="33" rx="7" fill="#e2edff" stroke="none"/><text x="925" y="696" font-size="16" fill="#326cc4" font-weight="600" text-anchor="middle">IPv4 Only</text><path d="M264 718H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="734" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="750" font-size="18" fill="#314f78" font-weight="600" text-anchor="start">HK · Example C</text><rect x="557" y="729" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="572" cy="743.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="724" y="750" font-size="18" fill="#8b9ab0" font-weight="400" text-anchor="middle">—</text><text x="925" y="750" font-size="18" fill="#8b9ab0" font-weight="400" text-anchor="middle">—</text><rect x="545" y="611" width="74" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="615" cy="615" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="615" y="620" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="687" y="665" width="74" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="757" cy="669" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="757" y="674" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="851" y="666" width="148" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="995" cy="670" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="995" y="675" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check relay cleanup first</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Enabling WARP deletes conflicting</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> relays. Turning it off does not</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">restore them.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose smart fallback</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Allows the node’s ordinary exit</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">if WARP fails. The IP or region</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">may change.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">IPv4 Only takes priority</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Preference is unavailable. Click</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">to manage; disabling restores the</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> saved preference.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Traffic Routes → Exit → WARP</text></g></svg>
