xt x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">使用表单编辑</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">常见规则在表单中设置，复杂表达式可编辑</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">规则文本</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">输入匹配内容与目标</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">目标必须存在于当前配置；示例为已有的工</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">作组</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">保存并检查配置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">保持规则模式，新建请求验证命中</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：配置覆写 → 编辑自定义 → 规则</text></g></svg>
