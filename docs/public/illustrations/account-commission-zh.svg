<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 确认提现金额与欠费抵扣</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">确认提现金额与欠费抵扣</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">申请提现</text><g transform="translate(-100 0)"><rect x="245" y="299" width="808" height="439" rx="12" fill="#fff" stroke="#d5deea"/><text x="275" y="350" font-size="24" fill="#405675" font-weight="600" text-anchor="start">确定提现 ¥200.00 吗？</text><text x="275" y="410" font-size="19" fill="#405675" font-weight="400" text-anchor="start">通过 TRC-20 提现到收款地址</text><text x="275" y="445" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">（地址已省略）</text><rect x="261" y="370" width="757" height="94" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="374" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="379" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="275" y="514" font-size="21" fill="#405675" font-weight="600" text-anchor="start">手续费 ¥20.00，实际到账 ¥180.00</text><rect x="261" y="473" width="757" height="66" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="477" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="482" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="275" y="591" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">账户余额欠费，先用佣金抵扣 ¥10.00</text><text x="275" y="627" font-size="20" fill="#94571f" font-weight="600" text-anchor="start">佣金共减少 ¥210.00</text><rect x="261" y="548" width="757" height="99" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="552" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="557" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="275" y="697" font-size="17" fill="#596b85" font-weight="400" text-anchor="start">用 Passkey 或当前密码验证</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对网络与地址</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">选择收款方支持的同一网络，逐字核对完整</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">地址</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对实际到账</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">示例申请 ¥200，扣除 ¥20 手续费后为 ¥</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">180 等值 USDT</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对佣金总扣减</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">示例先用 ¥10 抵扣欠费，佣金共减少 ¥</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">210</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 提现或转入余额 → 申请提现</text></g></svg>
