<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 找到未到账反馈按钮并提交原交易</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">找到未到账反馈按钮并提交原交易</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">收银台</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="162" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="338" font-size="22" fill="#405675" font-weight="600" text-anchor="start">虚拟币订单记录</text><text x="267" y="375" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">订单号</text><text x="535" y="375" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">充值金额</text><text x="267" y="422" font-size="19" fill="#405675" font-weight="400" text-anchor="start">EXAMPLE-ORDER</text><text x="535" y="422" font-size="19" fill="#405675" font-weight="400" text-anchor="start">CNY 80.00</text><rect x="777" y="392" width="253" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="903.5" y="418" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">未到账反馈</text><rect x="773" y="388" width="261" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="392" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="397" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="245" y="485" width="808" height="266" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="520" font-size="22" fill="#405675" font-weight="600" text-anchor="start">未到账反馈</text><text x="267" y="552" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">交易哈希值</text><rect x="267" y="564" width="763" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="593" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">TRANSACTION-HASH-PLACEHOLDER</text><rect x="263" y="560" width="771" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="564" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="569" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="267" y="643" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">问题描述</text><rect x="267" y="655" width="490" height="71" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="686" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">付款时间、网络及问题（选填）</text><rect x="787" y="686" width="243" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="908.5" y="712" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">提交</text><rect x="783" y="682" width="251" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="686" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="691" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">在完整收银台找原订单</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">付款区域下方显示记录；付款弹窗不显示此</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">列表</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">填写原交易的哈希</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">满 5 分钟后可首次反馈，须在创建后 48</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">小时内</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">提交后按结果继续</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">待确认时核对金额；自动核查或审核中无需</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">重提</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 收银台 → 虚拟币订单记录 → 未到账反馈</text></g></svg>
