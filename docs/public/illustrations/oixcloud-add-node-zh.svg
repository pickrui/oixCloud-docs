hor="start">代理 → 服务器 → 添加 → 链接</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">选择添加方式</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">按现有资料选择链接、二维码或手动</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">粘贴完整节点链接</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">不要填账户 Access Token；图中地址与凭据均为示</text><text x="552" y="589" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">例</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">继续并核对参数</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">保存后在主页或分流规则中选用新节点</text></g></svg>
