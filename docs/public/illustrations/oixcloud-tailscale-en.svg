<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Add and authorize a Tailscale network</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Add and authorize a Tailscale network</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ Tailscale</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Add Network</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">Save</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="269" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="302" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Network Name</text><text x="456" y="302" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Tailnet</text><path d="M84 322H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="269" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="273" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="278" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="355" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Device Name</text><text x="456" y="355" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">My iPhone</text><path d="M84 375H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="408" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Login</text><text x="444" y="408" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Interactive Login</text><path d="M454 398l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="470" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="503" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Automatic Routing</text><rect x="406" y="482" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="496.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="68" y="470" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="474" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="479" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="570" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="603" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Exit Node</text><text x="456" y="603" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">none</text><rect x="68" y="674" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="707" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Advanced</text><path d="M454 697l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="782" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="815" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Save and Log In</text><rect x="68" y="782" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="786" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="791" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Settings → Tailscale → Add Network</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Name the network and device</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">The names identify this network and this</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">device.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Keep Interactive Login</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Use Save and Log In, then authorize this</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">device in the browser.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check routing and the exit</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Automatic Routing handles peers and</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">approved subnets. Choose internet exit</text><text x="552" y="884" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">routing separately.</text></g></svg>
