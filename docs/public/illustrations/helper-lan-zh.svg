<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud Helper · 设置本地端口与局域网访问</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud Helper · macOS</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">设置本地端口与局域网访问</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#dfe7f3" stroke="none"/><rect x="30" y="130" width="1060" height="34" rx="14" fill="#f5f6f9" stroke="none"/><text x="53" y="153" font-size="15" fill="#384052" font-weight="400" text-anchor="start">●   Finder   文件   编辑   显示   前往   窗口</text><text x="1049" y="153" font-size="15" fill="#384052" font-weight="500" text-anchor="end">☁    09:41</text><rect x="155" y="219" width="815" height="425" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="173" y="253" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">SOCKS5 + HTTP  127.0.0.1:7100</text><text x="173" y="290" font-size="17" fill="#303946" font-weight="400" text-anchor="start">开机启动</text><text x="173" y="327" font-size="17" fill="#303946" font-weight="400" text-anchor="start">本地端口…</text><circle cx="962" cy="303" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="962" y="308" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="173" y="364" font-size="17" fill="#303946" font-weight="400" text-anchor="start">允许局域网访问</text><circle cx="962" cy="340" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="962" y="345" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="160" y="377" width="805" height="34" rx="6" fill="#2676df" stroke="none"/><text x="173" y="401" font-size="17" fill="#fff" font-weight="400" text-anchor="start">局域网访问鉴权…（已开启）</text><circle cx="962" cy="377" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="962" y="382" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="173" y="438" font-size="17" fill="#303946" font-weight="400" text-anchor="start">接入模式…（当前：单端口）</text><text x="173" y="475" font-size="17" fill="#303946" font-weight="400" text-anchor="start">节点筛选 · 智能优选</text><text x="173" y="512" font-size="17" fill="#303946" font-weight="400" text-anchor="start">精简规则</text><text x="173" y="549" font-size="17" fill="#303946" font-weight="400" text-anchor="start">复制本机节点列表 URL</text><text x="173" y="586" font-size="17" fill="#303946" font-weight="400" text-anchor="start">接入 Surge</text><text x="173" y="623" font-size="17" fill="#303946" font-weight="400" text-anchor="start">导出 OpenSurge 配置</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先核对端口用途</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">配置服务和代理是不同端口，填写时不要混</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">用</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先设置鉴权</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">局域网访问使用专用用户名与密码，不是账</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">户登录密码</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">再开启局域网访问</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">其他设备填写这台电脑的局域网 IP，修改</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">后更新配置</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：菜单栏 oixCloud → 连接设置</text></g></svg>
