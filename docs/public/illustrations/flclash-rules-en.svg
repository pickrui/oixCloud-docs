><rect x="40" y="335" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="359" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">Profiles</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><text x="76" y="719" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">Edit custom routing</text><rect x="30" y="165" width="1060" height="618" rx="0" fill="#00000044" stroke="none"/><rect x="256" y="235" width="608" height="503" rx="27" fill="#fff6f8" stroke="#ddcbd2"/><text x="280" y="277" font-size="26" fill="#8a5260" font-weight="400" text-anchor="start">‹</text><text x="560" y="278" font-size="23" fill="#332b2e" font-weight="600" text-anchor="middle">Add rule</text><text x="836" y="278" font-size="24" fill="#8a5260" font-weight="600" text-anchor="end">✓</text><circle cx="851" cy="253" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="851" y="258" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="280" y="308" width="560" height="39" rx="20" fill="#f7edef" stroke="#a8959a"/><rect x="283" y="311" width="274" height="33" rx="17" fill="#f0d9df" stroke="none"/><text x="420" y="333" font-size="16" fill="#593c44" font-weight="600" text-anchor="middle">Form</text><text x="700" y="333" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">Rule text</text><circle cx="846" cy="308" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="846" y="313" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="291" y="385" font-size="16" fill="#885461" font-weight="400" text-anchor="start">Basic info</text><text x="297" y="428" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Rule type</text><rect x="667.96" y="408" width="155.04000000000002" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="745.48" y="432" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">DOMAIN-SUFFIX</text><path d="M281 458H839" stroke="#ede5e8" stroke-width="1"/><text x="297" y="494" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Content</text><text x="297" y="518" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">example.com</text><path d="M281 535H839" stroke="#ede5e8" stroke-width="1"/><rect x="277" y="463" width="566" height="72" rx="10" fill="none" stroke="#d27336"/><circle cx="839" cy="467" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="839" y="472" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="297" y="577" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Rule target</text><rect x="717" y="557" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="770" y="581" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Work</text><path d="M281 607H839" stroke="#ede5e8" stroke-width="1"/><text x="291" y="645" font-size="16" fill="#885461" font-weight="400" text-anchor="start">Preview</text><text x="291" y="683" font-size="17" fill="#715564" font-weight="400" text-anchor="start">DOMAIN-SUFFIX,example.com,Work</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Use the Form editor</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Form and Rule text are separate</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">editing modes.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enter the match and target</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Basic info contains the type,</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">content and an existing rule</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">target.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Save with the top-right</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">checkmark</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">A preview is below. Check and</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">apply, then verify a new request.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Override → Edit custom routing → Rules → Add</text></g></svg>
