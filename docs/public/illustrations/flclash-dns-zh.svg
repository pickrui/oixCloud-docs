<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · 配置 DNS 覆写</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · 桌面端</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">配置 DNS 覆写</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">仪表盘</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">代理</text><text x="76" y="359" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">配置</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">请求</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">连接</text><rect x="40" y="623" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="647" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="674" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">工具</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">DNS</text><text x="1050" y="202" font-size="23" fill="#715f66" font-weight="500" text-anchor="middle">⋮</text><text x="170" y="277" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">覆写DNS</text><text x="170" y="301" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">开启后将覆盖配置中的DNS选项</text><rect x="985" y="261" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="1020" cy="275.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 318H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="246" width="906" height="72" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="250" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="255" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="170" y="360" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">状态</text><text x="170" y="384" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">关闭后将使用系统DNS</text><rect x="985" y="344" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="1020" cy="358.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 401H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="443" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">DNS模式</text><rect x="930" y="423" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="447" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">fake-ip</text><path d="M154 473H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="412" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="416" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="421" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="170" y="513" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">域名服务器</text><text x="170" y="537" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">用于解析域名</text><rect x="930" y="493" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="517" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">编辑</text><path d="M154 554H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="593" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">代理域名服务器</text><text x="170" y="617" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">用于解析代理节点的域名</text><rect x="930" y="573" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="597" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">编辑</text><path d="M154 634H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="673" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">遵守规则</text><text x="170" y="697" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">DNS连接跟随规则</text><rect x="985" y="657" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="1000" cy="671.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 714H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="642" width="906" height="72" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="646" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="651" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先看覆写开关</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">不开启覆写时，配置文件中的 DNS 设置仍</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">可能生效</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">一次修改一项</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">图中数值用于演示页面，不是推荐配置</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">应用后复查请求</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">使用同一个域名对比结果，无改善时恢复原</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">值</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：工具 → 进阶配置 → DNS</text></g></svg>
