<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 目标故障时是否允许入口出站</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">目标故障时是否允许入口出站</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">编辑单条规则</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="445" rx="12" fill="#fff" stroke="#d5deea"/><text x="275" y="351" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">入口节点</text><rect x="275" y="363" width="352" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="288" y="392" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">香港 · 示例 A</text><text x="664" y="351" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">目标节点</text><rect x="664" y="363" width="345" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="677" y="392" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">日本 · 示例 B</text><rect x="259" y="317" width="763" height="110" rx="10" fill="none" stroke="#d27336"/><circle cx="1018" cy="321" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1018" y="326" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="275" y="486" font-size="20" fill="#405675" font-weight="600" text-anchor="start">目标不可用时允许入口直接出站</text><rect x="276" y="510" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="291" cy="524.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="261" y="446" width="758" height="108" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="450" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="455" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="275" y="609" font-size="18" fill="#596b85" font-weight="400" text-anchor="start">没有可用目标时阻止连接</text><text x="275" y="647" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">开启后可能使用入口 IP</text><rect x="261" y="562" width="758" height="102" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="566" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="571" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="805" y="680" width="202" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="906" y="706" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">保存修改</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对入口和目标</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">客户端连入口，目标提供原定出口</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">固定出口保持关闭</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">匹配规则没有可用目标时，阻止新连接</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">开启前核对出口要求</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">开启后可能改用入口 IP；保存后用新连接</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">检查</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 内部中继 → 编辑单条规则</text></g></svg>
