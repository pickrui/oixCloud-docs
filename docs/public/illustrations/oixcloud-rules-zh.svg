<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 为网站添加路由规则</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">为网站添加路由规则</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ 策略</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">路由规则</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="45" y="234" width="450" height="688" rx="20" fill="#00000022" stroke="none"/><rect x="45" y="364" width="450" height="574" rx="26" fill="#f2f2f7" stroke="none"/><rect x="238" y="374" width="65" height="5" rx="3" fill="#c6c6ce" stroke="none"/><text x="71" y="416" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">取消</text><text x="270" y="416" font-size="21" fill="#111" font-weight="600" text-anchor="middle">添加规则</text><text x="467" y="416" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">添加</text><circle cx="482" cy="438" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="482" y="443" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="454" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="487" font-size="20" fill="#202124" font-weight="400" text-anchor="start">类型</text><text x="444" y="487" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">域名尾缀</text><path d="M454 477l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 507H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="454" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="458" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="463" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="540" font-size="20" fill="#202124" font-weight="400" text-anchor="start">example.com</text><path d="M84 560H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="593" font-size="20" fill="#202124" font-weight="400" text-anchor="start">扩展匹配</text><rect x="406" y="572" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="586.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="68" y="668" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="701" font-size="20" fill="#202124" font-weight="400" text-anchor="start">路由到</text><text x="444" y="701" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">工作</text><path d="M454 691l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="668" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="672" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="677" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="751" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">规则自上而下匹配，命中第一条即生效</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">代理 → 策略 → 路由规则</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">选择域名尾缀</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">输入 example.com，不带协议或路径</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">选择实际目标</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">示例选用已有的「工作」策略组</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">点添加</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">回到规则模式，重新访问目标网站核对命中结果</text></g></svg>
