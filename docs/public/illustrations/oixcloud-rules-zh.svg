<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 为网站指定路线</title><desc id="desc">操作位置与流程示意，具体界面以所用版本为准</desc><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',Arial,sans-serif"><rect x="0" y="0" width="1200" height="800" rx="24" fill="#f2f6f5" stroke="none"/><text x="38" y="43" font-size="23" font-weight="600" fill="#526772">oixCloud</text><text x="38" y="102" font-size="40" font-weight="750" fill="#162d39">为网站指定路线</text><text x="38" y="136" font-size="20" font-weight="400" fill="#526772">操作位置与流程示意，具体界面以所用版本为准</text><text x="795" y="44" font-size="18" font-weight="600" fill="#526772">模拟界面 · 示例数据</text><rect x="132" y="168" width="448" height="570" rx="30" fill="#fff" stroke="#cfdbd7"/><rect x="133" y="169" width="446" height="62" rx="29" fill="#e8eeeb" stroke="none"/><text x="157" y="208" font-size="25" font-weight="700" fill="#162d39">添加规则</text><text x="156" y="276" font-size="19" font-weight="400" fill="#526772">规则类型</text><rect x="156" y="290" width="400" height="58" rx="14" fill="#f3f6f4" stroke="none"/><text x="172" y="327" font-size="22" font-weight="600" fill="#162d39">域名后缀</text><rect x="153" y="287" width="406" height="64" rx="12" fill="none" stroke="#16765b"/><circle cx="559" cy="287" r="17" fill="#16765b"/><text x="553" y="294" font-size="21" font-weight="700" fill="#fff">1</text><text x="156" y="387" font-size="19" font-weight="400" fill="#526772">匹配值</text><rect x="156" y="401" width="400" height="58" rx="14" fill="#f3f6f4" stroke="none"/><text x="172" y="438" font-size="22" font-weight="600" fill="#162d39">example.com</text><text x="156" y="498" font-size="19" font-weight="400" fill="#526772">目标策略</text><rect x="156" y="512" width="400" height="58" rx="14" fill="#f3f6f4" stroke="none"/><text x="172" y="549" font-size="22" font-weight="600" fill="#162d39">工作</text><rect x="153" y="509" width="406" height="64" rx="12" fill="none" stroke="#16765b"/><circle cx="559" cy="509" r="17" fill="#16765b"/><text x="553" y="516" font-size="21" font-weight="700" fill="#fff">2</text><rect x="156" y="612" width="400" height="60" rx="14" fill="#16765b" stroke="none"/><text x="329" y="651" font-size="23" font-weight="650" fill="#fff">保存</text><circle cx="556" cy="612" r="17" fill="#16765b"/><text x="550" y="619" font-size="21" font-weight="700" fill="#fff">3</text><text x="161" y="707" font-size="19" font-weight="400" fill="#526772">保存后重新发起请求</text><circle cx="801" cy="205" r="17" fill="#16765b"/><text x="795" y="212" font-size="21" font-weight="700" fill="#fff">1</text><text x="834" y="213" font-size="23" font-weight="700" fill="#162d39">选择匹配类型</text><text x="782" y="253" font-size="18" font-weight="400" fill="#526772">用域名后缀匹配 example.com</text><text x="782" y="283" font-size="18" font-weight="400" fill="#526772">无需填写 https:// 或网页路径</text><circle cx="801" cy="372" r="17" fill="#16765b"/><text x="795" y="379" font-size="21" font-weight="700" fill="#fff">2</text><text x="834" y="380" font-size="23" font-weight="700" fill="#162d39">设置目标策略</text><text x="782" y="420" font-size="18" font-weight="400" fill="#526772">选择已有节点或策略组</text><text x="782" y="450" font-size="18" font-weight="400" fill="#526772">示例将匹配流量送往「工作」组</text><circle cx="801" cy="539" r="17" fill="#16765b"/><text x="795" y="546" font-size="21" font-weight="700" fill="#fff">3</text><text x="834" y="547" font-size="23" font-weight="700" fill="#162d39">保存并验证</text><text x="782" y="587" font-size="18" font-weight="400" fill="#526772">保持规则模式</text><text x="782" y="617" font-size="18" font-weight="400" fill="#526772">重新访问目标网站，检查命中记录</text></g></svg>
