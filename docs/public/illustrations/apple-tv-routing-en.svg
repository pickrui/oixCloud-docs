<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixFlow · Choose an outbound with the remote</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixFlow · Apple TV</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose an outbound with the remote</text><rect x="30" y="130" width="1060" height="653" rx="16" fill="#e9edf4" stroke="none"/><text x="84" y="206" font-size="38" fill="#25354d" font-weight="650" text-anchor="start">Select Proxy</text><text x="1036" y="205" font-size="20" fill="#42668e" font-weight="500" text-anchor="end">Test All</text><circle cx="64" cy="193" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="64" y="198" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="80" y="254" width="960" height="76" rx="13" fill="#f8faff" stroke="none"/><text x="111" y="302" font-size="25" fill="#344961" font-weight="550" text-anchor="start">Best Available · URL Test</text><text x="85" y="394" font-size="20" fill="#657a91" font-weight="550" text-anchor="start">Chains</text><rect x="80" y="418" width="960" height="76" rx="13" fill="#fff" stroke="#b6c8df"/><text x="110" y="467" font-size="26" fill="#263951" font-weight="600" text-anchor="start">Work Chain</text><rect x="76" y="414" width="968" height="84" rx="10" fill="none" stroke="#d27336"/><circle cx="1040" cy="418" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1040" y="423" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="85" y="555" font-size="20" fill="#657a91" font-weight="550" text-anchor="start">oixCloud</text><rect x="80" y="578" width="960" height="76" rx="13" fill="#f8faff" stroke="none"/><text x="110" y="626" font-size="24" fill="#344961" font-weight="500" text-anchor="start">Hong Kong · Sample A</text><path d="M80 690H1040" stroke="#cad6e3" stroke-width="1"/><text x="107" y="740" font-size="18" fill="#62758b" font-weight="550" text-anchor="start">To assign a group to a rule set</text><text x="390" y="740" font-size="22" fill="#354e68" font-weight="550" text-anchor="start">Settings → Routing Rules</text><circle cx="1022" cy="727" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1022" y="732" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Open the node card</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Select a node, a chain or Best</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Available if it has members.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Select an existing chain</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Create new groups and chains on</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">iPhone or iPad, then sync.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Route a service to a group</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Set Mode to Rule in Settings.</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Choose the group in Routing Rules</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Home → Current node card → Select Proxy</text></g></svg>
