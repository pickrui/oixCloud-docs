<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixClash · 筛选后更新路由器节点</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixClash · Merlin 路由器</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">筛选后更新路由器节点</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#20333e" stroke="none"/><rect x="220" y="149" width="849" height="611" rx="4" fill="#4d595d" stroke="none"/><text x="48" y="174" font-size="20" fill="#d5e4e8" font-weight="700" text-anchor="start">ASUSWRT</text><text x="241" y="181" font-size="24" fill="#fff" font-weight="600" text-anchor="start">软件中心 - oixClash</text><rect x="43" y="205" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="234" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">网络地图</text><rect x="43" y="256" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="285" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">AiMesh</text><rect x="43" y="307" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="336" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">访客网络</text><rect x="43" y="358" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="387" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">流量分析</text><rect x="43" y="409" width="164" height="46" rx="3" fill="#387aa0" stroke="none"/><text x="60" y="438" font-size="17" fill="#f2f6f8" font-weight="600" text-anchor="start">软件中心</text><rect x="43" y="460" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="489" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">无线网络</text><rect x="43" y="511" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="540" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">内部网络</text><rect x="43" y="562" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="591" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">外部网络</text><rect x="43" y="613" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="642" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">IPv6</text><rect x="43" y="664" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="693" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">系统管理</text><text x="243" y="216" font-size="17" fill="#dbe7eb" font-weight="400" text-anchor="start">登录后，主局域网设备使用 oixCloud 的节点和分流规则</text><rect x="239" y="246" width="811" height="33" rx="0" fill="#73838a" stroke="none"/><text x="252" y="269" font-size="17" fill="#fff" font-weight="600" text-anchor="start">oixCloud 账号</text><rect x="239" y="279" width="811" height="78" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="279" width="164" height="78" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="311" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">账号</text><text x="422" y="325" font-size="19" fill="#fff" font-weight="400" text-anchor="start">reader@example.com</text><text x="655" y="324" font-size="17" fill="#8bddf2" font-weight="400" text-anchor="start">刷新</text><circle cx="709" cy="299" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="709" y="304" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="754" y="324" font-size="17" fill="#8bddf2" font-weight="400" text-anchor="start">节点筛选</text><circle cx="870" cy="299" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="870" y="304" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="239" y="357" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="357" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="389" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">套餐</text><text x="422" y="391" font-size="18" fill="#fff" font-weight="400" text-anchor="start">Pass Silver</text><rect x="239" y="410" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="410" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="442" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">流量</text><text x="422" y="444" font-size="18" fill="#fff" font-weight="400" text-anchor="start">18 GB / 200 GB</text><text x="640" y="530" font-size="31" fill="#c8d7dd" font-weight="500" text-anchor="middle">⋮</text><rect x="361" y="599" width="185" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="453.5" y="623" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">保存并应用</text><rect x="568" y="599" width="173" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="654.5" y="623" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">更新节点</text><rect x="564" y="595" width="181" height="44" rx="10" fill="none" stroke="#d27336"/><circle cx="741" cy="599" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="741" y="604" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="762" y="599" width="132" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="828" y="623" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">自检</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">打开节点筛选</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">在账号旁打开网站，预览要保留的节点并保</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">存</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">回插件更新节点</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">运行时点页面底部的更新节点，未运行时下</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">次开启会获取</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">区分账号刷新</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">账号旁的刷新只更新套餐与流量</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：软件中心 → oixClash → oixCloud 账号</text></g></svg>
