<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 导入、更新与排列模块</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">导入、更新与排列模块</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ 策略</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">模块</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="271" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="304" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">导入模块</text><path d="M84 324H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="271" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="275" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="280" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="357" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">订阅模块</text><rect x="68" y="429" width="404" height="136" rx="14" fill="#fff" stroke="none"/><text x="84" y="456" font-size="20" fill="#202124" font-weight="400" text-anchor="start">示例规则模块</text><text x="84" y="480" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">订阅 · 上次更新：刚刚</text><rect x="406" y="441" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="455.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 497H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="429" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="433" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="438" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="524" font-size="20" fill="#202124" font-weight="400" text-anchor="start">示例脚本模块</text><text x="84" y="548" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">文件 · 已停用</text><rect x="406" y="509" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="523.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="68" y="646" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="679" font-size="20" fill="#202124" font-weight="400" text-anchor="start">生效顺序</text><path d="M454 669l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 699H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="646" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="650" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="655" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="84" y="732" font-size="20" fill="#202124" font-weight="400" text-anchor="start">模块说明</text><path d="M454 722l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">代理 → 策略 → 模块</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">选择导入或订阅</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">文件用导入，持续更新的资源可用订阅</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">核对模块状态</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">示例名称与内容均为虚构；按用途启用</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">检查生效顺序</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">多个模块影响相同域名时，顺序会影响 DNS、重写和</text><text x="552" y="765" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">脚本</text></g></svg>
