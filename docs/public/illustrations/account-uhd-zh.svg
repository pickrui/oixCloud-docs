<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 选择兑换或关联 UHD 账户</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">选择兑换或关联 UHD 账户</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">权益中心</text><g transform="translate(-100 0)"><rect x="245" y="302" width="808" height="425" rx="12" fill="#fff" stroke="#d5deea"/><text x="275" y="356" font-size="28" fill="#405675" font-weight="650" text-anchor="start">Emby</text><path d="M275 380H1018" stroke="#dedee3" stroke-width="1"/><text x="275" y="430" font-size="23" fill="#405675" font-weight="600" text-anchor="start">兑换 Emby 权益</text><text x="275" y="479" font-size="19" fill="#405675" font-weight="400" text-anchor="start">5 枚权益额度兑换 365 天 Emby 服务</text><rect x="262" y="441" width="756" height="60" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="445" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="450" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="275" y="547" font-size="17" fill="#94571f" font-weight="400" text-anchor="start">UHD 账号到期后会自动删除</text><rect x="275" y="596" width="285" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="417.5" y="622" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">立即兑换</text><rect x="271" y="592" width="293" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="560" cy="596" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="560" y="601" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="610" y="596" width="385" height="40" rx="7" fill="#fff" stroke="#708ab7"/><text x="802" y="622" font-size="17" fill="#476394" font-weight="600" text-anchor="middle">关联已有 UHD 账号</text><rect x="606" y="592" width="393" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="995" cy="596" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="995" y="601" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="275" y="685" font-size="17" fill="#596b85" font-weight="400" text-anchor="start">已有 UHD 账号可直接关联，不消耗额度</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对权益额度与天数</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">首次兑换需要有效套餐，普通账户使用权益</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">额度</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">没有 UHD 账户</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">选择立即兑换，设置 UHD 用户名和密码</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">已有 UHD 账户</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">选择关联已有账户，验证通过后无需消耗额</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">度</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 权益中心 → Emby</text></g></svg>
