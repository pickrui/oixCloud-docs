<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 在节点列表查看具体节点</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在节点列表查看具体节点</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">节点列表</text><g transform="translate(-100 0)"><rect x="245" y="306" width="808" height="58" rx="10" fill="#fff" stroke="none"/><text x="267" y="344" font-size="19" fill="#8b9ab0" font-weight="400" text-anchor="start">⌕ 搜索节点</text><rect x="245" y="389" width="808" height="268" rx="12" fill="#fff" stroke="none"/><text x="272" y="434" font-size="25" fill="#355681" font-weight="650" text-anchor="start">香港 · 示例 A</text><rect x="261" y="402" width="353" height="49" rx="10" fill="none" stroke="#d27336"/><circle cx="610" cy="406" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="610" y="411" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="274" y="480" font-size="18" fill="#6d83a1" font-weight="400" text-anchor="start">Fusion  ·  香港</text><rect x="270" y="506" width="260" height="48" rx="9" fill="#edf4ff" stroke="none"/><text x="289" y="537" font-size="18" fill="#4c71a5" font-weight="400" text-anchor="start">倍率 1×（示例）</text><rect x="263" y="500" width="278" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="537" cy="504" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="537" y="509" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="271" y="583" width="158" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="350" y="609" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">配置信息</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先选择有权限的节点</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">按需要的地区和线路查找，列表取决于账户</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">查看倍率与连接方式</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">展开目标节点，按客户端支持的方式获取信</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">息</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">回到客户端验证</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">更新托管节点后选择它，连接记录核对实际</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">出口</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 节点列表 → 节点卡片</text></g></svg>
