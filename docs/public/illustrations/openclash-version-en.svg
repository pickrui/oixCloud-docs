<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">OpenClash · Update or replace the oix core in Version Update</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Update or replace the oix core in Version Update</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">Services</text><text x="333" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="63" y="231" font-size="30" fill="#333" font-weight="650" text-anchor="start">OpenClash</text><rect x="64" y="261" width="991" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="187.875" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Running status</text><rect x="314.75" y="264" width="241.75" height="33" rx="6" fill="#fff" stroke="none"/><text x="435.625" y="286" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Plugin settings</text><text x="683.375" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Profile subscriptions</text><text x="931.125" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Profile management</text><rect x="64" y="329" width="991" height="100" rx="8" fill="#fff" stroke="#ddd"/><text x="86" y="364" font-size="18" fill="#444" font-weight="600" text-anchor="start">CPU Architecture &amp; Compiled Version</text><text x="86" y="404" font-size="18" fill="#333" font-weight="400" text-anchor="start">CPU: ARMv8 Processor rev 4 (aarch64) · Build: linux-arm64</text><rect x="496" y="376" width="218" height="46" rx="10" fill="none" stroke="#d27336"/><circle cx="710" cy="380" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="710" y="385" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="64" y="449" width="991" height="220" rx="8" fill="#fff" stroke="#ddd"/><text x="86" y="484" font-size="18" fill="#444" font-weight="600" text-anchor="start">Core and Plugin Updates</text><text x="86" y="530" font-size="18" fill="#666" font-weight="400" text-anchor="start">OpenClash Plugin</text><text x="330" y="530" font-size="18" fill="#333" font-weight="400" text-anchor="start">Current: v0.46.066</text><text x="650" y="530" font-size="18" fill="#3c9d75" font-weight="400" text-anchor="start">Latest: v0.46.066 (Up to date)</text><text x="86" y="590" font-size="18" fill="#666" font-weight="400" text-anchor="start">Meta / oix Core</text><text x="330" y="590" font-size="18" fill="#333" font-weight="400" text-anchor="start">Current: alpha-oix-20261028</text><rect x="650" y="568" width="180" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="740" y="594" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Update oix Core</text><rect x="646" y="564" width="188" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="830" cy="568" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="830" y="573" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="850" y="590" font-size="17" fill="#466b96" font-weight="400" text-anchor="start">Latest: alpha-oix-latest</text><text x="86" y="645" font-size="17" fill="#777" font-weight="400" text-anchor="start">Target: /etc/openclash/core/clash_meta (chmod 4755)</text><rect x="76" y="621" width="588" height="43" rx="10" fill="none" stroke="#d27336"/><circle cx="660" cy="625" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="660" y="630" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Verify CPU compiled</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">version</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Check the target architecture at</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the top of the page, such as</text><text x="42" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">linux-arm64 or linux-amd64-v1.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Update or replace the core</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Click the version link in the</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Meta / oix core row to fetch the</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">latest core package.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the installed result</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Verify the version and a</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">connection. Small-flash mode uses</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> temporary storage.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: LuCI → Services → OpenClash → Plugin Settings → Version Update</text></g></svg>
