<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Import and manage modules</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Import and manage modules</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ Policies</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Modules</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="267" width="404" height="212" rx="14" fill="#fff" stroke="none"/><text x="84" y="300" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Add Module</text><path d="M84 320H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="353" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Import Module</text><path d="M84 373H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="320" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="324" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="329" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="406" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Subscribe Module</text><path d="M84 426H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="459" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Kelee Module Hub</text><rect x="68" y="528" width="404" height="136" rx="14" fill="#fff" stroke="none"/><text x="84" y="555" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Example Rules</text><text x="84" y="579" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">Subscription · Updated just now</text><rect x="406" y="540" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="554.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 596H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="528" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="532" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="537" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="623" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Example Script</text><text x="84" y="647" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">File · Disabled</text><rect x="406" y="608" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="622.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="68" y="717" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="750" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Module Order</text><path d="M454 740l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="717" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="721" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="726" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="819" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="852" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Module Guide</text><path d="M454 842l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Proxies → Policies → Modules</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Choose import or subscription</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Add Module, Import Module, Subscribe</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Module and Kelee Module Hub are separate</text><text x="552" y="444" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">actions.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Inspect the module state</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Names and content are fictional. Enable</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">what you need; long-press for actions.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check Module Order</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Adjust runtime priority here when modules</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">affect the same domain.</text></g></svg>
