<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Check upgrade cost and remaining data</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Check upgrade cost and remaining data</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Plan Management</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="451" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="340" font-size="24" fill="#405675" font-weight="600" text-anchor="start">Change / Upgrade</text><text x="267" y="380" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Select target plan</text><rect x="267" y="392" width="763" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="421" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Example plan B · Quarterly</text><rect x="263" y="388" width="771" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="392" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="397" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="469" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">Coupon code (optional)</text><rect x="267" y="482" width="560" height="40" rx="7" fill="#fff" stroke="#d5deea"/><rect x="850" y="482" width="180" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="940" y="508" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Verify</text><text x="267" y="567" font-size="20" fill="#596b85" font-weight="600" text-anchor="start">Actual payment amount:</text><text x="1030" y="567" font-size="24" fill="#405675" font-weight="600" text-anchor="end">CNY 50.00</text><text x="267" y="611" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">High-speed data after upgrade</text><text x="1030" y="611" font-size="20" fill="#405675" font-weight="600" text-anchor="end">120.00 GiB</text><text x="267" y="647" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">Net data change</text><text x="1030" y="647" font-size="20" fill="#405675" font-weight="600" text-anchor="end">+70.00 GiB</text><rect x="255" y="533" width="787" height="131" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="537" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="542" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="690" y="697" width="340" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="860" y="723" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Confirm Change / Upgrade</text><rect x="686" y="693" width="348" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="697" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="702" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose the target plan</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Start from the original record.</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The target must support its</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">billing period.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check cost and data</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Ordinary upgrades keep used data</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">and expiry; they do not grant a</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">fresh full allowance.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Verify the updated record</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Check the target, balance,</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">renewal price and switch after</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">confirmation.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Plan Management → Upgrade / Change</text></g></svg>
