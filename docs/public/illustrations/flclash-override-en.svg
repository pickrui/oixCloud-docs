width="878" height="39" rx="20" fill="#f7edef" stroke="#a8959a"/><text x="308.33333333333337" y="317" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">Standard</text><rect x="457.6666666666667" y="295" width="286.6666666666667" height="33" rx="17" fill="#f0d9df" stroke="none"/><text x="601" y="317" font-size="16" fill="#593c44" font-weight="600" text-anchor="middle">Overlay</text><text x="893.6666666666667" y="317" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">Custom</text><circle cx="1046" cy="294" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1046" y="299" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="162" y="362" width="878" height="94" rx="17" fill="#f4e7ed" stroke="none"/><text x="182" y="400" font-size="21" fill="#654554" font-weight="400" text-anchor="start">Keep subscription rules and groups, then add personal settings.</text><text x="182" y="430" font-size="17" fill="#876675" font-weight="400" text-anchor="start">Personal rules precede subscription rules; existing added rules keep priority.</text><text x="166" y="502" font-size="16" fill="#885461" font-weight="600" text-anchor="start">Proxy chains</text><text x="170" y="565" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Proxy group</text><path d="M154 595H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="639" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Rule</text><path d="M154 669H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="608" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="612" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="617" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose Overlay</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Keep the subscription and add a</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">personal exception.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Open Rule or Proxy group</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">These sections on the Overlay</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">page apply to this profile.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check and apply</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Use the title-bar check and Apply</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> now to validate and apply</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">changes.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Profile menu → Override</text></g></svg>
