<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">OpenClash · Add a domain rule on the router</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Add a domain rule on the router</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="64" y="241" font-size="30" fill="#333" font-weight="650" text-anchor="start">Overwrite Settings</text><text x="66" y="302" font-size="22" fill="#376b91" font-weight="600" text-anchor="start">Rules Setting</text><rect x="64" y="336" width="990" height="386" rx="8" fill="#fff" stroke="#ddd"/><text x="92" y="393" font-size="21" fill="#334455" font-weight="600" text-anchor="start">☑  Custom Clash Rules</text><circle cx="358" cy="369" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="358" y="374" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="92" y="459" font-size="18" fill="#426b58" font-weight="600" text-anchor="start">Priority</text><rect x="92" y="480" width="933" height="139" rx="5" fill="#f8fafc" stroke="#d2dce5"/><text x="114" y="527" font-size="20" fill="#405369" font-weight="400" text-anchor="start">rules:</text><text x="135" y="569" font-size="20" fill="#405369" font-weight="400" text-anchor="start">- DOMAIN-SUFFIX,example.com,DIRECT</text><circle cx="1004" cy="490" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1004" y="495" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="808" y="649" width="216" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="916" y="675" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Apply Settings</text><rect x="804" y="645" width="224" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1024" cy="649" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1024" y="654" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enable custom rules</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Open Rules Setting under</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Overwrite Settings.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Use the Priority box</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Under the existing rules: key,</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">add the domain and a target from</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the active profile.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Apply and verify</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Click Apply Settings. When the</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">core is running, revisit the site</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> from a LAN device.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Overwrite Settings → Rules Setting → Custom Clash Rules</text></g></svg>
