<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 首次生成 MITM 证书</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">首次生成 MITM 证书</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ MITM</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">MITM 证书</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><text x="82" y="275" font-size="15" fill="#727279" font-weight="400" text-anchor="start">此设备</text><rect x="68" y="287" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="320" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">生成证书</text><rect x="68" y="287" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="291" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="296" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="469" cy="268" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="469" y="273" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="83" y="377" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">此处的更改仅影响此设备</text><text x="82" y="442" font-size="15" fill="#727279" font-weight="400" text-anchor="start">oixCloud</text><rect x="68" y="454" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="487" font-size="20" fill="#202124" font-weight="400" text-anchor="start">状态</text><text x="456" y="487" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">尚未获取</text><path d="M84 507H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="540" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">将 PKCS#12 导入账号</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">设置 → MITM → MITM 证书</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">检查此设备</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">首次使用且没有证书时显示生成入口</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">点生成证书</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">生成后才会出现安装信任描述文件等操作</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">继续安装与信任</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">回到证书页安装描述文件，再到 iOS 的证书信任设置</text><text x="552" y="765" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">完成信任</text></g></svg>
