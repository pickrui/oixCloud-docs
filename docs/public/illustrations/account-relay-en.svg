<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Arrange entry and exit in the path editor</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Arrange entry and exit in the path editor</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Add path</text><g transform="translate(-100 0)"><text x="247" y="318" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Priority</text><rect x="247" y="330" width="357" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="260" y="359" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Priority 1</text><rect x="245" y="398" width="471" height="335" rx="12" fill="#fff" stroke="none"/><text x="267" y="435" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Node order</text><text x="268" y="473" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Entry</text><rect x="268" y="485" width="422" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="281" y="514" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">HK · Example A</text><rect x="264" y="481" width="430" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="690" cy="485" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="690" y="490" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="602" y="473" font-size="16" fill="#7b8ba2" font-weight="400" text-anchor="start">↑  ↓  ×</text><text x="268" y="569" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Exit</text><rect x="268" y="581" width="422" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="281" y="610" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">JP · Example B</text><text x="602" y="569" font-size="16" fill="#7b8ba2" font-weight="400" text-anchor="start">↑  ↓  ×</text><rect x="268" y="681" width="154" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="345" y="707" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Add node</text><rect x="739" y="398" width="314" height="214" rx="12" fill="#fff" stroke="none"/><text x="762" y="435" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Path preview</text><text x="764" y="480" font-size="18" fill="#202124" font-weight="400" text-anchor="start">HK · Example A</text><text x="782" y="515" font-size="22" fill="#4c74d8" font-weight="400" text-anchor="start">↓</text><text x="764" y="554" font-size="18" fill="#202124" font-weight="400" text-anchor="start">JP · Example B</text><rect x="746" y="447" width="294" height="130" rx="10" fill="none" stroke="#d27336"/><circle cx="1036" cy="451" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1036" y="456" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="742" y="640" width="190" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="837" y="666" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Save path</text><rect x="738" y="636" width="198" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="932" cy="640" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="932" y="645" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Select nodes in forwarding</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start"> order</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The first node is the client’s</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">entry and the last node is the</text><text x="42" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">exit.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Add intermediate hops if</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">needed</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Use the row controls and check</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Path preview on the right.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Review the effect before</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">saving</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">If shared segments are affected,</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">review the named rules before</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">confirming.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Internal relay → Add path</text></g></svg>
