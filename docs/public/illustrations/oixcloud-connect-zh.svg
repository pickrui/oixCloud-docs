<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 首次连接</title><desc id="desc">操作位置与流程示意，具体界面以所用版本为准</desc><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',Arial,sans-serif"><rect x="0" y="0" width="1200" height="800" rx="24" fill="#f2f6f5" stroke="none"/><text x="38" y="43" font-size="23" font-weight="600" fill="#526772">oixCloud</text><text x="38" y="102" font-size="40" font-weight="750" fill="#162d39">首次连接</text><text x="38" y="136" font-size="20" font-weight="400" fill="#526772">操作位置与流程示意，具体界面以所用版本为准</text><text x="795" y="44" font-size="18" font-weight="600" fill="#526772">模拟界面 · 示例数据</text><rect x="132" y="168" width="448" height="570" rx="30" fill="#fff" stroke="#cfdbd7"/><rect x="133" y="169" width="446" height="62" rx="29" fill="#e8eeeb" stroke="none"/><text x="157" y="208" font-size="25" font-weight="700" fill="#162d39">首页</text><rect x="156" y="256" width="400" height="65" rx="14" fill="#f3f6f4" stroke="none"/><text x="174" y="285" font-size="20" font-weight="650" fill="#16765b">账户已登录</text><text x="174" y="309" font-size="18" font-weight="400" fill="#526772">oixCloud</text><rect x="153" y="253" width="406" height="71" rx="12" fill="none" stroke="#16765b"/><circle cx="559" cy="253" r="17" fill="#16765b"/><text x="553" y="260" font-size="21" font-weight="700" fill="#fff">1</text><text x="156" y="366" font-size="19" font-weight="400" fill="#526772">运行模式</text><rect x="156" y="380" width="128.33333333333334" height="42" rx="10" fill="#d9eee5" stroke="none"/><text x="168" y="408" font-size="18" font-weight="650" fill="#13543e">规则</text><rect x="289.33333333333337" y="380" width="128.33333333333334" height="42" rx="10" fill="#eef2f3" stroke="none"/><text x="301.33333333333337" y="408" font-size="18" font-weight="400" fill="#526772">全局</text><rect x="422.6666666666667" y="380" width="128.33333333333334" height="42" rx="10" fill="#eef2f3" stroke="none"/><text x="434.6666666666667" y="408" font-size="18" font-weight="400" fill="#526772">直连</text><rect x="153" y="377" width="406" height="48" rx="12" fill="none" stroke="#16765b"/><circle cx="559" cy="377" r="17" fill="#16765b"/><text x="553" y="384" font-size="21" font-weight="700" fill="#fff">2</text><text x="156" y="471" font-size="19" font-weight="400" fill="#526772">当前选择</text><rect x="156" y="485" width="400" height="64" rx="14" fill="#f3f6f4" stroke="none"/><text x="172" y="526" font-size="20" font-weight="650" fill="#162d39">香港 · 示例 A</text><rect x="156" y="580" width="400" height="62" rx="31" fill="#16765b" stroke="none"/><text x="318" y="620" font-size="24" font-weight="650" fill="#fff">连接</text><circle cx="556" cy="580" r="17" fill="#16765b"/><text x="550" y="587" font-size="21" font-weight="700" fill="#fff">3</text><text x="166" y="694" font-size="19" font-weight="400" fill="#526772">示例：准备连接</text><circle cx="801" cy="205" r="17" fill="#16765b"/><text x="795" y="212" font-size="21" font-weight="700" fill="#fff">1</text><text x="834" y="213" font-size="23" font-weight="700" fill="#162d39">确认账户与配置</text><text x="782" y="253" font-size="18" font-weight="400" fill="#526772">先完成登录并等待节点加载</text><text x="782" y="283" font-size="18" font-weight="400" fill="#526772">自有节点可从「代理」导入</text><circle cx="801" cy="372" r="17" fill="#16765b"/><text x="795" y="379" font-size="21" font-weight="700" fill="#fff">2</text><text x="834" y="380" font-size="23" font-weight="700" fill="#162d39">选择规则模式</text><text x="782" y="420" font-size="18" font-weight="400" fill="#526772">从一个可用节点开始</text><text x="782" y="450" font-size="18" font-weight="400" fill="#526772">保持默认设置，先验证连接</text><circle cx="801" cy="539" r="17" fill="#16765b"/><text x="795" y="546" font-size="21" font-weight="700" fill="#fff">3</text><text x="834" y="547" font-size="23" font-weight="700" fill="#162d39">启动并检查</text><text x="782" y="587" font-size="18" font-weight="400" fill="#526772">允许系统添加 VPN 配置</text><text x="782" y="617" font-size="18" font-weight="400" fill="#526772">打开目标网站，再看连接记录</text></g></svg>
