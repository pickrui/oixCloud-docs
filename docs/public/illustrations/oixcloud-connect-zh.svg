<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 主页连接与节点选择</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">主页连接与节点选择</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="67" y="234" font-size="37" fill="#111" font-weight="700" text-anchor="start">主页</text><rect x="49" y="854" width="442" height="63" rx="27" fill="#fcfcfd" stroke="#e4e4e9"/><text x="93" y="880" font-size="23" fill="#007aff" font-weight="500" text-anchor="middle">⌂</text><text x="93" y="900" font-size="12" fill="#007aff" font-weight="500" text-anchor="middle">主页</text><text x="180" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">▤</text><text x="180" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">代理</text><text x="267" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">◴</text><text x="267" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">活动</text><text x="354" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">☁</text><text x="354" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">oixCloud</text><text x="441" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">⚙</text><text x="441" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">设置</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="67" y="264" width="406" height="227" rx="22" fill="#fff" stroke="none"/><text x="89" y="297" font-size="17" fill="#727279" font-weight="600" text-anchor="start">状态</text><rect x="149" y="278" width="88" height="27" rx="14" fill="#eeeef2" stroke="none"/><text x="193" y="297" font-size="14" fill="#727279" font-weight="500" text-anchor="middle">未连接</text><text x="89" y="342" font-size="15" fill="#85858d" font-weight="400" text-anchor="start">已运行</text><text x="89" y="375" font-size="24" fill="#333" font-weight="600" text-anchor="start">—</text><text x="221" y="342" font-size="15" fill="#85858d" font-weight="400" text-anchor="start">连接数</text><text x="221" y="375" font-size="24" fill="#333" font-weight="600" text-anchor="start">—</text><circle cx="406" cy="353" r="40" fill="#e3edff" stroke="none" stroke-width="1"/><path d="M389 338a25 25 0 1 0 34 0M406 326v28" fill="none" stroke="#007aff" stroke-width="6" stroke-linecap="round"/><circle cx="450" cy="279" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="450" y="284" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="89" y="433" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">↑  —     上传</text><text x="265" y="433" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">↓  —     下载</text><rect x="68" y="515" width="404" height="68" rx="14" fill="#fff" stroke="none"/><text x="84" y="542" font-size="20" fill="#202124" font-weight="400" text-anchor="start">香港 · 示例 A</text><text x="84" y="566" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">oixCloud</text><path d="M454 538l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="515" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="519" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="524" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="69" y="618" width="402" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="72" y="621" width="128" height="33" rx="6" fill="#fff" stroke="none"/><text x="136" y="643" font-size="16" fill="#222" font-weight="600" text-anchor="middle">规则</text><text x="270" y="643" font-size="16" fill="#222" font-weight="400" text-anchor="middle">全局</text><text x="404" y="643" font-size="16" fill="#222" font-weight="400" text-anchor="middle">直连</text><circle cx="467" cy="618" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="467" y="623" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="704" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="737" font-size="20" fill="#202124" font-weight="400" text-anchor="start">自动优选</text><text x="444" y="737" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">延迟优先</text><path d="M454 727l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 757H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="790" font-size="20" fill="#202124" font-weight="400" text-anchor="start">兜底路由</text><text x="444" y="790" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">代理</text><path d="M454 780l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">主页 → 当前节点卡片</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">点电源按钮</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">已有节点时启动 VPN，首次使用允许系统添加 VPN</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">配置</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">点节点选择卡片</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">打开节点列表；预设指定出口时先调整网络预设</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">核对模式与新请求</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">状态、模式、兜底路由是不同设置；连接后验证实际出</text><text x="552" y="765" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">口</text></g></svg>
