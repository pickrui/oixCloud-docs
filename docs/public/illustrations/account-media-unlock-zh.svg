" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">选择地区并等待保存</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">选择后自动保存，跟随节点默认可清除偏好</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">账户级开关在总览</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">屏蔽 STUN 等开关在流量路由总览，与节</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">点地区分别生效</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 流量路由 → 出口 → 流媒体解锁</text></g></svg>
