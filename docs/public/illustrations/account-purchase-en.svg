erms</text><rect x="267" y="653" width="20" height="20" rx="3" fill="#4c74d8" stroke="none"/><path d="M269 655l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="670" font-size="16" fill="#596b85" font-weight="400" text-anchor="start">I have read and agree to all terms above</text><rect x="805" y="697" width="225" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="917.5" y="723" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Confirm Purchase</text><rect x="801" y="693" width="233" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="697" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="702" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose a period first</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Check its total price and data;</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the monthly equivalent is not</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">monthly billing.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Verify the final total</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Verify any coupon first. No</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">discount is used