<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Choose streaming regions per node and service</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose streaming regions per node and service</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Streaming Unlock</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="43" rx="8" fill="#fff" stroke="#d5deea"/><text x="349" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Overview</text><text x="549" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Protocols</text><text x="749" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Relay</text><rect x="849" y="304" width="200" height="35" rx="6" fill="#e2edff" stroke="none"/><text x="949" y="327" font-size="15" fill="#326cc4" font-weight="600" text-anchor="middle">Exit</text><rect x="245" y="365" width="808" height="270" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="400" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Streaming Unlock</text><text x="267" y="432" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">Public beta. Only some nodes support this.</text><rect x="246" y="453" width="806" height="37" rx="0" fill="#edf2fa" stroke="none"/><text x="267" y="478" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="start">Node</text><text x="627" y="478" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="middle">Example service A</text><text x="902" y="478" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="middle">Example service B</text><text x="267" y="529" font-size="18" fill="#405675" font-weight="600" text-anchor="start">HK · Example A</text><rect x="505" y="504" width="245" height="40" rx="7" fill="#eaf1ff" stroke="#a9c3ee"/><text x="518" y="530" font-size="17" fill="#326cc4" font-weight="600" text-anchor="start">Japan</text><text x="733" y="530" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">⌄</text><rect x="775" y="504" width="255" height="40" rx="7" fill="#fff" stroke="#d5deea"/><text x="788" y="530" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Follow node default</text><text x="1013" y="530" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">⌄</text><text x="505" y="556" font-size="13" fill="#38836e" font-weight="400" text-anchor="start">Saved</text><text x="267" y="595" font-size="18" fill="#405675" font-weight="600" text-anchor="start">HK · Example B</text><rect x="505" y="570" width="245" height="40" rx="7" fill="#fff" stroke="#d5deea"/><text x="518" y="596" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Follow node default</text><text x="733" y="596" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">⌄</text><rect x="775" y="570" width="255" height="40" rx="7" fill="#fff" stroke="#d5deea"/><text x="788" y="596" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Follow node default</text><text x="1013" y="596" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">⌄</text><rect x="255" y="499" width="198" height="49" rx="10" fill="none" stroke="#d27336"/><circle cx="449" cy="503" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="449" y="508" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="495" y="496" width="265" height="70" rx="10" fill="none" stroke="#d27336"/><circle cx="756" cy="500" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="756" y="505" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="245" y="298" width="208" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="449" cy="302" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="449" y="307" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Find the node you use</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Search appears when there are</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">many nodes. Each service is set</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">separately.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose a region and wait</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Each service saves automatically.</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> Follow node default clears its</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">preference.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Account-wide switches are</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">on the overview</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Block STUN and similar switches</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">are on the Traffic Routes</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">overview.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Traffic Routes →