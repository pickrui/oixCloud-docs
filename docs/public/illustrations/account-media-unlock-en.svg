3952" font-weight="600" text-anchor="start">Choose a region and wait</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Each service saves automatically.</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> Follow node default clears its</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">preference.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check account-wide</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">controls</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The switches below affect the</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">account, not the selected node’s</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">region.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Traffic Routes → Streaming unlock</text></g></svg>
