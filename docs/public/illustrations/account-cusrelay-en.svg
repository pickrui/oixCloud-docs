<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Set the external relay destination and mode</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Set the external relay destination and mode</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Add External Relay</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="43" rx="8" fill="#fff" stroke="#d5deea"/><text x="314" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Internal relay</text><rect x="383" y="304" width="130" height="35" rx="6" fill="#e2edff" stroke="none"/><text x="448" y="327" font-size="15" fill="#326cc4" font-weight="600" text-anchor="middle">External Relay</text><text x="582" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">HTTP/3</text><text x="716" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">WARP</text><text x="850" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">IPv4 Only</text><text x="984" y="327" font-size="14.681107099879666" fill="#657b97" font-weight="400" text-anchor="middle">Streaming Unlock</text><rect x="245" y="360" width="808" height="415" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="389" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Entry node</text><rect x="267" y="401" width="489" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="430" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">HK · Example A</text><rect x="263" y="397" width="497" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="756" cy="401" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="756" y="406" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="781" y="389" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Entry port</text><rect x="781" y="401" width="249" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="794" y="430" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">20000</text><text x="267" y="477" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Target address</text><rect x="267" y="489" width="489" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="518" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">relay.example.com</text><text x="781" y="477" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Target port</text><rect x="781" y="489" width="249" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="794" y="518" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">22</text><rect x="777" y="485" width="257" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="489" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="494" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="267" y="565" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Note</text><rect x="267" y="577" width="357" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="606" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">SSH example</text><text x="649" y="565" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Forward only these domains / IPs</text><rect x="649" y="577" width="381" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="662" y="606" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Empty: forward all traffic</text><rect x="267" y="650" width="18" height="18" rx="3" fill="#fff" stroke="#9daec5"/><text x="301" y="666" font-size="17" fill="#445a77" font-weight="600" text-anchor="start">Protocol keep mode</text><rect x="255" y="637" width="393" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="644" cy="641" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="644" y="646" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="267" y="704" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">Unchecked: decrypt and forward TCP / UDP</text><rect x="827" y="724" width="203" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="928.5" y="750" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Add relay rule</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose an available source</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The personal port is read-only.</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Avoid sources with conflicting</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">rules.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Use the real service port</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">A protocol-conversion example.</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Port guidance is not a</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">connectivity test.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check mode before saving</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Preserving mode needs the</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">generated installation. Refresh</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the subscription after saving.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Traffic Routes → External relay → Add relay rule</text></g></svg>
