nt-size="20" fill="#273952" font-weight="600" text-anchor="start">Keep the DNS mode</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Fake-IP and Redir-Host control</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the kind of DNS answer returned.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Select TUN if needed</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Wait for the service to resume</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">and test from an included LAN</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">device.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Use Rule for sites</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Revisit the site. In Connections,</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> check the exit on its new</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">request.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Services → OpenClash → Overviews</text></g></svg>
