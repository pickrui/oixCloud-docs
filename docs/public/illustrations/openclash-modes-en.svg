<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">OpenClash · Choose capture and proxy modes</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose capture and proxy modes</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">Services</text><text x="337" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="64" y="250" font-size="32" fill="#344454" font-weight="650" text-anchor="start">Running status</text><rect x="65" y="302" width="988" height="253" rx="8" fill="#fff" stroke="#dce1e4"/><text x="89" y="356" font-size="22" fill="#354958" font-weight="600" text-anchor="start">Running Mode</text><rect x="316" y="379" width="649" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="319" y="382" width="318.5" height="33" rx="6" fill="#fff" stroke="none"/><text x="478.25" y="404" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Fake-IP</text><text x="802.75" y="404" font-size="16" fill="#222"