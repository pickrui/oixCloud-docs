<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Sign in to your account</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Desktop</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Sign in to your account</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Dashboard</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Proxies</text><text x="76" y="359" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Profiles</text><rect x="40" y="407" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="431" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><text x="76" y="719" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">oixCloud</text><rect x="30" y="165" width="1060" height="618" rx="0" fill="#00000044" stroke="none"/><rect x="286" y="235" width="548" height="482" rx="27" fill="#fff6f8" stroke="#ddcbd2"/><text x="310" y="277" font-size="26" fill="#8a5260" font-weight="400" text-anchor="start">‹</text><text x="560" y="278" font-size="23" fill="#332b2e" font-weight="600" text-anchor="middle">Login</text><text x="806" y="278" font-size="24" fill="#8a5260" font-weight="600" text-anchor="end">✓</text><circle cx="821" cy="253" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="821" y="258" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="314" y="309" width="492" height="43" rx="23" fill="#8a5260" stroke="none"/><text x="560" y="337" font-size="17" fill="#fff" font-weight="500" text-anchor="middle">Sign in with Google</text><rect x="314" y="386" width="492" height="39" rx="20" fill="#f7edef" stroke="#a8959a"/><text x="437" y="411" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">Access Token</text><rect x="563" y="389" width="240" height="33" rx="17" fill="#f0d9df" stroke="none"/><text x="683" y="411" font-size="16" fill="#593c44" font-weight="600" text-anchor="middle">Email &amp; Password</text><rect x="310" y="382" width="500" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="806" cy="386" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="806" y="391" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="314" y="460" width="492" height="58" rx="7" fill="#fffbfc" stroke="#9d8d92"/><rect x="324" y="451" width="46.339999999999996" height="18" rx="0" fill="#fffbfc" stroke="none"/><text x="331" y="464" font-size="14" fill="#756067" font-weight="400" text-anchor="start">Email</text><text x="331" y="498" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start">reader@example.com</text><rect x="314" y="543" width="492" height="58" rx="7" fill="#fffbfc" stroke="#9d8d92"/><rect x="324" y="534" width="77.83999999999999" height="18" rx="0" fill="#fffbfc" stroke="none"/><text x="331" y="547" font-size="14" fill="#756067" font-weight="400" text-anchor="start">Password</text><text x="331" y="581" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start">••••••••</text><text x="314" y="647" font-size="17" fill="#8a5260" font-weight="400" text-anchor="start">Forgot password?</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose your credentials</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Google, Access Token and</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">email/password sign-in are</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">supported.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Submit with the top-right</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">checkmark</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">This confirms the form. No real</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">account or token is shown.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Wait for profile sync</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Return to the account page and</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">wait for the managed profile to</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">finish syncing.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Sidebar → oixCloud → Login</text></g></svg>
