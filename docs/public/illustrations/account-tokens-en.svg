<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Regenerate a token or end a client sign-in</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Regenerate a token or end a client sign-in</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Access Token</text><g transform="translate(-100 0)"><rect x="245" y="305" width="808" height="196" rx="12" fill="#fff" stroke="none"/><text x="267" y="343" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Access Token</text><rect x="267" y="362" width="763" height="43" rx="7" fill="#f6f8fc" stroke="#d9e1ed"/><text x="284" y="390" font-size="18" fill="#202124" font-weight="400" text-anchor="start">Home router</text><rect x="808" y="363" width="126" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="871" y="389" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Regenerate</text><rect x="804" y="359" width="134" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="934" cy="363" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="934" y="368" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="950" y="390" font-size="17" fill="#bb636f" font-weight="400" text-anchor="start">Delete</text><text x="284" y="443" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">Ends in</text><rect x="376" y="421" width="62" height="30" rx="6" fill="#f1f5fb" stroke="#d9e1ed"/><text x="407" y="442" font-size="16" fill="#202124" font-weight="500" text-anchor="middle">9f3c</text><rect x="272" y="415" width="178" height="42" rx="10" fill="none" stroke="#d27336"/><circle cx="446" cy="419" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="446" y="424" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="284" y="480" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">Signed in with this token: oixClash · Router</text><rect x="245" y="521" width="808" height="204" rx="12" fill="#fff" stroke="none"/><text x="267" y="559" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Signed-in clients</text><rect x="267" y="578" width="763" height="43" rx="7" fill="#f6f8fc" stroke="#d9e1ed"/><text x="284" y="606" font-size="18" fill="#202124" font-weight="600" text-anchor="start">oixFlow</text><text x="370" y="606" font-size="15" fill="#74859a" font-weight="400" text-anchor="start">2 devices</text><text x="284" y="650" font-size="18" fill="#202124" font-weight="600" text-anchor="start">iPhone</text><text x="284" y="676" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">Signed in 2026-11-23 · last used today 09:12</text><text x="284" y="704" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">Also used by Apple TV</text><rect x="920" y="642" width="94" height="34" rx="7" fill="#fff" stroke="#e3a1aa"/><text x="967" y="665" font-size="16" fill="#bb636f" font-weight="600" text-anchor="middle">Sign out</text><rect x="916" y="638" width="102" height="42" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="642" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="647" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Find the token by note and</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start"> ending</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The full value appears only when</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">it is created or regenerated.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Regenerate for a new value</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The note, expiry and subscription</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> stay the same; the old value</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">stops working at once.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Sign out under Signed-in</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">clients</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Every device sharing this sign-in</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> must sign in again.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Access Token management</text></g></svg>
