<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Find the token for your client</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Find the token for your client</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Access Token</text><g transform="translate(-100 0)"><rect x="245" y="305" width="808" height="64" rx="12" fill="#edf3fd" stroke="none"/><text x="267" y="345" font-size="18" fill="#202124" font-weight="400" text-anchor="start">Disable client email/password sign-in</text><rect x="969" y="322" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="984" cy="336.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="245" y="394" width="808" height="292" rx="12" fill="#fff" stroke="none"/><text x="267" y="434" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Issued by client sign-in</text><rect x="255" y="405" width="263" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="514" cy="409" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="514" y="414" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="267" y="456" width="763" height="43" rx="7" fill="#f6f8fc" stroke="#d9e1ed"/><text x="284" y="484" font-size="18" fill="#202124" font-weight="400" text-anchor="start">FlClash for oixCloud</text><rect x="808" y="457" width="126" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="871" y="483" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Regenerate</text><rect x="804" y="453" width="134" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="934" cy="457" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="934" y="462" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="950" y="484" font-size="17" fill="#bb636f" font-weight="400" text-anchor="start">Delete</text><rect x="267" y="520" width="763" height="44" rx="7" fill="#fff" stroke="#d5dfed"/><text x="284" y="549" font-size="20" fill="#74859a" font-weight="400" text-anchor="start">••••••••••••••••••••••••</text><text x="977" y="549" font-size="16" fill="#4b75bf" font-weight="600" text-anchor="start">Copy</text><rect x="947" y="518" width="79" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="1022" cy="522" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1022" y="527" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="267" y="607" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Bound subscription</text><rect x="267" y="619" width="763" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="648" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Client subscription</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Find the correct client</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">record</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Official clients of the same kind</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> can share this issued sign-in</text><text x="42" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">token.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Copy the token itself</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Credentials are completely hidden</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> here. A subscription URL is a</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">different input.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Review before regenerating</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The old token stops working;</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">every device sharing it needs the</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> new token.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Access Token management</text></g></svg>
