"541" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先辨认泄露的地址</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">找出实际泄露的个人地址，示例中名为手机</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">订阅</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">个人地址点删除</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">删除后按需创建新地址，并更新使用它的设</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">备</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">主订阅点重置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">主地址和节点凭据一起更换，个人地址仍然</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">有效</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 订阅管理 → 个人订阅</text></g></svg>
