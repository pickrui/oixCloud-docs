<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · 选择进入 VPN 的应用</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Android</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">选择进入 VPN 的应用</text><rect x="42" y="127" width="454" height="810" rx="32" fill="#fffbfc" stroke="#e4d8df"/><text x="69" y="164" font-size="17" fill="#332b2e" font-weight="600" text-anchor="start">9:41</text><text x="75" y="217" font-size="28" fill="#875366" font-weight="400" text-anchor="start">‹</text><text x="114" y="217" font-size="26" fill="#202124" font-weight="400" text-anchor="start">访问控制设置</text><text x="464" y="217" font-size="18" fill="#875366" font-weight="600" text-anchor="end">保存</text><circle cx="480" cy="196" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="480" y="201" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="82" y="279" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">应用访问控制</text><rect x="405" y="263" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="440" cy="277.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M66 309H472" stroke="#ede5e8" stroke-width="1"/><rect x="62" y="248" width="414" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="472" cy="252" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="472" y="257" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="73" y="330" width="394" height="39" rx="20" fill="#f7edef" stroke="#a8959a"/><rect x="76" y="333" width="191" height="33" rx="17" fill="#f0d9df" stroke="none"/><text x="171.5" y="355" font-size="16" fill="#593c44" font-weight="600" text-anchor="middle">白名单模式</text><text x="368.5" y="355" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">黑名单模式</text><circle cx="467" cy="330" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="467" y="335" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="82" y="405" font-size="17" fill="#89717c" font-weight="400" text-anchor="start">只允许选中应用进入VPN</text><rect x="72" y="435" width="399" height="44" rx="25" fill="#f4e9ef" stroke="none"/><text x="91" y="464" font-size="18" fill="#a58c99" font-weight="400" text-anchor="start">⌕ 搜索</text><rect x="68" y="511" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="544" font-size="20" fill="#202124" font-weight="400" text-anchor="start">示例浏览器</text><text x="456" y="544" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">☑</text><path d="M84 564H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="597" font-size="20" fill="#202124" font-weight="400" text-anchor="start">示例工作应用</text><text x="456" y="597" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">☑</text><path d="M84 617H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="650" font-size="20" fill="#202124" font-weight="400" text-anchor="start">示例播放器</text><text x="456" y="650" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">□</text><rect x="213" y="923" width="112" height="5" rx="3" fill="#493f45" stroke="none"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Android → 工具 → 应用访问控制</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff"