<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Set HTTP/3 and smart fallback</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Set HTTP/3 and smart fallback</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Hollow</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="43" rx="8" fill="#fff" stroke="#d5deea"/><text x="349" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Overview</text><rect x="449" y="304" width="200" height="35" rx="6" fill="#e2edff" stroke="none"/><text x="549" y="327" font-size="15" fill="#326cc4" font-weight="600" text-anchor="middle">Protocols</text><text x="749" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Relay</text><text x="949" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Exit</text><rect x="245" y="365" width="808" height="410" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="400" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Hollow</text><text x="267" y="435" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">Changes save automatically</text><text x="267" y="470" font-size="15" fill="#326cc4" font-weight="600" text-anchor="start">How it works and what to know ▾</text><rect x="267" y="497" width="400" height="39" rx="6" fill="#f7f9fc" stroke="#d5deea"/><text x="283" y="523" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">⌕ HK</text><rect x="680" y="500" width="84" height="33" rx="16" fill="#e2edff" stroke="#a9c3ee"/><text x="722" y="522" font-size="14" fill="#326cc4" font-weight="600" text-anchor="middle">All 3</text><rect x="768" y="500" width="84" height="33" rx="16" fill="#fff" stroke="#d5deea"/><text x="810" y="522" font-size="14" fill="#657b97" font-weight="600" text-anchor="middle">Enabled 2</text><rect x="856" y="500" width="84" height="33" rx="16" fill="#fff" stroke="#d5deea"/><text x="898" y="522" font-size="14" fill="#657b97" font-weight="600" text-anchor="middle">Disabled 1</text><rect x="944" y="500" width="84" height="33" rx="16" fill="#fff" stroke="#d5deea"/><text x="986" y="522" font-size="12.006319115323851" fill="#657b97" font-weight="600" text-anchor="middle">Unavailable 0</text><rect x="246" y="573" width="806" height="37" rx="0" fill="#edf2fa" stroke="none"/><rect x="267" y="583" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="293" y="598" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="start">Node</text><text x="860" y="598" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="middle">HTTP/3</text><rect x="267" y="626" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="642" font-size="17" fill="#314f78" font-weight="600" text-anchor="start">HK · Example A</text><rect x="700" y="618" width="330" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="703" y="621" width="104" height="33" rx="6" fill="#fff" stroke="none"/><text x="755" y="643" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Off</text><text x="865" y="643" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Smart fallback</text><text x="975" y="643" font-size="16" fill="#222" font-weight="400" text-anchor="middle">HTTP/3 only</text><path d="M264 664H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="680" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="686" font-size="17" fill="#314f78" font-weight="600" text-anchor="start">HK · Example B</text><text x="296" y="712" font-size="14" fill="#38836e" font-weight="400" text-anchor="start">Saved. Update the subscription.</text><rect x="700" y="672" width="330" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="755" y="697" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Off</text><rect x="813" y="675" width="104" height="33" rx="6" fill="#fff" stroke="none"/><text x="865" y="697" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Smart fallback</text><text x="975" y="697" font-size="16" fill="#222" font-weight="400" text-anchor="middle">HTTP/3 only</text><path d="M264 718H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="734" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="750" font-size="17" fill="#314f78" font-weight="600" text-anchor="start">HK · Dedicated IP - 192.0.2.10</text><rect x="700" y="726" width="330" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="755" y="751" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Off</text><text x="865" y="751" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Smart fallback</text><rect x="923" y="729" width="104" height="33" rx="6" fill="#fff" stroke="none"/><text x="975" y="751" font-size="16" fill="#222" font-weight="600" text-anchor="middle">HTTP/3 only</text><rect x="287" y="718" width="308" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="591" cy="722" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="591" y="727" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="802" y="665" width="122" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="920" cy="669" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="920" y="674" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="287" y="694" width="248" height="29" rx="10" fill="none" stroke="#d27336"/><circle cx="531" cy="698" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="531" y="703" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the node and address</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Regular nodes are grouped. Each</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">dedicated IP has its own setting.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose smart fallback</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Off by default. Try one node</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">first. UDP forwarding is not</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">affected.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Save, then refresh the</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">client</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Fallback chooses during setup.</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Existing connections do not</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">migrate.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Traffic Routes → Protocols → Hollow</text></g></svg>
