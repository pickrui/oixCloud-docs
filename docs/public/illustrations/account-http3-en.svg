<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Set HTTP/3 and smart fallback</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Set HTTP/3 and smart fallback</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">HTTP/3 Settings</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="43" rx="8" fill="#fff" stroke="#d5deea"/><text x="314" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">Internal relay</text><text x="448" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">External Relay</text><rect x="517" y="304" width="130" height="35" rx="6" fill="#e2edff" stroke="none"/><text x="582" y="327" font-size="15" fill="#326cc4" font-weight="600" text-anchor="middle">HTTP/3</text><text x="716" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">WARP</text><text x="850" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">IPv4 Only</text><text x="984" y="327" font-size="14.681107099879666" fill="#657b97" font-weight="400" text-anchor="middle">Streaming Unlock</text><rect x="245" y="365" width="808" height="410" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="400" font-size="21" fill="#405675" font-weight="600" text-anchor="start">HTTP/3 Settings</text><text x="1030" y="399" font-size="15" fill="#657b97" font-weight="400" text-anchor="end">Nodes: 3</text><text x="267" y="435" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">Smart fallback</text><rect x="267" y="457" width="475" height="39" rx="6" fill="#f7f9fc" stroke="#d5deea"/><text x="283" y="483" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">⌕ HK</text><rect x="763" y="457" width="267" height="39" rx="6" fill="#fff" stroke="#d5deea"/><text x="780" y="483" font-size="16" fill="#445a77" font-weight="400" text-anchor="start">All statuses ▾</text><text x="267" y="514" font-size="14" fill="#657b97" font-weight="400" text-anchor="start">Showing 3 of 3 nodes</text><rect x="267" y="533" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="294" y="547" font-size="15" fill="#445a77" font-weight="400" text-anchor="start">Select all</text><text x="400" y="547" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">Selected: 0</text><rect x="246" y="573" width="806" height="37" rx="0" fill="#edf2fa" stroke="none"/><text x="293" y="598" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="start">Node</text><text x="782" y="598" font-size="16" fill="#5c6e89" font-weight="600" text-anchor="middle">HTTP/3</text><text x="966" y="598" font-size="15" fill="#5c6e89" font-weight="600" text-anchor="middle">Smart fallback</text><rect x="267" y="626" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="634" font-size="17" fill="#314f78" font-weight="600" text-anchor="start">HK · Example A</text><text x="296" y="656" font-size="14" fill="#657b97" font-weight="400" text-anchor="start">TCP</text><rect x="757" y="621" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="772" cy="635.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><g opacity="0.45"><rect x="941" y="621" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="976" cy="635.5" r="11" fill="#fff" stroke="none" stroke-width="1"/></g><path d="M264 664H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="680" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="688" font-size="17" fill="#314f78" font-weight="600" text-anchor="start">HK · Example B</text><text x="296" y="710" font-size="14" fill="#657b97" font-weight="400" text-anchor="start">HTTP/3 with smart fallback</text><rect x="757" y="675" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="792" cy="689.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="941" y="675" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="976" cy="689.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M264 718H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="734" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="742" font-size="17" fill="#314f78" font-weight="600" text-anchor="start">HK · Dedicated IP - 192.0.2.10</text><text x="296" y="764" font-size="14" fill="#657b97" font-weight="400" text-anchor="start">HTTP/3 only</text><rect x="757" y="729" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="792" cy="743.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="941" y="729" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="956" cy="743.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="287" y="718" width="422" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="705" cy="722" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="705" y="727" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="745" y="665" width="74" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="815" cy="669" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="815" y="674" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="929" y="665" width="74" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="999" cy="669" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="999" y="674" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the node and address</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Regular nodes are grouped. Each</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">dedicated IP has its own setting.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enable HTTP/3</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">TCP is the default. Try one node</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">first with smart fallback on.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Save, then refresh the</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">client</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Fallback chooses HTTP/3 or TCP</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">during setup. Existing</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">connections do not migrate.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Traffic Routes → HTTP/3</text></g></svg>
