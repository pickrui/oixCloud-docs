<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixClash · 读取并保存账号规则</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixClash · Merlin 路由器</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">读取并保存账号规则</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#20333e" stroke="none"/><rect x="220" y="149" width="849" height="611" rx="4" fill="#4d595d" stroke="none"/><text x="48" y="174" font-size="20" fill="#d5e4e8" font-weight="700" text-anchor="start">ASUSWRT</text><text x="241" y="181" font-size="24" fill="#fff" font-weight="600" text-anchor="start">软件中心 - oixClash</text><rect x="43" y="205" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="234" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">网络地图</text><rect x="43" y="256" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="285" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">AiMesh</text><rect x="43" y="307" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="336" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">访客网络</text><rect x="43" y="358" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="387" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">流量分析</text><rect x="43" y="409" width="164" height="46" rx="3" fill="#387aa0" stroke="none"/><text x="60" y="438" font-size="17" fill="#f2f6f8" font-weight="600" text-anchor="start">软件中心</text><rect x="43" y="460" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="489" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">无线网络</text><rect x="43" y="511" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="540" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">内部网络</text><rect x="43" y="562" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="591" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">外部网络</text><rect x="43" y="613" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="642" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">IPv6</text><rect x="43" y="664" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="693" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">系统管理</text><text x="243" y="216" font-size="17" fill="#dbe7eb" font-weight="400" text-anchor="start">账号规则与网站共用，排在面板默认规则之前</text><rect x="239" y="239" width="811" height="33" rx="0" fill="#73838a" stroke="none"/><text x="252" y="262" font-size="17" fill="#fff" font-weight="600" text-anchor="start">自定义规则</text><rect x="239" y="272" width="811" height="385" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="272" width="164" height="385" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="304" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">账号规则</text><rect x="420" y="289" width="609" height="180" rx="0" fill="#22343d" stroke="#8fa3ad"/><text x="435" y="324" font-size="19" fill="#e6edf2" font-weight="400" text-anchor="start">DOMAIN-SUFFIX,example.com,DIRECT</text><text x="435" y="360" font-size="19" fill="#e6edf2" font-weight="400" text-anchor="start">DOMAIN,ads.example.com,REJECT</text><circle cx="1018" cy="286" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1018" y="291" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="420" y="500" font-size="16" fill="#e2ecf0" font-weight="400" text-anchor="start">每行一条，无需 rules: 或行首短横线</text><text x="420" y="531" font-size="16" fill="#ffce55" font-weight="400" text-anchor="start">留空并保存可清除面板账号规则</text><text x="420" y="562" font-size="17" fill="#41b6d5" font-weight="400" text-anchor="start">管理面板账号规则</text><rect x="420" y="589" width="166" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="503" y="613" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">读取面板规则</text><rect x="416" y="585" width="174" height="44" rx="10" fill="none" stroke="#d27336"/><circle cx="586" cy="589" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="586" y="594" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="613" y="589" width="211" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="718.5" y="613" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">保存到面板并更新</text><rect x="609" y="585" width="219" height="44" rx="10" fill="none" stroke="#d27336"/><circle cx="824" cy="589" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="824" y="594" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="421" y="648" font-size="16" fill="#b7e46e" font-weight="400" text-anchor="start">已读取面板规则，可编辑后保存</text><text x="242" y="705" font-size="16" fill="#c8d7dd" font-weight="400" text-anchor="start">示例域名不对应真实服务；请按实际需求填写</text><text x="242" y="737" font-size="16" fill="#c8d7dd" font-weight="400" text-anchor="start">保存成功后，检查日志并在控制面板核对规则命中</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先读取面板规则</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">读取会替换未保存的草稿，先保留需要的内</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">容</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">每行一条规则</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">策略使用 DIRECT、REJECT 或已有策略组</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">保存并检查结果</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">保存影响同账号其他客户端，再验证新连接</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：软件中心 → oixClash → 自定义规则</text></g></svg>
