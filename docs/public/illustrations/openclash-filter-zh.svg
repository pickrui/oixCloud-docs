<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">OpenClash · 筛选后更新托管配置</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">筛选后更新托管配置</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">服务</text><text x="333" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="63" y="231" font-size="30" fill="#333" font-weight="650" text-anchor="start">OpenClash</text><rect x="64" y="261" width="991" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="187.875" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">运行状态</text><rect x="314.75" y="264" width="241.75" height="33" rx="6" fill="#fff" stroke="none"/><text x="435.625" y="286" font-size="16" fill="#222" font-weight="600" text-anchor="middle">插件设置</text><text x="683.375" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">配置订阅</text><text x="931.125" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">配置管理</text><circle cx="278" cy="256" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="278" y="261" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="72" y="345" width="975" height="302" rx="13" fill="#fff" stroke="#d7dce1"/><text x="102" y="402" font-size="27" fill="#25384a" font-weight="650" text-anchor="start">oixCloud</text><text x="102" y="450" font-size="21" fill="#435b70" font-weight="400" text-anchor="start">reader@example.com</text><rect x="102" y="515" width="170" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="187" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">更新配置</text><rect x="98" y="511" width="178" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="272" cy="515" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="272" y="520" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="294" y="515" width="160" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="374" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">节点筛选</text><rect x="290" y="511" width="168" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="454" cy="515" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="454" y="520" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="476" y="515" width="166" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="559" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">试试手气</text><rect x="664" y="515" width="228" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="778" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">官方网站</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">在网站筛选</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">点节点筛选，预览后保存，再回到这页</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">点更新配置</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">正在运行专用配置时会重启并加载新配置</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对当前配置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">在运行状态确认 oixCloud.yaml，其他配</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">置仍可手动切换</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：插件设置 → oixCloud</text></g></svg>
