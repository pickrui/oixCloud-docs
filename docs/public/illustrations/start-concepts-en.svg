<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Traffic capture, routing rules, and node selection model</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Architecture &amp; Concepts</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Traffic capture, routing rules, and node selection model</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><rect x="55" y="165" width="225" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="55" y="165" width="225" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="167" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">1. Local Traffic Capture</text><text x="75" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">App Network Requests</text><rect x="75" y="260" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="90" y="287" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Browser / Work / Games</text><text x="75" y="340" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Traffic Capture Mode</text><rect x="75" y="355" width="185" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="382" font-size="13" fill="#1d4ed8" font-weight="400" text-anchor="start">System proxy (HTTP/SOCKS5)</text><rect x="75" y="405" width="185" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="432" font-size="13" fill="#1d4ed8" font-weight="400" text-anchor="start">TUN virtual interface (all apps)</text><rect x="75" y="455" width="185" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="482" font-size="13" fill="#1d4ed8" font-weight="400" text-anchor="start">VPN profile (iOS / mobile)</text><rect x="61" y="321" width="213" height="193" rx="10" fill="none" stroke="#d27336"/><circle cx="270" cy="325" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="270" y="330" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="75" y="545" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Captures device traffic</text><text x="75" y="566.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">and forwards to the client</text><text x="75" y="588.4" font-size="14" fill="#64748b" font-weight="400" text-anchor="start"> routing engine.</text><text x="292" y="430" font-size="26" fill="#94a3b8" font-weight="middle" text-anchor="start">➔</text><rect x="305" y="165" width="235" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="305" y="165" width="235" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="422" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">2. Routing Rule Matching</text><text x="325" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Outbound Mode</text><rect x="325" y="260" width="195" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="328" y="263" width="59" height="33" rx="6" fill="#fff" stroke="none"/><text x="357.5" y="285" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Rule</text><text x="422.5" y="285" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Global</text><text x="487.5" y="285" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Direct</text><text x="325" y="340" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Rule Matching Decision</text><rect x="325" y="355" width="195" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="340" y="382" font-size="13" fill="#166534" font-weight="400" text-anchor="start">DOMAIN-SUFFIX: Proxy</text><rect x="325" y="405" width="195" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="340" y="432" font-size="13" fill="#991b1b" font-weight="400" text-anchor="start">GEOIP,CN: Direct</text><rect x="325" y="455" width="195" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="340" y="482" font-size="13" fill="#475569" font-weight="400" text-anchor="start">MATCH: Final Route group</text><rect x="311" y="321" width="223" height="193" rx="10" fill="none" stroke="#d27336"/><circle cx="530" cy="325" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="530" y="330" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="325" y="545" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Rules match from top to</text><text x="325" y="566.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">bottom; the first hit</text><text x="325" y="588.4" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">determines the route.</text><text x="552" y="430" font-size="26" fill="#94a3b8" font-weight="middle" text-anchor="start">➔</text><rect x="565" y="165" width="235" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="565" y="165" width="235" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="682" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">3. Policy Groups &amp; Chains</text><text x="585" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Outbound Routing Policy</text><rect x="585" y="260" width="195" height="42" rx="8" fill="#faf5ff" stroke="#d8b4fe"/><text x="600" y="287" font-size="14" fill="#6b21a8" font-weight="400" text-anchor="start">URL Test (lowest latency)</text><rect x="585" y="310" width="195" height="42" rx="8" fill="#faf5ff" stroke="#d8b4fe"/><text x="600" y="337" font-size="14" fill="#6b21a8" font-weight="400" text-anchor="start">Fallback / Load Balance</text><text x="585" y="385" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Multi-hop Proxy Chains</text><rect x="585" y="400" width="195" height="65" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="600" y="425" font-size="13" fill="#9a3412" font-weight="600" text-anchor="start">Proxy Chain / Internal Relay</text><text x="600" y="450" font-size="13" fill="#c2410c" font-weight="400" text-anchor="start">Dedicated transit ➔ Home ISP</text><rect x="571" y="366" width="223" height="113" rx="10" fill="none" stroke="#d27336"/><circle cx="790" cy="370" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="790" y="375" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="585" y="510" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Monitors node health and</text><text x="585" y="531.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">routes through dedicated</text><text x="585" y="553.4" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">transit and chains.</text><text x="812" y="430" font-size="26" fill="#94a3b8" font-weight="middle" text-anchor="start">➔</text><rect x="825" y="165" width="235" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="825" y="165" width="235" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="942" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">4. Exit Nodes &amp; Targets</text><text x="845" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Node Exit Network</text><rect x="845" y="260" width="195" height="40" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="860" y="286" font-size="13" fill="#0369a1" font-weight="400" text-anchor="start">Fusion / GIA (Optimized)</text><rect x="845" y="308" width="195" height="40" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="860" y="334" font-size="13" fill="#0369a1" font-weight="400" text-anchor="start">IXP (Cloud Interconnect)</text><rect x="845" y="356" width="195" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="860" y="382" font-size="12.033694344163662" fill="#15803d" font-weight="400" text-anchor="start">Home ISP (Residential broadband)</text><text x="845" y="430" font-size="16" fill="#334155" font-weight="600" text-anchor="start">Internet Destination</text><rect x="845" y="445" width="195" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="860" y="471" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Google / YouTube / GitHub</text><rect x="845" y="493" width="195" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="860" y="519" font-size="12.03369434416366" fill="#475569" font-weight="400" text-anchor="start">E-Commerce / Banking / Streaming</text><text x="845" y="565" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">Connects to target web</text><text x="845" y="586.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">services via the chosen exit</text><text x="845" y="608.4" font-size="14" fill="#64748b" font-weight="400" text-anchor="start"> IP.</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Traffic capture (Step 1)</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Apps are captured by system proxy</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">, VPN profile, or TUN virtual</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">network adapter.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Routing rule matching (</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Step 2)</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Matches domain/IP criteria and</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">outbound mode (Rule, Global,</text><text x="407" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Direct) to determine destination.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Policy groups and exit</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">routing (Step 3)</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Selects exit nodes via manual</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">choice, URL test, or proxy chains</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> through dedicated transit.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Local capture → Routing rules → Policy group → Exit node</text></g></svg>
