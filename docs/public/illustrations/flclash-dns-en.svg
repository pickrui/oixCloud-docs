<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Add DNS override entries</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Desktop</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Add DNS override entries</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Dashboard</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Proxies</text><text x="76" y="359" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Profiles</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><rect x="40" y="695" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="719" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">DNS</text><text x="976" y="205" font-size="25" fill="#8a5260" font-weight="400" text-anchor="start">＋</text><text x="1035" y="205" font-size="25" fill="#8a5260" font-weight="400" text-anchor="start">✎</text><circle cx="988" cy="177" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="988" y="182" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="166" y="253" font-size="16" fill="#885461" font-weight="600" text-anchor="start">Options</text><text x="170" y="307" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">⊖  Status</text><rect x="985" y="291" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="1020" cy="305.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 337H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="372" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">⊖  Respect rules</text><rect x="985" y="356" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="1000" cy="370.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 402H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="341" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="345" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="350" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="170" y="437" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">⊖  DNS mode</text><rect x="930" y="417" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="441" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">fake-ip</text><path d="M154 467H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="406" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="410" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="415" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="166" y="516" font-size="16" fill="#885461" font-weight="600" text-anchor="start">Nameserver</text><text x="170" y="566" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">⊖  Nameserver</text><text x="170" y="590" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">https://resolver.example.com/dns-query</text><path d="M154 607H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="651" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">⊖  Proxy nameserver</text><text x="170" y="675" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">192.0.2.53</text><path d="M154 692H1052" stroke="#ede5e8" stroke-width="1"/><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Add fields with the top +</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">button</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Unadded fields inherit the</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">profile. Remove an entry using</text><text x="42" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">its left-hand control.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Change one field at a time</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Values are examples only. Quick</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">edit is also available at the top</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> right.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Recheck after applying</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">A custom profile’s own settings</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">take precedence. Restore original</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> values if needed.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Tools → Advanced configuration → DNS</text></g></svg>
