<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Check credits and service before ending a plan</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Check credits and service before ending a plan</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Plan Management</text><g transform="translate(-100 0)"><rect x="245" y="298" width="808" height="107" rx="12" fill="#fff" stroke="#d5deea"/><text x="271" y="340" font-size="22" fill="#405675" font-weight="600" text-anchor="start">Example plan A</text><text x="271" y="375" font-size="17" fill="#3b846c" font-weight="400" text-anchor="start">Active</text><rect x="831" y="330" width="185" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="923.5" y="356" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">End early</text><rect x="827" y="326" width="193" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1016" cy="330" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1016" y="335" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="245" y="426" width="808" height="319" rx="12" fill="#fff" stroke="#d5deea"/><text x="273" y="467" font-size="24" fill="#405675" font-weight="600" text-anchor="start">End plan and claim credits</text><text x="273" y="520" font-size="20" fill="#405675" font-weight="600" text-anchor="start">5 benefit credits on settlement</text><text x="273" y="555" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">No pending plan. Your proxy service will stop.</text><rect x="260" y="482" width="758" height="90" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="486" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="491" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="273" y="610" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">Remaining time and data are forfeited without a refund</text><text x="273" y="640" font-size="17" fill="#596b85" font-weight="400" text-anchor="start">This record will leave the renewal queue</text><rect x="695" y="675" width="316" height="43" rx="7" fill="#b74b48" stroke="none"/><text x="853" y="703" font-size="17" fill="#fff" font-weight="600" text-anchor="middle">End plan and claim credits</text><rect x="691" y="671" width="324" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="1011" cy="675" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1011" y="680" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose the active plan</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Select End early on the record</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">you want to end.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Read the outcome</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">This example earns 5 credits.</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">With no pending plan, proxy</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">service stops.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Confirm permanent loss</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Remaining time and data are</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">forfeited without a refund.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Plan Management → End early</text></g></svg>
