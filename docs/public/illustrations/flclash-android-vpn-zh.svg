<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · 开启 Android VPN</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Android</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">开启 Android VPN</text><rect x="42" y="127" width="454" height="810" rx="32" fill="#fffbfc" stroke="#e4d8df"/><text x="69" y="164" font-size="17" fill="#332b2e" font-weight="600" text-anchor="start">9:41</text><text x="75" y="217" font-size="28" fill="#875366" font-weight="400" text-anchor="start">‹</text><text x="114" y="217" font-size="24" fill="#202124" font-weight="400" text-anchor="start">网络</text><text x="84" y="303" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">VPN</text><rect x="399" y="287" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="434" cy="301.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M68 333H466" stroke="#ede5e8" stroke-width="1"/><rect x="64" y="272" width="406" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="466" cy="276" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="466" y="281" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="82" y="423" font-size="16" fill="#805768" font-weight="600" text-anchor="start">VPN</text><text x="84" y="470" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">系统代理</text><rect x="399" y="454" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="414" cy="468.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M68 500H466" stroke="#ede5e8" stroke-width="1"/><rect x="64" y="439" width="406" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="466" cy="443" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="466" y="448" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="537" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">排除域名</text><path d="M68 567H466" stroke="#ede5e8" stroke-width="1"/><text x="84" y="605" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">允许应用绕过VPN</text><rect x="399" y="589" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="414" cy="603.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M68 635H466" stroke="#ede5e8" stroke-width="1"/><text x="84" y="673" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">IPv6</text><rect x="399" y="657" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="414" cy="671.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M68 703H466" stroke="#ede5e8" stroke-width="1"/><text x="84" y="740" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">DNS劫持</text><rect x="399" y="724" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="434" cy="738.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M68 770H466" stroke="#ede5e8" stroke-width="1"/><rect x="68" y="800" width="398" height="77" rx="12" fill="#f5eaf0" stroke="none"/><text x="83" y="827" font-size="14" fill="#735a68" font-weight="400" text-anchor="start">验证请求</text><text x="83" y="858" font-size="17" fill="#44343e" font-weight="400" text-anchor="start">工具 → 更多 → 请求</text><circle cx="458" cy="805" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="458" y="810" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="200" y="907" width="138" height="5" rx="3" fill="#392e34" stroke="none"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">工具 → 进阶配置 → 网络</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">开启 VPN</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">返回仪表盘启动，首次连接时同意系统 VPN 请求</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">区分系统代理</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Android 10 及以上可在 VPN 内提供 HTTP 代理</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">检查接管的应用</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">用已纳入访问控制的应用测试，再从工具 → 更多 →</text><text x="552" y="765" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">请求查看出口</text></g></svg>
