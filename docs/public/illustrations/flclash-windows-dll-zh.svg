<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Windows 缺少运行库排查与修复</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · 桌面端</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Windows 缺少运行库排查与修复</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#edf2f9" stroke="none"/><rect x="30" y="743" width="1060" height="40" rx="0" fill="#ffffffcc" stroke="#d5dce6"/><text x="55" y="768" font-size="20" fill="#0078d4" font-weight="400" text-anchor="start">⊞  ⌕</text><text x="1040" y="768" font-size="16" fill="#333" font-weight="400" text-anchor="end">10:00</text><rect x="120" y="180" width="430" height="220" rx="10" fill="#fff" stroke="#868686"/><rect x="120" y="180" width="430" height="36" rx="10" fill="#eaeaea" stroke="none"/><text x="140" y="204" font-size="16" fill="#111" font-weight="600" text-anchor="start">FlClash.exe - 系统错误</text><text x="530" y="204" font-size="16" fill="#666" font-weight="400" text-anchor="start">✕</text><circle cx="155" cy="255" r="18" fill="#c42b1c" stroke="none" stroke-width="1"/><text x="155" y="262" font-size="18" fill="#fff" font-weight="600" text-anchor="middle">✕</text><text x="190" y="245" font-size="15" fill="#111" font-weight="400" text-anchor="start">由于找不到 VCRUNTIME140.dll，无法继续</text><text x="190" y="268.25" font-size="15" fill="#111" font-weight="400" text-anchor="start">执行代码。重新安装程序可能会解决此问题。</text><rect x="131" y="221" width="408" height="108" rx="10" fill="none" stroke="#d27336"/><circle cx="535" cy="225" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="535" y="230" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="440" y="355" width="90" height="32" rx="5" fill="#e1e1e1" stroke="#adadad"/><text x="485" y="376" font-size="15" fill="#111" font-weight="400" text-anchor="middle">确定</text><rect x="575" y="180" width="460" height="330" rx="10" fill="#f9f9f9" stroke="#7b7b7b"/><rect x="575" y="180" width="460" height="36" rx="10" fill="#e8e8e8" stroke="none"/><text x="595" y="204" font-size="14" fill="#111" font-weight="600" text-anchor="start">Microsoft Visual C++ 2015-2022 Redistributable (x64)</text><text x="1015" y="204" font-size="16" fill="#666" font-weight="400" text-anchor="start">✕</text><text x="605" y="255" font-size="20" fill="#0067b8" font-weight="600" text-anchor="start">Microsoft Visual C++ 2015-2022</text><text x="605" y="282" font-size="16" fill="#555" font-weight="400" text-anchor="start">Redistributable (x64) - 14.40.33810</text><text x="605" y="330" font-size="15" fill="#333" font-weight="400" text-anchor="start">请在安装前阅读许可条款并勾选同意：</text><rect x="605" y="355" width="18" height="18" rx="3" fill="#0067b8" stroke="none"/><path d="M607 357l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="370" font-size="15" fill="#333" font-weight="400" text-anchor="start">我同意许可条款和条件</text><rect x="830" y="460" width="95" height="35" rx="5" fill="#0067b8" stroke="none"/><text x="877" y="483" font-size="16" fill="#fff" font-weight="500" text-anchor="middle">安装</text><rect x="816" y="446" width="123" height="58" rx="10" fill="none" stroke="#d27336"/><circle cx="935" cy="450" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="935" y="455" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="935" y="460" width="85" height="35" rx="5" fill="#e1e1e1" stroke="#adadad"/><text x="977" y="483" font-size="16" fill="#111" font-weight="400" text-anchor="middle">关闭</text><rect x="120" y="430" width="430" height="220" rx="10" fill="#1e1e1e" stroke="#333"/><text x="140" y="460" font-size="15" fill="#aaa" font-weight="400" text-anchor="start">Windows PowerShell (管理员)</text><text x="140" y="500" font-size="16" fill="#e5e5e5" font-weight="400" text-anchor="start">PS C:\&gt; winget install Microsoft.VCRedist.2015+.x64</text><text x="140" y="540" font-size="14" fill="#6a9955" font-weight="400" text-anchor="start">正在寻找包... 找到：Microsoft Visual C++ 2015-2022</text><text x="140" y="570" font-size="14" fill="#6a9955" font-weight="400" text-anchor="start">正在下载与安装... 已成功安装</text><rect x="126" y="476" width="418" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="540" cy="480" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="540" y="485" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">确认缺失的运行库文件</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">弹窗提示由于找不到 VCRUNTIME140.dll</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> 或 MSVCP140.dll 无法继续</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">安装官方运行库安装包</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">从微软官网下载对应架构（x64 / ARM64</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">）的 Visual C++ 运行库并安装</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">完成安装并重新启动</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">安装或修复完成后重新启动 FlClash 即</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">可正常打开</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：Windows → 系统错误弹窗 → 安装 VC++ 运行库</text></g></svg>
