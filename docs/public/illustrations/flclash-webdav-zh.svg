ill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="304" y="415" width="512" height="58" rx="7" fill="#fffbfc" stroke="#9d8d92"/><rect x="314" y="406" width="44" height="18" rx="0" fill="#fffbfc" stroke="none"/><text x="321" y="419" font-size="14" fill="#756067" font-weight="400" text-anchor="start">账号</text><text x="321" y="453" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start">reader</text><rect x="300" y="411" width="520" height="66" rx="10" fill="none" stroke="#d27336"/><circle cx="816" cy="415" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="816" y="420" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="304" y="500" width="512" height="58" rx="7" fill="#fffbfc" stroke="#9d8d92"/><rect x="314" y="491" width="44" height="18" rx="0" fill="#fffbfc" stroke="none"/><text x="321" y="504" font-size="14" fill="#756067" font-weight="400" text-anchor="start">密码</text><text x="321" y="538" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start">••••••••</text><text x="643" y="639" font-size="17" fill="#8a5260" font-weight="400" text-anchor="start">取消</text><rect x="701" y="611" width="112" height="43" rx="23" fill="#8a5260" stroke="none"/><text x="757" y="639" font-size="17" fill="#fff" font-weight="500" text-anchor="middle">保存</text><rect x="697" y="607" width="120" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="813" cy="611" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="813" y="616" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">使用完整服务地址</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">填写你自己的 WebDAV 服务地址，优先</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">HTTPS</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">填写账户凭据</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">密码不写入导出的便携备份，新设备需要重</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">填</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">保存后做一次手动备份</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">确认远程记录出现，再设置保留数量</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：备份与恢复 → 绑定</text></g></svg>
