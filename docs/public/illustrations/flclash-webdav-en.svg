<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Bind a WebDAV backup location</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Desktop</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Bind a WebDAV backup location</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Dashboard</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Proxies</text><text x="76" y="359" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Profiles</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><rect x="40" y="695" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="719" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">Backup and Restore</text><rect x="30" y="165" width="1060" height="618" rx="0" fill="#00000044" stroke="none"/><rect x="256" y="235" width="608" height="424" rx="27" fill="#fff6f8" stroke="#ddcbd2"/><text x="280" y="277" font-size="26" fill="#8a5260" font-weight="400" text-anchor="start">‹</text><text x="560" y="278" font-size="23" fill="#332b2e" font-weight="600" text-anchor="middle">WebDAV configuration</text><text x="836" y="278" font-size="24" fill="#8a5260" font-weight="600" text-anchor="end">✓</text><circle cx="851" cy="253" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="851" y="258" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="296" y="356" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Address</text><text x="296" y="380" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">https://dav.example.com/backup/</text><path d="M280 397H840" stroke="#ede5e8" stroke-width="1"/><rect x="276" y="325" width="568" height="72" rx="10" fill="none" stroke="#d27336"/><circle cx="840" cy="329" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="840" y="334" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="296" y="448" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Account</text><text x="296" y="472" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">reader</text><path d="M280 489H840" stroke="#ede5e8" stroke-width="1"/><rect x="276" y="417" width="568" height="72" rx="10" fill="none" stroke="#d27336"/><circle cx="840" cy="421" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="840" y="426" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="296" y="540" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Password</text><text x="296" y="564" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">••••••••</text><path d="M280 581H840" stroke="#ede5e8" stroke-width="1"/><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Use the full service URL</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Enter your own WebDAV address,</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">preferably HTTPS.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enter the account</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">credentials</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Portable backups omit this</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">password. Enter it again on a new</text><text x="407" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> device.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Save with the top-right</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">checkmark</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Make a manual backup and confirm</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">a new remote entry afterwards.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Tools → Backup and Restore → Bind</text></g></svg>
