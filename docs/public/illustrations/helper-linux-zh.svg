<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud Helper · Linux / Docker Helper 运行与状态检查</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud Helper · Linux / Docker</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Linux / Docker Helper 运行与状态检查</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#1e222b" stroke="none"/><rect x="30" y="130" width="1060" height="38" rx="14" fill="#2d323f" stroke="none"/><circle cx="50" cy="149" r="6" fill="#e06c75" stroke="none" stroke-width="1"/><circle cx="70" cy="149" r="6" fill="#e5c07b" stroke="none" stroke-width="1"/><circle cx="90" cy="149" r="6" fill="#98c379" stroke="none" stroke-width="1"/><text x="560" y="154" font-size="14" fill="#abb2bf" font-weight="500" text-anchor="middle">user@linux-server: ~/helper</text><text x="55" y="205" font-size="16" fill="#61afef" font-weight="600" text-anchor="start">user@linux-server:~/helper$ docker compose run --rm helper --check-config</text><text x="55" y="238" font-size="15" fill="#98c379" font-weight="400" text-anchor="start">[✓] Configuration check passed (UID 10001 can read /config/config.json)</text><rect x="46" y="181" width="988" height="73" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="185" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="190" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="55" y="295" font-size="16" fill="#61afef" font-weight="600" text-anchor="start">user@linux-server:~/helper$ docker compose up -d</text><text x="55" y="325" font-size="15" fill="#abb2bf" font-weight="400" text-anchor="start">[+] Running 1/1</text><text x="55" y="348" font-size="15" fill="#98c379" font-weight="400" text-anchor="start"> ✔ Container helper-service  Started                                    0.4s</text><text x="55" y="385" font-size="16" fill="#61afef" font-weight="600" text-anchor="start">user@linux-server:~/helper$ docker compose ps</text><text x="55" y="413" font-size="14" fill="#7f848e" font-weight="400" text-anchor="start">NAME             IMAGE                                   STATUS         PORTS</text><text x="55" y="438" font-size="14" fill="#e5c07b" font-weight="400" text-anchor="start">helper-service   ghcr.io/.../helper:latest   Up 2 minutes   127.0.0.1:6172-&gt;6172/tcp</text><rect x="46" y="271" width="988" height="188" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="275" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="280" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="55" y="500" font-size="16" fill="#61afef" font-weight="600" text-anchor="start">user@linux-server:~/helper$ curl -s http://127.0.0.1:6172/status | jq .</text><text x="55" y="532" font-size="15" fill="#abb2bf" font-weight="400" text-anchor="start">{</text><text x="75" y="556" font-size="15" fill="#98c379" font-weight="400" text-anchor="start">&quot;status&quot;: &quot;ready&quot;,</text><text x="75" y="580" font-size="15" fill="#98c379" font-weight="400" text-anchor="start">&quot;mode&quot;: &quot;single_port&quot;,</text><text x="75" y="604" font-size="15" fill="#e5c07b" font-weight="400" text-anchor="start">&quot;nodes_count&quot;: 12,</text><text x="75" y="628" font-size="15" fill="#98c379" font-weight="400" text-anchor="start">&quot;listeners&quot;: [&quot;127.0.0.1:6172&quot;, &quot;127.0.0.1:7100&quot;]</text><text x="55" y="652" font-size="15" fill="#abb2bf" font-weight="400" text-anchor="start">}</text><rect x="46" y="476" width="988" height="198" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="480" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="485" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先验证配置文件</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">运行配置语法检查，确认无格式与权限错误</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">后再启动</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">启动容器并查看状态</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">使用 docker compose up -d 启动后台</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">容器并确认端口映射</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">检查健康与就绪状态</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">curl 请求 /status 接口确认就绪，并在</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">局域网设备验证连接</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：Linux 终端 → Docker Compose → 状态检查</text></g></svg>
