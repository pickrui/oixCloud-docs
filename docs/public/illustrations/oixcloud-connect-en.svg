<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Connect and choose an outbound</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Connect and choose an outbound</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="67" y="234" font-size="37" fill="#111" font-weight="700" text-anchor="start">Home</text><rect x="49" y="854" width="442" height="63" rx="27" fill="#fcfcfd" stroke="#e4e4e9"/><text x="93" y="880" font-size="23" fill="#007aff" font-weight="500" text-anchor="middle">⌂</text><text x="93" y="900" font-size="12" fill="#007aff" font-weight="500" text-anchor="middle">Home</text><text x="180" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">▤</text><text x="180" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Proxies</text><text x="267" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">◴</text><text x="267" y="900" font-size="12" fill="#8