one"/><text x="84" y="542" font-size="20" fill="#202124" font-weight="400" text-anchor="start">HK · Example A</text><text x="84" y="566" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">oixCloud</text><path d="M454 538l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="515" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="519" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="524" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="69" y="618" width="402" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="72" y="621" width="128" height="33" rx="6" fill="#fff" stroke="none"/><text x="136" y="643" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Rule</text><text x="270" y="643" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Global</text><text x="404" y="643" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Direct</text><circle cx="467" cy="618" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="467" y="623" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="704" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="737" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Best Available</text><text x="444" y="737" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Lowest latency</text><path d="M454 727l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 757H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="790" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Final Route</text><text x="444" y="790" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Proxy</text><path d="M454 780l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Home → Current node card</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Use the power button</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Start the VPN after loading nodes. Allow</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">the first VPN configuration request.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Open the node card</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Select a node. If a network profile fixes</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">the outbound, change that profile first.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check mode and new requests</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Connection state, mode and Final Route are</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start"> separate. Verify the actual exit.</text></g></svg>
