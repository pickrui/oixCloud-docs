<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Choose which apps enter the VPN</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Android</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose which apps enter the VPN</text><rect x="42" y="127" width="454" height="810" rx="32" fill="#fffbfc" stroke="#e4d8df"/><text x="69" y="164" font-size="17" fill="#332b2e" font-weight="600" text-anchor="start">9:41</text><text x="75" y="217" font-size="28" fill="#875366" font-weight="400" text-anchor="start">‹</text><text x="114" y="217" font-size="24" fill="#202124" font-weight="400" text-anchor="start">App access control</text><text x="426" y="217" font-size="24" fill="#875366" font-weight="600" text-anchor="start">✓</text><text x="466" y="217" font-size="24.56140350877193" fill="#875366" font-weight="400" text-anchor="start">⋮</text><circle cx="482" cy="190" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="482" y="195" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="73" y="250" width="395" height="43" rx="22" fill="#f4e9ef" stroke="none"/><text x="91" y="279" font-size="18" fill="#a58c99" font-weight="400" text-anchor="start">⌕ Search</text><rect x="68" y="327" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="360" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Example Browser</text><text x="456" y="360" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">☑</text><path d="M84 380H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="413" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Example Work App</text><text x="456" y="413" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">☑</text><path d="M84 433H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="466" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Example Player</text><text x="456" y="466" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">□</text><rect x="191" y="510" width="280" height="210" rx="16" fill="#fff5f8" stroke="#dfcad4"/><text x="215" y="549" font-size="18" fill="#875366" font-weight="400" text-anchor="start">Turn On  ✓</text><text x="215" y="592" font-size="18" fill="#6b5b63" font-weight="400" text-anchor="start">Turn Off</text><text x="215" y="635" font-size="18" fill="#6b5b63" font-weight="400" text-anchor="start">Refresh</text><text x="215" y="681" font-size="17" fill="#875366" font-weight="400" text-anchor="start">Settings  ›  Whitelist mode</text><circle cx="468" cy="658" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="663" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="72" y="819" width="400" height="82" rx="20" fill="#f3e3ea" stroke="none"/><text x="91" y="852" font-size="16" fill="#7f5c6b" font-weight="400" text-anchor="start">Only selected apps go through the VPN</text><text x="91" y="881" font-size="15" fill="#8a5260" font-weight="400" text-anchor="start">2 selected</text><circle cx="467" cy="819" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="467" y="824" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="213" y="923" width="112" height="5" rx="3" fill="#493f45" stroke="none"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Android → Tools → AccessControl</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Turn on from the More menu</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">The top-right menu enables or disables app</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start"> access control.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Choose a mode in Settings</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">More → Settings → Mode. Whitelist mode</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">includes only selected apps.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Select apps and save</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Use the top-right checkmark. The bottom</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">bar shows the mode and selected count.</text></g></svg>
