<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Run a network self-check</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Desktop</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Run a network self-check</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Dashboard</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Proxies</text><text x="76" y="359" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Profiles</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><rect x="40" y="695" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="719" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">Network self-check</text><text x="974" y="205" font-size="25" fill="#8a5260" font-weight="400" text-anchor="start">⧉</text><text x="1034" y="205" font-size="25" fill="#8a5260" font-weight="400" text-anchor="start">↻</text><circle cx="1051" cy="177" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1051" y="182" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="158" y="241" width="887" height="89" rx="19" fill="#f5e5ed" stroke="none"/><text x="180" y="275" font-size="20" fill="#74525f" font-weight="400" text-anchor="start">Check the current connection with a few probes</text><text x="180" y="307" font-size="16" fill="#8e727f" font-weight="400" text-anchor="start">The system network path may still use TUN</text><circle cx="1034" cy="244" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1034" y="249" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="170" y="374" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Applied configuration</text><rect x="930" y="354" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="378" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Passed</text><path d="M154 404H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="436" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Core response</text><rect x="930" y="416" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="440" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Passed</text><path d="M154 466H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="498" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Local proxy entry</text><rect x="930" y="478" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="502" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Passed</text><path d="M154 528H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="560" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">System proxy</text><rect x="930" y="540" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="564" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Passed</text><path d="M154 590H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="622" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">TUN interface and route</text><rect x="930" y="602" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="626" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Passed</text><path d="M154 652H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="684" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Core DNS</text><rect x="875.84" y="664" width="160.16" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="955.92" y="688" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Needs attention</text><path d="M154 714H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="653" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="657" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="662" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Run the check from the</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">title bar</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The adjacent control copies the</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">diagnostic report.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Read each result</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">separately</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Distinguish profile, core, local</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">entry, capture and DNS checks.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Results are a limited</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">sample</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">More DNS/HTTPS checks are below.</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">A pass does not validate every</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">app or node.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Windows / macOS → Tools → Network self-check</text></g></svg>
