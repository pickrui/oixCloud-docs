<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">OpenClash · Confirm the managed profile is running</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Confirm the managed profile is running</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">Services</text><text x="333" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="63" y="231" font-size="30" fill="#333" font-weight="650" text-anchor="start">OpenClash</text><rect x="64" y="261" width="991" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="67" y="264" width="241.75" height="33" rx="6" fill="#fff" stroke="none"/><text x="187.875" y="286" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Running status</text><text x="435.625" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Plugin settings</text><text x="683.375" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Profile subscriptions</text><text x="931.125" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Profile management</text><rect x="64" y="329" width="991" height="139" rx="8" fill="#fff" stroke="#ddd"/><text x="86" y="366" font-size="20" fill="#444" font-weight="600" text-anchor="start">Running status</text><text x="86" y="417" font-size="19" fill="#3c9d75" font-weight="600" text-anchor="start">Running</text><text x="331" y="417" font-size="18" fill="#666" font-weight="400" text-anchor="start">Core version: mihomo oix (example)</text><rect x="316" y="386" width="548" height="50" rx="10" fill="none" stroke="#d27336"/><circle cx="860" cy="390" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="860" y="395" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="64" y="499" width="991" height="176" rx="8" fill="#fff" stroke="#ddd"/><text x="86" y="538" font-size="20" fill="#444" font-weight="600" text-anchor="start">Configuration files</text><text x="89" y="592" font-size="22" fill="#466b96" font-weight="600" text-anchor="start">oixCloud - smart.yaml</text><rect x="77" y="558" width="457" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="530" cy="562" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="530" y="567" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="877" y="564" width="128" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="941" y="590" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Switch</text><rect x="873" y="560" width="136" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1005" cy="564" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1005" y="569" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="89" y="644" font-size="18" fill="#777" font-weight="400" text-anchor="start">Rule mode · Using the current configuration</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Find the managed profile</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">oixCloud - smart.yaml comes from</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the integrated account workflow.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Switch and wait for</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">restart</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Wait for the switch to finish;</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">use Start only if still not</text><text x="407" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">running.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check core and an actual</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">device</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The core version includes oix.</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Verify routing and exit from a</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">LAN device.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: LuCI → Services → OpenClash → Running status</text></g></svg>
