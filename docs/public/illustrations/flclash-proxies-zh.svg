<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · 在策略组中选择节点</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · 桌面端</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在策略组中选择节点</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">仪表盘</text><rect x="40" y="263" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="287" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">代理</text><text x="76" y="359" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">配置</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">请求</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">连接</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">工具</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">代理</text><text x="1050" y="202" font-size="23" fill="#715f66" font-weight="500" text-anchor="middle">⋮</text><rect x="152" y="241" width="899" height="48" rx="14" fill="#f6ebef" stroke="none"/><text x="172" y="273" font-size="18" fill="#93848b" font-weight="400" text-anchor="start">⌕  搜索</text><text x="168" y="330" font-size="21" fill="#382b32" font-weight="600" text-anchor="start">⌄  节点选择</text><text x="1030" y="330" font-size="17" fill="#8a5260" font-weight="500" text-anchor="end">测速</text><circle cx="325" cy="318" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="325" y="323" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="153" y="362" width="438" height="112" rx="18" fill="#efd7e1" stroke="#b6778e"/><text x="176" y="400" font-size="21" fill="#202124" font-weight="400" text-anchor="start">香港 · 示例 A</text><text x="176" y="444" font-size="17" fill="#855062" font-weight="400" text-anchor="start">28 ms</text><circle cx="574" cy="374" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="574" y="379" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M540 398l5 5 11-13" fill="none" stroke="#8a5260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="611" y="362" width="438" height="112" rx="18" fill="#f5eff2" stroke="none"/><text x="634" y="400" font-size="21" fill="#202124" font-weight="400" text-anchor="start">日本 · 示例 B</text><text x="634" y="444" font-size="17" fill="#88818a" font-weight="400" text-anchor="start">42 ms</text><rect x="153" y="494" width="438" height="112" rx="18" fill="#f5eff2" stroke="none"/><text x="176" y="532" font-size="21" fill="#202124" font-weight="400" text-anchor="start">新加坡 · 示例 C</text><text x="176" y="576" font-size="17" fill="#88818a" font-weight="400" text-anchor="start">56 ms</text><rect x="611" y="494" width="438" height="112" rx="18" fill="#f5eff2" stroke="none"/><text x="634" y="532" font-size="21" fill="#202124" font-weight="400" text-anchor="start">台湾 · 示例 D</text><text x="634" y="576" font-size="17" fill="#88818a" font-weight="400" text-anchor="start">49 ms</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">展开手动策略组</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">各组有自己的选择，按需要的组调整</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">点选节点卡片</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">选中状态用主题色显示</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">验证新连接</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">延迟是测试值，不代表所有网站或应用可用</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：侧栏 → 代理</text></g></svg>
