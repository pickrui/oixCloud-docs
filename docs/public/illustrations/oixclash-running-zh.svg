<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixClash · 开启代理与低内存模式</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixClash · Merlin 路由器</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">开启代理与低内存模式</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#20333e" stroke="none"/><rect x="220" y="149" width="849" height="611" rx="4" fill="#4d595d" stroke="none"/><text x="48" y="174" font-size="20" fill="#d5e4e8" font-weight="700" text-anchor="start">ASUSWRT</text><text x="241" y="181" font-size="24" fill="#fff" font-weight="600" text-anchor="start">软件中心 - oixClash</text><rect x="43" y="205" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="234" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">网络地图</text><rect x="43" y="256" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="285" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">AiMesh</text><rect x="43" y="307" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="336" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">访客网络</text><rect x="43" y="358" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="387" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">流量分析</text><rect x="43" y="409" width="164" height="46" rx="3" fill="#387aa0" stroke="none"/><text x="60" y="438" font-size="17" fill="#f2f6f8" font-weight="600" text-anchor="start">软件中心</text><rect x="43" y="460" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="489" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">无线网络</text><rect x="43" y="511" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="540" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">内部网络</text><rect x="43" y="562" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="591" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">外部网络</text><rect x="43" y="613" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="642" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">IPv6</text><rect x="43" y="664" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="693" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">系统管理</text><text x="243" y="216" font-size="17" fill="#dbe7eb" font-weight="400" text-anchor="start">已登录：reader@example.com  ·  示例套餐</text><rect x="239" y="239" width="811" height="33" rx="0" fill="#73838a" stroke="none"/><text x="252" y="262" font-size="17" fill="#fff" font-weight="600" text-anchor="start">运行</text><rect x="239" y="272" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="272" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="304" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">开启</text><rect x="421" y="284" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="456" cy="298.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="502" y="304" font-size="17" fill="#e2ecf0" font-weight="400" text-anchor="start">插件版本：0.0.3</text><text x="733" y="304" font-size="16" fill="#41b6d5" font-weight="400" text-anchor="start">检查更新</text><rect x="923" y="280" width="112" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="979" y="304" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">查看日志</text><circle cx="474" cy="282" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="474" y="287" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="239" y="325" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="325" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="357" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">运行状态</text><text x="421" y="357" font-size="17" fill="#b7e46e" font-weight="400" text-anchor="start">运行中  ·  内核 alpha-oix-示例  ·  UDP 已转发</text><rect x="239" y="378" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="378" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="410" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">节点切换</text><rect x="421" y="386" width="150" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="496" y="410" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">打开控制面板</text><rect x="239" y="431" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="431" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="463" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">UDP 转发</text><rect x="421" y="450" width="17" height="17" rx="2" fill="#2ba5d0" stroke="none"/><path d="M424 459l4 4 7-10" fill="none" stroke="#fff" stroke-width="2"/><text x="450" y="462" font-size="17" fill="#fff" font-weight="400" text-anchor="start">游戏、语音通话等 UDP 流量也走代理</text><circle cx="1017" cy="443" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1017" y="448" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="239" y="484" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="484" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="516" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">屏蔽 QUIC</text><rect x="421" y="503" width="17" height="17" rx="2" fill="#fff" stroke="none"/><text x="450" y="515" font-size="17" fill="#fff" font-weight="400" text-anchor="start">未开启 UDP 转发时建议开启</text><rect x="239" y="537" width="811" height="110" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="537" width="164" height="110" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="569" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">低内存模式</text><rect x="421" y="557" width="17" height="17" rx="2" fill="#2ba5d0" stroke="none"/><path d="M424 566l4 4 7-10" fill="none" stroke="#fff" stroke-width="2"/><text x="450" y="570" font-size="17" fill="#fff" font-weight="400" text-anchor="start">适合 256MB 内存的路由器</text><text x="421" y="599" font-size="16" fill="#dce6eb" font-weight="400" text-anchor="start">内核放在 JFFS 上运行，使用精简 GeoIP 库</text><text x="421" y="628" font-size="16" fill="#b7e46e" font-weight="400" text-anchor="start">本机内存 256MB  ·  内核在 JFFS 上运行</text><circle cx="1017" cy="549" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1017" y="554" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="422" y="681" width="150" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="497" y="705" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">保存并应用</text><rect x="596" y="681" width="133" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="662.5" y="705" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">更新节点</text><rect x="753" y="681" width="107" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="806.5" y="705" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">自检</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">打开开关并保存</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">等运行状态显示运行中，再验证局域网连接</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按需开启 UDP</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">游戏或语音需 UDP；是否生效以状态为准</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">小内存设备</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">勾选低内存模式后保存，检查 JFFS 提示</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：软件中心 → oixClash → 运行</text></g></svg>
