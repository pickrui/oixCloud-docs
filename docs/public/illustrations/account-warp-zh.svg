<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 找到节点的 WARP 与智能回退</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">找到节点的 WARP 与智能回退</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">WARP 设置</text><g transform="translate(-100 0)"><rect x="245" y="306" width="808" height="102" rx="12" fill="#edf3fd" stroke="none"/><text x="267" y="341" font-size="19" fill="#45668b" font-weight="600" text-anchor="start">智能回退</text><text x="267" y="375" font-size="17" fill="#677f9e" font-weight="400" text-anchor="start">WARP 不可用时使用节点普通出口</text><rect x="245" y="432" width="808" height="246" rx="12" fill="#fff" stroke="none"/><text x="270" y="477" font-size="24" fill="#314f78" font-weight="600" text-anchor="start">香港 · 示例 A</text><rect x="259" y="445" width="355" height="49" rx="10" fill="none" stroke="#d27336"/><circle cx="610" cy="449" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="610" y="454" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="271" y="534" font-size="20" fill="#202124" font-weight="400" text-anchor="start">启用 WARP</text><rect x="961" y="512" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="996" cy="526.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="945" y="501" width="86" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1027" cy="505" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1027" y="510" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="271" y="607" font-size="20" fill="#202124" font-weight="400" text-anchor="start">智能回退</text><rect x="961" y="585" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="976" cy="599.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="945" y="575" width="86" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1027" cy="579" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1027" y="584" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">找到要调整的节点</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">此设置按支持节点生效，先确认节点名称</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对 WARP 开关</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">开启会移除相关中继，先记录仍需保留的设</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">置</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按出口要求选择回退</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">回退使用远程节点普通出口，保存后重连验</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">证</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → WARP 设置</text></g></svg>
