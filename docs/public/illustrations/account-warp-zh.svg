-weight="600" text-anchor="middle">IPv4 Only</text><path d="M264 718H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="734" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="750" font-size="18" fill="#314f78" font-weight="600" text-anchor="start">香港 · 示例 C</text><rect x="557" y="729" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="572" cy="743.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="724" y="750" font-size="18" fill="#8b9ab0" font-weight="400" text-anchor="middle">—</text><text x="925" y="750" font-size="18" fill="#8b9ab0" font-weight="400" text-anchor="middle">—</text><rect x="545" y="611" width="74" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="615" cy="615" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="615" y="620" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="687" y="665" width="74" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="757" cy="669" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="757" y="674" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="851" y="666" width="148" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="995" cy="670" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="995" y="675" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">启用前核对中继影响</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">开启 WARP 会删除冲突中继，关闭后不会</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">恢复</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按需求选择智能回退</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">WARP 不可用时允许使用节点普通出口，IP</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> 或地区可能变化</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">IPv4 Only 优先</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">此行出口偏好不可切换，点击管理；关闭后</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">恢复原偏好</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 流量路由 → 出口 → WARP</text></g></svg>
