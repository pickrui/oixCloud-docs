<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 开启自动重置前核对每次费用</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">开启自动重置前核对每次费用</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">套餐管理</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="445" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="344" font-size="24" fill="#405675" font-weight="600" text-anchor="start">示例套餐 A</text><text x="1030" y="344" font-size="18" fill="#3b967b" font-weight="600" text-anchor="end">使用中</text><rect x="255" y="310" width="787" height="52" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="314" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="319" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="398" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">剩余时间</text><text x="665" y="398" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">剩余流量</text><text x="267" y="437" font-size="24" fill="#405675" font-weight="600" text-anchor="start">20 天</text><text x="665" y="437" font-size="24" fill="#c55a18" font-weight="600" text-anchor="start">0 GiB</text><path d="M267 465H1030" stroke="#dedee3" stroke-width="1"/><text x="267" y="504" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">续费价格</text><text x="1030" y="504" font-size="22" fill="#405675" font-weight="600" text-anchor="end">—</text><text x="267" y="566" font-size="20" fill="#405675" font-weight="600" text-anchor="start">自动续费</text><rect x="977" y="542" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="992" cy="556.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="267" y="637" font-size="20" fill="#405675" font-weight="600" text-anchor="start">自动重置流量</text><rect x="977" y="613" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="992" cy="627.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="267" y="673" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">每次 ¥60.00</text><rect x="255" y="604" width="787" height="88" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="608" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="613" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="255" y="370" width="221" height="84" rx="10" fill="none" stroke="#d27336"/><circle cx="472" cy="374" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="472" y="379" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">确认当前生效记录</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">待激活套餐的设置在激活后才适用</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对每次费用再开启</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">图中尚未开启；流量已用完时注意开启并扣</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">款提示</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">到期时间保持不变</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">这是付费重置，不是续期；再次耗尽可能再</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">次扣款</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 套餐管理 → 自动重置流量</text></g></svg>
