<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Build a proxy chain in order</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Build a proxy chain in order</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">Cancel</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">New Chain</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">✓</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><circle cx="475" cy="241" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="475" y="246" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="276" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="309" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Name</text><text x="456" y="309" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Work Chain</text><rect x="68" y="276" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="280" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="285" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="82" y="378" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Proxies</text><rect x="68" y="390" width="404" height="189" rx="14" fill="#fff" stroke="none"/><text x="84" y="417" font-size="20" fill="#202124" font-weight="400" text-anchor="start">HK · Example A</text><text x="84" y="441" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">Entry</text><text x="456" y="423" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">≡</text><path d="M84 458H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="390" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="394" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="399" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="485" font-size="20" fill="#202124" font-weight="400" text-anchor="start">JP · Example B</text><text x="84" y="509" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">Exit</text><text x="456" y="491" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">≡</text><path d="M84 526H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="559" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">＋ Add Proxy</text><text x="83" y="625" font-size="15" fill="#85858d" font-weight="400" text-anchor="start">A policy group can only be the first hop.</text><text x="82" y="695" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Route Preview</text><rect x="68" y="707" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="740" font-size="20" fill="#202124" font-weight="400" text-anchor="start">HK · Example A</text><path d="M84 760H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="793" font-size="20" fill="#202124" font-weight="400" text-anchor="start">↓  JP · Example B</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Proxies → Chains → Add</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Name the chain</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Use a name that describes its purpose.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Arrange members in forwarding order</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Eligible policy groups can be the first</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">hop only. Test nodes individually first.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Save, then select the chain</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Check Route Preview. Select the saved</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">chain on Home or in a rule.</text></g></svg>
