<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">OpenClash · Filter and update the managed profile</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Filter and update the managed profile</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">Services</text><text x="333" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="63" y="231" font-size="30" fill="#333" font-weight="650" text-anchor="start">OpenClash</text><rect x="64" y="261" width="991" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="187.875" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Running status</text><rect x="314.75" y="264" width="241.75" height="33" rx="6" fill="#fff" stroke="none"/><text x="435.625" y="286" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Plugin settings</text><text x="683.375" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Profile subscriptions</text><text x="931.125" y="286" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Profile management</text><circle cx="278" cy="256" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="278" y="261" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="72" y="345" width="975" height="302" rx="13" fill="#fff" stroke="#d7dce1"/><text x="102" y="402" font-size="27" fill="#25384a" font-weight="650" text-anchor="start">oixCloud</text><text x="102" y="450" font-size="21" fill="#435b70" font-weight="400" text-anchor="start">reader@example.com</text><rect x="102" y="515" width="170" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="187" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Update Config</text><rect x="98" y="511" width="178" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="272" cy="515" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="272" y="520" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="294" y="515" width="160" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="374" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Node Filter</text><rect x="290" y="511" width="168" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="454" cy="515" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="454" y="520" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="476" y="515" width="166" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="559" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Checkin</text><rect x="664" y="515" width="228" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="778" y="541" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">oixCloud Website</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Filter on the website</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Open Node Filter, preview the</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">nodes, save and return here.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Select Update Config</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">When the managed profile is</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">active, the plugin restarts to</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">load it.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the active profile</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Look for oixCloud.yaml on the</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">status page. Switch manually if</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">another profile is active.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Plugin Settings → oixCloud</text></g></svg>
