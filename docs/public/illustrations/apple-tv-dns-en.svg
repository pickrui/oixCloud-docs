<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixFlow · Set DNS on Apple TV</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixFlow · Apple TV</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Set DNS on Apple TV</text><rect x="30" y="130" width="1060" height="653" rx="16" fill="#e9edf4" stroke="none"/><text x="87" y="204" font-size="40" fill="#25354d" font-weight="650" text-anchor="start">DNS</text><rect x="84" y="246" width="952" height="76" rx="13" fill="#fff" stroke="none"/><text x="110" y="294" font-size="24" fill="#344961" font-weight="600" text-anchor="start">DNS Sync</text><text x="984" y="294" font-size="22" fill="#526983" font-weight="500" text-anchor="end">Off</text><circle cx="1017" cy="255" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1017" y="260" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="86" y="386" font-size="19" fill="#657a91" font-weight="600" text-anchor="start">Global DNS</text><rect x="84" y="407" width="952" height="81" rx="13" fill="#fff" stroke="#becbdb"/><text x="110" y="458" font-size="23" fill="#344961" font-weight="600" text-anchor="start">Custom DNS</text><text x="985" y="458" font-size="23" fill="#526983" font-weight="500" text-anchor="end">192.0.2.53</text><circle cx="358" cy="422" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="358" y="427" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="84" y="503" width="952" height="68" rx="11" fill="#f8faff" stroke="none"/><text x="110" y="547" font-size="23" fill="#344961" font-weight="400" text-anchor="start">Strict DNS</text><text x="984" y="547" font-size="22" fill="#526983" font-weight="500" text-anchor="end">Off</text><rect x="84" y="585" width="952" height="68" rx="11" fill="#f8faff" stroke="none"/><text x="110" y="628" font-size="23" fill="#344961" font-weight="400" text-anchor="start">Allow System DNS Fallback</text><text x="984" y="628" font-size="22" fill="#526983" font-weight="500" text-anchor="end">On</text><rect x="776" y="424" width="216" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="988" cy="428" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="988" y="433" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check DNS Sync</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">With sync on, the TV receives DNS</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> settings from the publishing</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">iPhone or iPad.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Edit this TV only</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Turn off DNS Sync, open Custom</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">DNS and confirm the new address.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Verify the change</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Reopen the page to check the</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">server. Make a fresh query from a</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> TV app.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Settings → DNS</text></g></svg>
