<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Create a policy group</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Create a policy group</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">Cancel</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Work</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">Save</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><circle cx="476" cy="241" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="476" y="246" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="266" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="299" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Name</text><text x="456" y="299" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Work</text><path d="M84 319H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="352" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Type</text><text x="444" y="352" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">URL Test</text><path d="M454 342l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="319" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="323" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="328" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="82" y="413" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Members</text><rect x="68" y="425" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="458" font-size="20" fill="#202124" font-weight="400" text-anchor="start">HK · Example A</text><path d="M84 478H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="511" font-size="20" fill="#202124" font-weight="400" text-anchor="start">JP · Example B</text><path d="M84 531H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="564" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">＋ Add Members</text><rect x="68" y="531" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="535" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="540" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="68" y="621" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="654" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Underlying Proxy</text><text x="444" y="654" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">None</text><path d="M454 644l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><text x="82" y="723" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Health Check</text><rect x="68" y="735" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="768" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Test URL</text><text x="456" y="768" font-size="13" fill="#85858d" font-weight="400" text-anchor="end">https://example.com</text><path d="M84 788H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="821" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Expected HTTP Status</text><text x="456" y="821" font-size="16" fill="#85858d" font-weight="400" text-anchor="end">200</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Proxies → Policies → Add Policy Group</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Set the name and type</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Choose Manual, URL Test, Fallback, Load</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Balance or Smart for your needs.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Add members and check the relay</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">The example has two nodes. Leave</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Underlying Proxy as None if not needed.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Save and select the group</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">More Health Check options are below.</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Select the saved group on Home or in a</text><text x="552" y="884" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">rule.</text></g></svg>
