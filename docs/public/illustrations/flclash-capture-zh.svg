ont-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">系统代理</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">接管遵循系统 HTTP 代理设置的应用</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">虚拟网卡</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">需要平台支持与相应权限，启用后确认实际</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">流量</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按问题调整设置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">排除域名只在系统代理开启时生效，避免同</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">时修改多项</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：工具 → 高级配置 → 网络</text></g></svg>
