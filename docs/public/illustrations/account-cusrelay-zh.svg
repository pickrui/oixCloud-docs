<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 填写外部中继目标与模式</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">填写外部中继目标与模式</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">添加外部中继</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="43" rx="8" fill="#fff" stroke="#d5deea"/><text x="314" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">内部中继</text><rect x="383" y="304" width="130" height="35" rx="6" fill="#e2edff" stroke="none"/><text x="448" y="327" font-size="15" fill="#326cc4" font-weight="600" text-anchor="middle">外部中继</text><text x="582" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">HTTP/3</text><text x="716" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">WARP</text><text x="850" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">IPv4 Only</text><text x="984" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">流媒体解锁</text><rect x="245" y="360" width="808" height="415" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="389" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">起源节点</text><rect x="267" y="401" width="489" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="430" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">香港 · 示例 A</text><rect x="263" y="397" width="497" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="756" cy="401" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="756" y="406" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="781" y="389" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">起源端口</text><rect x="781" y="401" width="249" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="794" y="430" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">20000</text><text x="267" y="477" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">目标地址</text><rect x="267" y="489" width="489" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="518" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">relay.example.com</text><text x="781" y="477" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">目标端口</text><rect x="781" y="489" width="249" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="794" y="518" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">22</text><rect x="777" y="485" width="257" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="489" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="494" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="267" y="565" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">备注</text><rect x="267" y="577" width="357" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="606" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">SSH 示例</text><text x="649" y="565" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">仅转发指定域名/IP</text><rect x="649" y="577" width="381" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="662" y="606" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">留空转发全部访问</text><rect x="267" y="650" width="18" height="18" rx="3" fill="#fff" stroke="#9daec5"/><text x="301" y="666" font-size="17" fill="#445a77" font-weight="600" text-anchor="start">协议保持模式</text><rect x="255" y="637" width="393" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="644" cy="641" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="644" y="646" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="267" y="704" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">未勾选：起源解密后转发 TCP / UDP</text><rect x="827" y="724" width="203" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="928.5" y="750" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">添加中继规则</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先选可用起源</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">个人端口只读，起源不能已有冲突规则</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">填写真实服务端口</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">图为协议转换，端口提示不代表目标可达</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对模式后保存</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">协议保持需运行安装指令，保存后更新订阅</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 流量路由 → 外部中继 → 添加中继规则</text></g></svg>
