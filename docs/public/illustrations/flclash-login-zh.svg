ont-weight="400" text-anchor="start">码</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">填写后点右上角勾号</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">这是表单确认入口；示例不含真实账户或令</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">牌</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">继续同步配置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">关闭表单返回账户页，等待配置同步完成</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：侧栏 oixCloud → 登录</text></g></svg>
