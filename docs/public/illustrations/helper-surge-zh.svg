<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud Helper · 从菜单栏接入 Surge</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud Helper · macOS</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">从菜单栏接入 Surge</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#dfe7f3" stroke="none"/><rect x="30" y="130" width="1060" height="34" rx="14" fill="#f5f6f9" stroke="none"/><text x="53" y="153" font-size="15" fill="#384052" font-weight="400" text-anchor="start">●   Finder   文件   编辑   显示   前往   窗口</text><text x="1049" y="153" font-size="15" fill="#384052" font-weight="500" text-anchor="end">☁    09:41</text><rect x="85" y="187" width="242" height="203" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="103" y="221" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">oixCloud</text><text x="103" y="258" font-size="17" fill="#303946" font-weight="400" text-anchor="start">账户</text><path d="M303 247l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><circle cx="319" cy="234" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="319" y="239" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="103" y="295" font-size="17" fill="#303946" font-weight="400" text-anchor="start">节点</text><path d="M303 284l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><rect x="90" y="308" width="232" height="34" rx="6" fill="#2676df" stroke="none"/><text x="103" y="332" font-size="17" fill="#fff" font-weight="400" text-anchor="start">连接设置</text><path d="M303 321l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="103" y="369" font-size="17" fill="#303946" font-weight="400" text-anchor="start">工具</text><path d="M303 358l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><rect x="333" y="303" width="672" height="425" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="351" y="337" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">SOCKS5 + HTTP  127.0.0.1:7100</text><text x="351" y="374" font-size="17" fill="#303946" font-weight="400" text-anchor="start">开机启动</text><text x="351" y="411" font-size="17" fill="#303946" font-weight="400" text-anchor="start">本地端口…</text><text x="351" y="448" font-size="17" fill="#303946" font-weight="400" text-anchor="start">允许局域网访问</text><text x="351" y="485" font-size="17" fill="#303946" font-weight="400" text-anchor="start">局域网访问鉴权…（未开启）</text><text x="351" y="522" font-size="17" fill="#303946" font-weight="400" text-anchor="start">接入模式…（当前：本地多端口映射）</text><circle cx="997" cy="498" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="997" y="503" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="351" y="559" font-size="17" fill="#303946" font-weight="400" text-anchor="start">节点筛选 · 智能优选</text><text x="351" y="596" font-size="17" fill="#303946" font-weight="400" text-anchor="start">精简规则</text><text x="351" y="633" font-size="17" fill="#303946" font-weight="400" text-anchor="start">复制本机节点列表 URL</text><rect x="338" y="646" width="662" height="34" rx="6" fill="#2676df" stroke="none"/><text x="351" y="670" font-size="17" fill="#fff" font-weight="400" text-anchor="start">接入 Surge</text><circle cx="997" cy="646" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="997" y="651" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="351" y="707" font-size="17" fill="#303946" font-weight="400" text-anchor="start">导出 OpenSurge 配置</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先完成账户登录</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">等待账户与节点获取完成，再打开连接设置</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对接入模式</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">多端口模式在 Surge 选节点，单端口模式</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">在 Helper 选</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">接入并核对配置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">点接入 Surge 后，确认 Surge 已切换到</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">生成的配置</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：菜单栏 oixCloud → 连接设置</text></g></svg>
