<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud Helper · 从菜单栏接入 Surge</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud Helper · macOS</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">从菜单栏接入 Surge</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#dfe7f3" stroke="none"/><rect x="30" y="130" width="1060" height="34" rx="14" fill="#f5f6f9" stroke="none"/><text x="53" y="153" font-size="15" fill="#384052" font-weight="400" text-anchor="start">●   Finder   文件   编辑   显示   前往   窗口</text><text x="1049" y="153" font-size="15" fill="#384052" font-weight="500" text-anchor="end">☁    09:41</text><rect x="85" y="187" width="242" height="240" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="103" y="221" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">oixCloud</text><text x="103" y="258" font-size="17" fill="#303946" font-weight="400" text-anchor="start">节点</text><path d="M303 247l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><circle cx="319" cy="234" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="319" y="239" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="90" y="271" width="232" height="34" rx="6" fill="#2676df" stroke="none"/><text x="103" y="295" font-size="17" fill="#fff" font-weight="400" text-anchor="start">客户端接入</text><path d="M303 284l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="103" y="332" font-size="17" fill="#303946" font-weight="400" text-anchor="start">账户</text><path d="M303 321l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><text x="103" y="369" font-size="17" fill="#303946" font-weight="400" text-anchor="start">设置</text><path d="M303 358l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><text x="103" y="406" font-size="17" fill="#303946" font-weight="400" text-anchor="start">工具</text><path d="M303 395l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><rect x="333" y="271" width="642" height="203" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="351" y="305" font-size="17" fill="#303946" font-weight="400" text-anchor="start">接入 Surge</text><circle cx="967" cy="281" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="967" y="286" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="351" y="342" font-size="17" fill="#303946" font-weight="400" text-anchor="start">节点更新后自动接入 Surge</text><circle cx="967" cy="318" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="967" y="323" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="351" y="379" font-size="17" fill="#303946" font-weight="400" text-anchor="start">导出 OpenSurge 配置</text><text x="351" y="416" font-size="17" fill="#303946" font-weight="400" text-anchor="start">复制本机节点列表 URL</text><text x="351" y="453" font-size="17" fill="#303946" font-weight="400" text-anchor="start">精简规则</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">在节点菜单更新</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">登录后可在节点菜单筛选或更新托管节点</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">首次手动接入</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">点接入 Surge，再确认 Surge 已选中生</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">成的配置</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按需开启自动接入</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">默认关闭，开启后节点变化会重新写入</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Surge</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：菜单栏 oixCloud → 客户端接入</text></g></svg>
