<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 核对升级费用与剩余流量</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">核对升级费用与剩余流量</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">套餐管理</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="451" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="340" font-size="24" fill="#405675" font-weight="600" text-anchor="start">更换/升级</text><text x="267" y="380" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">选择升级目标套餐</text><rect x="267" y="392" width="763" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="280" y="421" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">示例套餐 B · 季付</text><rect x="263" y="388" width="771" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="392" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="397" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="469" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">折扣代码（可选）</text><rect x="267" y="482" width="560" height="40" rx="7" fill="#fff" stroke="#d5deea"/><rect x="850" y="482" width="180" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="940" y="508" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">验证</text><text x="267" y="567" font-size="20" fill="#596b85" font-weight="600" text-anchor="start">实际支付金额：</text><text x="1030" y="567" font-size="24" fill="#405675" font-weight="600" text-anchor="end">CNY 50.00</text><text x="267" y="611" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">升级后剩余高速流量</text><text x="1030" y="611" font-size="20" fill="#405675" font-weight="600" text-anchor="end">120.00 GiB</text><text x="267" y="647" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">流量净变化</text><text x="1030" y="647" font-size="20" fill="#405675" font-weight="600" text-anchor="end">+70.00 GiB</text><rect x="255" y="533" width="787" height="131" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="537" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="542" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="690" y="697" width="340" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="860" y="723" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">确认更换/升级</text><rect x="686" y="693" width="348" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="697" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="702" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对目标与原计费周期</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">从原记录进入；目标必须支持原计费周期</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对最终报价与流量</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">普通套餐保留已用量和到期时间，不是重新</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">给满</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">确认后检查原记录</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">核对目标套餐、余额、续费价及开关状态</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 套餐管理 → 升级／更换</text></g></svg>
