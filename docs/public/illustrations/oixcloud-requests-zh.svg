<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 查看请求的路由判定</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">查看请求的路由判定</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ 请求</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">请求</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><text x="82" y="258" font-size="15" fill="#727279" font-weight="400" text-anchor="start">连接</text><rect x="68" y="270" width="404" height="212" rx="14" fill="#fff" stroke="none"/><text x="84" y="303" font-size="20" fill="#202124" font-weight="400" text-anchor="start">域名</text><text x="456" y="303" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">example.com</text><path d="M84 323H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="270" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="274" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="279" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="356" font-size="20" fill="#202124" font-weight="400" text-anchor="start">端口</text><text x="456" y="356" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">443</text><path d="M84 376H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="409" font-size="20" fill="#202124" font-weight="400" text-anchor="start">协议</text><text x="456" y="409" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">HTTPS</text><path d="M84 429H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="462" font-size="20" fill="#202124" font-weight="400" text-anchor="start">时间</text><text x="456" y="462" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">09:41:00</text><text x="82" y="524" font-size="15" fill="#727279" font-weight="400" text-anchor="start">判定</text><rect x="68" y="536" width="404" height="227" rx="14" fill="#fff" stroke="none"/><text x="84" y="569" font-size="20" fill="#202124" font-weight="400" text-anchor="start">结果</text><text x="456" y="569" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">代理</text><path d="M84 589H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="536" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="540" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="545" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="622" font-size="20" fill="#202124" font-weight="400" text-anchor="start">路由</text><text x="456" y="622" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">香港 · 示例 A</text><path d="M84 642H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="675" font-size="20" fill="#202124" font-weight="400" text-anchor="start">原因</text><text x="456" y="675" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">规则匹配</text><path d="M84 695H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="722" font-size="20" fill="#202124" font-weight="400" text-anchor="start">匹配规则</text><text x="84" y="746" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">DOMAIN-SUFFIX,example.com</text><rect x="68" y="695" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="699" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="704" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">活动 → 请求 → 一条请求</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">先找到目标域名</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">图中 example.com 为虚构请求</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">核对路由结果</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">查看该请求使用的路线与判定原因</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">检查匹配规则</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">修改规则后重新建立连接，再核对规则与出口</text></g></svg>
