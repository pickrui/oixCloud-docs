<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixFlow · 用遥控器选择出口</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixFlow · Apple TV</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">用遥控器选择出口</text><rect x="30" y="130" width="1060" height="653" rx="16" fill="#e9edf4" stroke="none"/><text x="84" y="206" font-size="38" fill="#25354d" font-weight="650" text-anchor="start">选择代理</text><text x="1036" y="205" font-size="20" fill="#42668e" font-weight="500" text-anchor="end">全部测试</text><circle cx="64" cy="193" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="64" y="198" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="80" y="254" width="960" height="76" rx="13" fill="#f8faff" stroke="none"/><text x="111" y="302" font-size="25" fill="#344961" font-weight="550" text-anchor="start">自动优选 · URL Test</text><text x="85" y="394" font-size="20" fill="#657a91" font-weight="550" text-anchor="start">链式代理</text><rect x="80" y="418" width="960" height="76" rx="13" fill="#fff" stroke="#b6c8df"/><text x="110" y="467" font-size="26" fill="#263951" font-weight="600" text-anchor="start">工作代理链</text><rect x="76" y="414" width="968" height="84" rx="10" fill="none" stroke="#d27336"/><circle cx="1040" cy="418" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1040" y="423" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="85" y="555" font-size="20" fill="#657a91" font-weight="550" text-anchor="start">oixCloud</text><rect x="80" y="578" width="960" height="76" rx="13" fill="#f8faff" stroke="none"/><text x="110" y="626" font-size="24" fill="#344961" font-weight="500" text-anchor="start">香港 · 示例 A</text><path d="M80 690H1040" stroke="#cad6e3" stroke-width="1"/><text x="107" y="740" font-size="18" fill="#62758b" font-weight="550" text-anchor="start">为规则集选组</text><text x="390" y="740" font-size="22" fill="#354e68" font-weight="550" text-anchor="start">设置 → 路由规则</text><circle cx="1022" cy="727" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1022" y="732" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">打开主页的节点卡片</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">点节点或链名即可选用；有可用成员时也可</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">选自动优选</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">选择已有的链</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">新的组和代理链在 iPhone 或 iPad 创建</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">后同步</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">为服务选策略组</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">在设置中选规则模式，再到路由规则为规则</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">集指定组</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：主页 → 当前节点卡片 → 选择代理</text></g></svg>
