<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · 导入普通订阅网址</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · 桌面端</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">导入普通订阅网址</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">仪表盘</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">代理</text><rect x="40" y="335" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="359" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">配置</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">请求</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS 查询</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">连接</text><text x="76" y="719" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">工具</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">配置</text><rect x="213" y="242" width="810" height="416" rx="23" fill="#fff8fb" stroke="#d8cbd3"/><text x="251" y="299" font-size="26" fill="#48323f" font-weight="650" text-anchor="start">从链接导入</text><text x="977" y="299" font-size="24" fill="#894d69" font-weight="600" text-anchor="end">✓</text><circle cx="988" cy="263" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="988" y="268" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="252" y="360" width="728" height="58" rx="7" fill="#fffbfc" stroke="#9d8d92"/><rect x="262" y="351" width="44" height="18" rx="0" fill="#fffbfc" stroke="none"/><text x="269" y="364" font-size="14" fill="#756067" font-weight="400" text-anchor="start">名称</text><text x="269" y="398" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start">个人订阅（示例）</text><rect x="252" y="459" width="728" height="58" rx="7" fill="#fffbfc" stroke="#9d8d92"/><rect x="262" y="450" width="44" height="18" rx="0" fill="#fffbfc" stroke="none"/><text x="269" y="463" font-size="14" fill="#756067" font-weight="400" text-anchor="start">链接</text><text x="269" y="497" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start">https://example.com/subscription</text><rect x="248" y="455" width="736" height="66" rx="10" fill="none" stroke="#d27336"/><circle cx="980" cy="459" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="980" y="464" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="252" y="558" width="728" height="58" rx="7" fill="#fffbfc" stroke="#9d8d92"/><rect x="262" y="549" width="104" height="18" rx="0" fill="#fffbfc" stroke="none"/><text x="269" y="562" font-size="14" fill="#756067" font-weight="400" text-anchor="start">age 私钥</text><text x="269" y="596" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start"></text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">复制完整订阅网址</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">oixCloud 用户从订阅地址复制</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Clash/Stash 主订阅</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">粘贴并保存</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">名称可自定，在链接栏粘贴后点右上角的勾</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">选中导入的配置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">在代理页选节点，以后从这份配置的菜单点</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">同步</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：配置 → 添加配置 → 链接</text></g></svg>
