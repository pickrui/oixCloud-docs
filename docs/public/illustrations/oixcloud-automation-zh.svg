4" font-weight="400" text-anchor="start">Cron 定时</text><rect x="406" y="652" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="666.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 693H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="726" font-size="20" fill="#202124" font-weight="400" text-anchor="start">oixCloud 已启动</text><rect x="406" y="705" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="719.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 746H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="779" font-size="20" fill="#202124" font-weight="400" text-anchor="start">网络已更改</text><rect x="406" y="758" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="772.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="68" y="838" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="871" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">立即运行</text><rect x="68" y="838" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="842" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="847" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">设置 → 自动化 → 新增脚本</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">核对脚本来源与客户端</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">选择脚本实际针对的客户端格式</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">按需设置触发器</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">先手动验证，再开启定时或网络变化触发</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">检查运行记录</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">保存并运行后，检查最近运行的结果与错误</text></g></svg>
