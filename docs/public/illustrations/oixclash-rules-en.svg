<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixClash · Read and save shared account rules</title><desc id="desc">English reference with bilingual labels for the Chinese-only plugin UI; fictional data, not a screenshot.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixClash · Merlin router</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">English guide · Chinese-only plugin UI</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Read and save shared account rules</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#20333e" stroke="none"/><rect x="220" y="149" width="849" height="611" rx="4" fill="#4d595d" stroke="none"/><text x="48" y="174" font-size="20" fill="#d5e4e8" font-weight="700" text-anchor="start">ASUSWRT</text><text x="241" y="175" font-size="24" fill="#fff" font-weight="600" text-anchor="start">Software Center - oixClash</text><text x="241" y="191" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start">软件中心 - oixClash</text><rect x="43" y="205" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="228" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">Network map</text><text x="60" y="244" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">网络地图</text><rect x="43" y="256" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="285" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">AiMesh</text><rect x="43" y="307" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="330" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">Guest network</text><text x="60" y="346" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">访客网络</text><rect x="43" y="358" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="381" font-size="16.486161251504214" fill="#f2f6f8" font-weight="400" text-anchor="start">Traffic analyzer</text><text x="60" y="397" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">流量分析</text><rect x="43" y="409" width="164" height="46" rx="3" fill="#387aa0" stroke="none"/><text x="60" y="432" font-size="16.545893719806763" fill="#f2f6f8" font-weight="600" text-anchor="start">Software Center</text><text x="60" y="448" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">软件中心</text><rect x="43" y="460" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="483" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">Wireless</text><text x="60" y="499" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">无线网络</text><rect x="43" y="511" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="534" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">LAN</text><text x="60" y="550" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">内部网络</text><rect x="43" y="562" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="585" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">WAN</text><text x="60" y="601" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">外部网络</text><rect x="43" y="613" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="642" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">IPv6</text><rect x="43" y="664" width="164" height="46" rx="3" fill="#354247" stroke="none"/><text x="60" y="687" font-size="17" fill="#f2f6f8" font-weight="400" text-anchor="start">Administration</text><text x="60" y="703" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">系统管理</text><text x="243" y="210" font-size="17" fill="#dbe7eb" font-weight="400" text-anchor="start">Shared account rules run before panel defaults</text><text x="243" y="226" font-size="10.5" fill="#dbe7eb" font-weight="400" text-anchor="start">账号规则与网站共用，排在面板默认规则之前</text><rect x="239" y="239" width="811" height="33" rx="0" fill="#73838a" stroke="none"/><text x="252" y="253" font-size="15" fill="#fff" font-weight="600" text-anchor="start">Custom rules</text><text x="252" y="269" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start">自定义规则</text><rect x="239" y="272" width="811" height="385" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="272" width="164" height="385" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="298" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Account rules</text><text x="252" y="314" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">账号规则</text><rect x="420" y="289" width="609" height="180" rx="0" fill="#22343d" stroke="#8fa3ad"/><text x="435" y="324" font-size="19" fill="#e6edf2" font-weight="400" text-anchor="start">DOMAIN-SUFFIX,example.com,DIRECT</text><text x="435" y="360" font-size="19" fill="#e6edf2" font-weight="400" text-anchor="start">DOMAIN,ads.example.com,REJECT</text><circle cx="1018" cy="286" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1018" y="291" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="420" y="490" font-size="16" fill="#e2ecf0" font-weight="400" text-anchor="start">One rule per line; no rules: header or leading dash</text><text x="420" y="506" font-size="10.5" fill="#e2ecf0" font-weight="400" text-anchor="start">每行一条，无需 rules: 或行首短横线</text><text x="420" y="525" font-size="16" fill="#ffce55" font-weight="400" text-anchor="start">Saving an empty editor clears account rules</text><text x="420" y="541" font-size="10.5" fill="#ffce55" font-weight="400" text-anchor="start">留空并保存可清除面板账号规则</text><text x="420" y="560" font-size="17" fill="#41b6d5" font-weight="400" text-anchor="start">Manage panel account rules</text><text x="420" y="576" font-size="10.5" fill="#41b6d5" font-weight="400" text-anchor="start">管理面板账号规则</text><rect x="420" y="589" width="166" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="503" y="607" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Read panel rules</text><text x="503" y="623" font-size="10.5" fill="#fff" font-weight="400" text-anchor="middle">读取面板规则</text><rect x="416" y="585" width="174" height="44" rx="10" fill="none" stroke="#d27336"/><circle cx="586" cy="589" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="586" y="594" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="613" y="589" width="211" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="718.5" y="607" font-size="15.977291159772907" fill="#fff" font-weight="600" text-anchor="middle">Save to panel and update</text><text x="718.5" y="623" font-size="10.5" fill="#fff" font-weight="400" text-anchor="middle">保存到面板并更新</text><rect x="609" y="585" width="219" height="44" rx="10" fill="none" stroke="#d27336"/><circle cx="824" cy="589" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="824" y="594" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="421" y="642" font-size="16" fill="#b7e46e" font-weight="400" text-anchor="start">Panel rules loaded; edit and save</text><text x="421" y="658" font-size="10.5" fill="#b7e46e" font-weight="400" text-anchor="start">已读取面板规则，可编辑后保存</text><text x="242" y="699" font-size="16" fill="#c8d7dd" font-weight="400" text-anchor="start">Example domains; replace them for your own use</text><text x="242" y="715" font-size="10.5" fill="#c8d7dd" font-weight="400" text-anchor="start">示例域名不对应真实服务；请按实际需求填写</text><text x="242" y="731" font-size="16" fill="#c8d7dd" font-weight="400" text-anchor="start">After saving, check the log and matched rules in the dashboard</text><text x="242" y="747" font-size="10.5" fill="#c8d7dd" font-weight="400" text-anchor="start">保存成功后，检查日志并在控制面板核对规则命中</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Read panel rules first</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Reading replaces unsaved edits.</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Keep anything you need before</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">reloading.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enter one rule per line</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Use DIRECT, REJECT or a group</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">already present in the</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">configuration.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Save and check the result</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Saving affects other clients</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">using these account rules. Verify</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> a new connection.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Software Center → oixClash → Custom rules</text></g></svg>
