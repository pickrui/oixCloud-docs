on</text><text x="60" y="703" font-size="10.5" fill="#f2f6f8" font-weight="400" text-anchor="start">系统管理</text><text x="243" y="210" font-size="17" fill="#dbe7eb" font-weight="400" text-anchor="start">Signed in: reader@example.com · Example plan</text><text x="243" y="226" font-size="10.5" fill="#dbe7eb" font-weight="400" text-anchor="start">已登录：reader@example.com  ·  示例套餐</text><rect x="239" y="239" width="811" height="33" rx="0" fill="#73838a" stroke="none"/><text x="252" y="253" font-size="15" fill="#fff" font-weight="600" text-anchor="start">Run</text><text x="252" y="269" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start">运行</text><rect x="239" y="272" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="272" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="298" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Enable</text><text x="252" y="314" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">开启</text><rect x="421" y="284" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="456" cy="298.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="502" y="298" font-size="17" fill="#e2ecf0" font-weight="400" text-anchor="start">Plugin version: 0.0.14</text><text x="502" y="314" font-size="10.5" fill="#e2ecf0" font-weight="400" text-anchor="start">插件版本：0.0.14</text><text x="733" y="298" font-size="16" fill="#41b6d5" font-weight="400" text-anchor="start">Check updates</text><text x="733" y="314" font-size="10.5" fill="#41b6d5" font-weight="400" text-anchor="start">检查更新</text><rect x="923" y="280" width="112" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="979" y="298" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">View log</text><text x="979" y="314" font-size="10.5" fill="#fff" font-weight="400" text-anchor="middle">查看日志</text><circle cx="474" cy="282" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="474" y="287" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="239" y="325" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="325" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="351" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Status</text><text x="252" y="367" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">运行状态</text><text x="421" y="351" font-size="17" fill="#b7e46e" font-weight="400" text-anchor="start">Running · Core alpha-oix-example · UDP forwarded</text><text x="421" y="367" font-size="10.5" fill="#b7e46e" font-weight="400" text-anchor="start">运行中  ·  内核 alpha-oix-示例  ·  UDP 已转发</text><rect x="239" y="378" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="378" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="404" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Node selection</text><text x="252" y="420" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">节点切换</text><rect x="421" y="386" width="150" height="36" rx="7" fill="#17272e" stroke="#637980"/><text x="496" y="404" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Open dashboard</text><text x="496" y="420" font-size="10.5" fill="#fff" font-weight="400" text-anchor="middle">打开控制面板</text><rect x="239" y="431" width="811" height="83" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="431" width="164" height="83" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="457" font-size="15.653153153153156" fill="#f4f6f8" font-weight="400" text-anchor="start">Common ports only</text><text x="252" y="473" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">仅代理常用端口</text><rect x="421" y="449" width="17" height="17" rx="2" fill="#2ba5d0" stroke="none"/><path d="M424 458l4 4 7-10" fill="none" stroke="#fff" stroke-width="2"/><text x="450" y="458" font-size="17" fill="#fff" font-weight="400" text-anchor="start">Capture common ports only; other ports go direct</text><text x="450" y="474" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start">仅接管常用端口，其他端口直连</text><text x="421" y="490" font-size="16" fill="#dce6eb" font-weight="400" text-anchor="start">Turn off if a game or call needs uncommon ports</text><text x="421" y="506" font-size="10.5" fill="#dce6eb" font-weight="400" text-anchor="start">游戏或语音需非常用端口时，可按需关闭</text><circle cx="1017" cy="443" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1017" y="448" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="239" y="514" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="514" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="540" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">UDP forwarding</text><text x="252" y="556" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">UDP 转发</text><rect x="421" y="532" width="17" height="17" rx="2" fill="#2ba5d0" stroke="none"/><path d="M424 541l4 4 7-10" fill="none" stroke="#fff" stroke-width="2"/><text x="450" y="541" font-size="16" fill="#fff" font-weight="400" text-anchor="start">Proxy UDP traffic within the configured port scope</text><text x="450" y="557" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start">将符合端口设置的 UDP 流量交给代理</text><rect x="239" y="567" width="811" height="53" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="567" width="164" height="53" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="593" font-size="17" fill="#f4f6f8" font-weight="400" text-anchor="start">Block QUIC</text><text x="252" y="609" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">屏蔽 QUIC</text><rect x="421" y="585" width="17" height="17" rx="2" fill="#fff" stroke="none"/><text x="450" y="594" font-size="17" fill="#fff" font-weight="400" text-anchor="start">Recommended when UDP forwarding is off</text><text x="450" y="610" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start">未开启 UDP 转发时建议开启</text><rect x="239" y="620" width="811" height="90" rx="0" fill="#465960" stroke="#293b44"/><rect x="239" y="620" width="164" height="90" rx="0" fill="#2e3b41" stroke="#293b44"/><text x="252" y="646" font-size="13.858424725822536" fill="#f4f6f8" font-weight="400" text-anchor="start">Memory optimization</text><text x="252" y="662" font-size="10.5" fill="#f4f6f8" font-weight="400" text-anchor="start">内存优化</text><rect x="421" y="639" width="17" height="17" rx="2" fill="#2ba5d0" stroke="none"/><path d="M424 648l4 4 7-10" fill="none" stroke="#fff" stroke-width="2"/><text x="450" y="646" font-size="17" fill="#fff" font-weight="400" text-anchor="start">For low-memory devices</text><text x="450" y="662" font-size="10.5" fill="#fff" font-weight="400" text-anchor="start">适合小内存设备</text><text x="421" y="678" font-size="16" fill="#b7e46e" font-weight="400" text-anchor="start">256 MB RAM · Core runs on JFFS</text><text x="421" y="694" font-size="10.5" fill="#b7e46e" font-weight="400" text-anchor="start">本机内存 256MB  ·  内核在 JFFS 上运行</text><circle cx="1017" cy="631" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1017" y="636" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="242" y="731" font-size="16" fill="#c8d7dd" font-weight="400" text-anchor="start">Scroll for devices, DNS and rules; use Save and Apply at the bottom</text><text x="242" y="747" font-size="10.5" fill="#c8d7dd" font-weight="400" text-anchor="start">向下查看设备、DNS 与自定义规则；在页面底部「保存并应用」</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enable, then save and</text><text x="80" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">apply</text><text x="42" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Wait for Running status, then</text><text x="42" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">verify a LAN connection.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check common ports and UDP</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Uncommon ports go direct by</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">default. Adjust only as needed</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">and retest.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Find memory optimization</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">below</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Device policies, DNS and custom</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">rules follow. Save and apply at</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the bottom.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Software Center → oixClash → Run</text></g></svg>
