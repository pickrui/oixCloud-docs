<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Add a split DNS rule</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Add a split DNS rule</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ DNS</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">DNS Rule</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">Save</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="260" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="293" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Enabled</text><rect x="406" y="272" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="286.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="82" y="366" font-size="15" fill="#747780" font-weight="400" text-anchor="start">Match</text><rect x="79" y="383" width="382" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="142.66666666666666" y="408" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Exact</text><rect x="209.33333333333331" y="386" width="121.33333333333333" height="33" rx="6" fill="#fff" stroke="none"/><text x="270" y="408" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Suffix</text><text x="397.3333333333333" y="408" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Wildcard</text><circle cx="467" cy="379" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="467" y="384" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="68" y="438" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="471" font-size="20" fill="#202124" font-weight="400" text-anchor="start">corp.example.com</text><rect x="68" y="544" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="577" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Action</text><text x="444" y="577" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Split DNS</text><path d="M454 567l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 597H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="544" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="548" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="553" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="630" font-size="20" fill="#202124" font-weight="400" text-anchor="start">192.0.2.53</text><rect x="68" y="597" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="601" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="606" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="84" y="698" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">This rule applies only to matching</text><text x="84" y="722.8" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">domains. Other queries keep their</text><text x="84" y="747.6" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">existing DNS settings.</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Settings → DNS → Add DNS Rule</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Choose the match type</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">The example matches the suffix of an</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">internal domain.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Choose Split DNS</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Send only matching domain queries to the</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">selected resolver.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check resolver reachability</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">192.0.2.53 is a documentation address.</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Replace it with your reachable DNS server.</text></g></svg>
