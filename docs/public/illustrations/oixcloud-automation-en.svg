<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Choose script triggers</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose script triggers</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">Cancel</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Example Task</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">Save</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="267" width="404" height="212" rx="14" fill="#fff" stroke="none"/><text x="84" y="300" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Example Task</text><path d="M84 320H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="267" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="271" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="276" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="353" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Client</text><text x="444" y="353" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Surge</text><path d="M454 343l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 373H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="406" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Argument</text><text x="456" y="406" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Optional</text><path d="M84 426H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="459" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Timeout</text><text x="456" y="459" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">10 s</text><text x="82" y="522" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Triggers</text><rect x="68" y="534" width="404" height="265" rx="14" fill="#fff" stroke="none"/><text x="84" y="567" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Manual</text><rect x="406" y="546" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="560.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 587H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="534" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="538" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="543" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="620" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Interval</text><rect x="406" y="599" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="613.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 640H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="673" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Cron</text><rect x="406" y="652" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="666.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 693H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="726" font-size="20" fill="#202124" font-weight="400" text-anchor="start">oixCloud Started</text><rect x="406" y="705" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="719.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 746H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="779" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Network Changed</text><rect x="406" y="758" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="772.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="83" y="858" font-size="15" fill="#727279" font-weight="400" text-anchor="start">JavaScript</text><rect x="68" y="872" width="404" height="32" rx="12" fill="#fff" stroke="none"/><text x="84" y="895" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">// Example script…</text><circle cx="468" cy="872" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="877" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Settings → Automation → Add Script</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check the source and client API</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Select the API expected by the script. Its</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start"> name becomes the page title.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Choose the triggers you need</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Test manually first, then enable schedules</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start"> or network events.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Enter code before running</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">JavaScript and Run Now are below the</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">triggers. Scroll down to continue.</text></g></svg>
