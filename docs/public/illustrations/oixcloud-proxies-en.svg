<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Select a node or Best Available</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Select a node or Best Available</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Nodes</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">Done</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="243" width="403" height="41" rx="11" fill="#e5e5ea" stroke="none"/><text x="84" y="269" font-size="18" fill="#94949c" font-weight="400" text-anchor="start">⌕  Search</text><circle cx="466" cy="245" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="466" y="250" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="68" y="310" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="343" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">ϟ  Best Available</text><path d="M84 363H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="310" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="314" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="319" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="396" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Work</text><text x="82" y="458" font-size="15" fill="#727279" font-weight="400" text-anchor="start">oixCloud</text><rect x="68" y="470" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="503" font-size="20" fill="#202124" font-weight="400" text-anchor="start">HK · Example A</text><text x="456" y="503" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">28 ms</text><path d="M84 523H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="470" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="474" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="479" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="84" y="556" font-size="20" fill="#202124" font-weight="400" text-anchor="start">JP · Example B</text><text x="456" y="556" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">42 ms</text><path d="M84 576H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="609" font-size="20" fill="#202124" font-weight="400" text-anchor="start">SG · Example C</text><text x="456" y="609" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">56 ms</text><path d="M311 494l5 5 11-13" fill="none" stroke="#007aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="68" y="679" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="712" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">＋ Add</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Home → Current node card → Nodes</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Search by node name</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Search the list for the node you need.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Select an automatic entry or group</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">These entries select an outbound; they do</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">not open another editor.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Select a node and choose Done</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Verify a new connection. The latency</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">values are examples only.</text></g></svg>
