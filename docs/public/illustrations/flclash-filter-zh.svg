"700" text-anchor="middle">2</text><rect x="680" y="344" width="347" height="41" rx="10" fill="#f0e7ec" stroke="none"/><text x="696" y="371" font-size="17" fill="#a08c95" font-weight="400" text-anchor="start">⌕ 搜索节点</text><text x="684" y="437" font-size="20" fill="#202124" font-weight="400" text-anchor="start">香港 · 示例 A</text><path d="M988 430l5 5 11-13" fill="none" stroke="#8a5260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="684" y="499" font-size="20" fill="#202124" font-weight="400" text-anchor="start">日本 · 示例 B</text><path d="M988 492l5 5 11-13" fill="none" stroke="#8a5260" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="177" y="745" font-size="17" fill="#8a5260" font-weight="400" text-anchor="start">恢复默认</text><rect x="916" y="718" width="134" height="43" rx="23" fill="#8a5260" stroke="none"/><text x="983" y="746" font-size="17" fill="#fff" font-weight="500" text-anchor="middle">保存</text><rect x="912" y="714" width="142" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="1050" cy="718" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1050" y="723" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">设置线路与地区</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">每个标签可切换不筛选、仅保留和排除</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对保留节点</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">右侧预览按当前条件更新，搜索仅查找