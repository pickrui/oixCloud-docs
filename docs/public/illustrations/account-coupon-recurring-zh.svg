<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 核对循环代码与自动续费设置</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">核对循环代码与自动续费设置</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">套餐管理</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="451" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="344" font-size="24" fill="#405675" font-weight="600" text-anchor="start">示例套餐 A</text><text x="1030" y="344" font-size="18" fill="#3b846c" font-weight="600" text-anchor="end">使用中</text><text x="267" y="403" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">折扣代码</text><text x="1030" y="403" font-size="20" fill="#405675" font-weight="600" text-anchor="end">EXAMPLE-CODE</text><rect x="255" y="369" width="787" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="373" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="378" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="465" font-size="20" fill="#596b85" font-weight="600" text-anchor="start">续费价格</text><text x="1030" y="465" font-size="24" fill="#405675" font-weight="600" text-anchor="end">CNY 80.00</text><rect x="255" y="430" width="787" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="434" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="439" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><path d="M267 500H1030" stroke="#dedee3" stroke-width="1"/><text x="267" y="551" font-size="20" fill="#405675" font-weight="600" text-anchor="start">自动续费</text><rect x="977" y="527" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="1012" cy="541.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="255" y="514" width="787" height="54" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="518" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="523" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="267" y="621" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">剩余时间</text><text x="1030" y="621" font-size="23" fill="#405675" font-weight="600" text-anchor="end">20 天</text><text x="267" y="691" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">剩余流量</text><text x="1030" y="691" font-size="23" fill="#405675" font-weight="600" text-anchor="end">50 GiB</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对对应购买记录</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">优惠随记录沿用，不是无限次重新用码</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对续费价格</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">首购价可能更低，续费仍受最低价格限制</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">自动续费需另行开启</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">图中已开启；有代码不等于开关已打开</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 套餐管理 → 折扣代码与自动续费</text></g></svg>
