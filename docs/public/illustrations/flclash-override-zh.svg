th="878" height="94" rx="17" fill="#f4e7ed" stroke="none"/><text x="182" y="400" font-size="21" fill="#654554" font-weight="400" text-anchor="start">保留订阅规则和策略组，再叠加个人设置</text><text x="182" y="430" font-size="17" fill="#876675" font-weight="400" text-anchor="start">个人规则优先于订阅规则，已有的附加规则保持优先</text><circle cx="1040" cy="365" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1040" y="370" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="170" y="516" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">编辑自定义</text><rect x="930" y="496" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="520" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">编辑</text><path d="M154 546H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="586" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">附加规则</text><rect x="930" y="566" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="590" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">添加</text><path d="M154 616H1052" stroke="#ede5e8" stroke-width="1"/><rect x="873" y="693" width="165" height="43" rx="23" fill="#8a5260" stroke="none"/><text x="955.5" y="721" font-size="17" fill="#fff" font-weight="500" text-anchor="middle">检查配置</text><rect x="869" y="689" width="173" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="693" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="698" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按需求选择模式</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">标准、脚本、自定义、叠加保留内容的方式</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">不同</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">叠加保留订阅规则</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">在订阅基础上添加个人分流与策略组</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">检查并保存</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">编辑完成检查配置，规则模式下验证实际请</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">求</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：配置菜单 → 覆写</text></g></svg>
