idth="286.6666666666667" height="33" rx="17" fill="#f0d9df" stroke="none"/><text x="601" y="317" font-size="16" fill="#593c44" font-weight="600" text-anchor="middle">叠加</text><text x="893.6666666666667" y="317" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">自定义</text><circle cx="1046" cy="294" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1046" y="299" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="162" y="362" width="878" height="94" rx="17" fill="#f4e7ed" stroke="none"/><text x="182" y="400" font-size="21" fill="#654554" font-weight="400" text-anchor="start">保留订阅规则和策略组，再叠加个人设置</text><text x="182" y="430" font-size="17" fill="#876675" font-weight="400" text-anchor="start">个人规则优先于订阅规则，已有附加规则保持优先</text><text x="166" y="502" font-size="16" fill="#885461" font-weight="600" text-anchor="start">链式代理</text><text x="170" y="565" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">代理组</text><path d="M154 595H1052" stroke="#ede5e8" stroke-width="1"/><text x="170" y="639" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">规则</text><path d="M154 669H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="608" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="612" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="617" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按需求选择模式</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">保留订阅并加例外时选择叠加</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">打开规则或代理组</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">叠加设置在当前覆写页，可给这份配置添加</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">规则和组</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">检查并应用</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">顶部检查配置与待应用时的立即应用，负责</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">验证和应用</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：配置菜单 → 覆写</text></g></svg>
