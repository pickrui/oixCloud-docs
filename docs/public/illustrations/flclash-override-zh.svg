<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · 选择配置覆写模式</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · 桌面端</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">选择配置覆写模式</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">仪表盘</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">代理</text><rect x="40" y="335" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="359" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">配置</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">请求</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS 查询</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">连接</text><text x="76" y="719" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">工具</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">覆写</text><rect x="771" y="176" width="139" height="43" rx="23" fill="#8a5260" stroke="none"/><text x="840.5" y="204" font-size="17" fill="#fff" font-weight="500" text-anchor="middle">立即应用</text><rect x="767" y="172" width="147" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="910" cy="176" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="910" y="181" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="950" y="205" font-size="16" fill="#8a5260" font-weight="400" text-anchor="start">预览</text><text x="1033" y="205" font-size="24" fill="#8a5260" font-weight="400" text-anchor="start">✓</text><text x="166" y="268" font-size="16" fill="#885461" font-weight="600" text-anchor="start">覆写模式</text><rect x="162" y="292" width="878" height="39" rx="20" fill="#f7edef" stroke="#a8959a"/><text x="271.75" y="317" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">标准</text><rect x="384.5" y="295" width="213.5" height="33" rx="17" fill="#f0d9df" stroke="none"/><text x="491.25" y="317" font-size="16" fill="#593c44" font-weight="600" text-anchor="middle">叠加</text><text x="710.75" y="317" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">自定义</text><text x="930.25" y="317" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">脚本</text><circle cx="1046" cy="294" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1046" y="299" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="162" y="362" width="878" height="94" rx="17" fill="#f4e7ed" stroke="none"/><text x="182" y="400" font-size="21" fill="#654554" font-weight="400" text-anchor="start">保留订阅规则和策略组，再叠加个人设置</text><text x="182" y="430" font-size="17" fill="#876675" font-weight="400" text-anchor="start">个人规则优先于订阅规则，已有附加规则保持优先</text><text x="182" y="499" font-size="19" fill="#8a5260" font-weight="400" text-anchor="start">编辑自定义</text><circle cx="1037" cy="474" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1037" y="479" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="166" y="579" font-size="16" fill="#885461" font-weight="600" text-anchor="start">链式代理</text><rect x="162" y="598" width="878" height="96" rx="17" fill="#f8eff3" stroke="none"/><text x="183" y="638" font-size="21" fill="#202124" font-weight="400" text-anchor="start">工作代理链</text><text x="183" y="670" font-size="17" fill="#8d7180" font-weight="400" text-anchor="start">香港 · 示例 A  →  日本 · 示例 B</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">按需求选择模式</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">顺序为标准、叠加、自定义、脚本；示例选</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">择叠加</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">编辑自定义</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">在订阅基础上维护个人分流与策略组</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">检查并应用</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">顶部检查配置与待应用时的立即应用，负责</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">验证和应用</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：配置菜单 → 覆写</text></g></svg>
