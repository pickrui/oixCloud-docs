<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Choose what iCloud syncs</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose what iCloud syncs</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ Settings</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">iCloud Sync</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="267" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="300" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Last Synced</text><text x="456" y="300" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Just Now</text><path d="M84 320H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="353" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Sync Now</text><rect x="68" y="320" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="324" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="329" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="68" y="416" width="404" height="401" rx="14" fill="#fff" stroke="none"/><text x="84" y="443" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Proxies</text><text x="84" y="467" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">Nodes, subscriptions, chains, groups and folders</text><rect x="406" y="428" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="442.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 484H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="416" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="420" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="425" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="517" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Rules</text><rect x="406" y="496" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="510.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 537H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="570" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Modules</text><rect x="406" y="549" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="563.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 590H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="617" font-size="20" fill="#202124" font-weight="400" text-anchor="start">MITM</text><text x="84" y="641" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">Rule sets; each device keeps its own certificate</text><rect x="406" y="602" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="616.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 658H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="691" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Automation</text><rect x="406" y="670" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="684.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 711H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="744" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Settings</text><rect x="406" y="723" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="737.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 764H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="797" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Account</text><rect x="406" y="776" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="790.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="68" y="864" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="897" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Sync to Apple TV</text><rect x="406" y="876" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="890.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="68" y="864" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="868" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="873" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Settings → iCloud Sync</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check sync status</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Enable sync on the main Settings page</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">first. Use Sync Now here.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Select categories</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">MITM syncs rule sets. This switch does not</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start"> sync device certificates.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Enable TV sync separately</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Use the same Apple Account on both devices</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start"> and enable sync on TV too.</text></g></svg>
