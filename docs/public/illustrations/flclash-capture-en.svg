<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Choose desktop traffic capture</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Desktop</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose desktop traffic capture</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Dashboard</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Proxies</text><text x="76" y="359" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Profiles</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><rect x="40" y="695" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="719" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">Network</text><text x="166" y="261" font-size="16" fill="#885461" font-weight="600" text-anchor="start">System</text><text x="170" y="306" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">System proxy</text><rect x="985" y="290" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="1020" cy="304.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 336H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="275" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="279" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="284" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="170" y="370" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Bypass domains</text><rect x="930" y="350" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="374" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">Edit</text><path d="M154 400H1052" stroke="#ede5e8" stroke-width="1"/><text x="171" y="433" font-size="15" fill="#8e727f" font-weight="400" text-anchor="start">Bypass domains apply only while the system proxy is on</text><text x="166" y="493" font-size="16" fill="#885461" font-weight="600" text-anchor="start">Options</text><text x="170" y="539" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">TUN</text><rect x="985" y="523" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="1000" cy="537.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 569H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="508" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="170" y="603" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Auto-set system DNS</text><rect x="985" y="587" width="50" height="29" rx="16" fill="#8a5260" stroke="none"/><circle cx="1020" cy="601.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M154 633H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="572" width="906" height="61" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="576" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="581" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="170" y="667" font-size="20" fill="#332b2e" font-weight="400" text-anchor="start">Stack mode</text><rect x="930" y="647" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="671" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">mixed</text><path d="M154 697H1052" stroke="#ede5e8" stroke-width="1"/><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the System section</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">System proxy and Bypass domains</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">affect apps that follow system</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">proxy settings.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Find TUN under Options</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">After enabling it, verify</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">authorization, routes and actual</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">traffic.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check macOS system DNS</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">This option is macOS-only.</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Windows has a different set of</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">options.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: macOS → Tools → Advanced configuration → Network</text></g></svg>
