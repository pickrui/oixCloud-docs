<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Identify the leaked subscription URL</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Identify the leaked subscription URL</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Subscription Management</text><g transform="translate(-100 0)"><rect x="245" y="302" width="808" height="403" rx="12" fill="#fff" stroke="#d5deea"/><text x="274" y="350" font-size="23" fill="#405675" font-weight="600" text-anchor="start">Personal Subscriptions</text><rect x="266" y="382" width="762" height="117" rx="8" fill="#eff6ff" stroke="none"/><text x="286" y="425" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Main Subscription</text><text x="286" y="470" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">Subscription Token</text><text x="425" y="470" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">••••••••</text><text x="758" y="454" font-size="17" fill="#596b85" font-weight="400" text-anchor="start">Edit</text><text x="920" y="454" font-size="18" fill="#476394" font-weight="600" text-anchor="middle">Reset</text><rect x="851" y="414" width="132" height="60" rx="10" fill="none" stroke="#d27336"/><circle cx="979" cy="418" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="979" y="423" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="266" y="527" width="762" height="117" rx="8" fill="#f7f9fc" stroke="none"/><text x="286" y="570" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Phone</text><text x="286" y="615" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">Subscription Token</text><text x="425" y="615" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">••••••••</text><text x="758" y="599" font-size="17" fill="#596b85" font-weight="400" text-anchor="start">Edit</text><text x="920" y="599" font-size="18" fill="#aa4948" font-weight="600" text-anchor="middle">Delete</text><rect x="851" y="559" width="132" height="60" rx="10" fill="none" stroke="#d27336"/><circle cx="979" cy="563" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="979" y="568" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="274" y="532" width="264" height="59" rx="10" fill="none" stroke="#d27336"/><circle cx="534" cy="536" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="534" y="541" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Find the affected URL</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Identify the exact URL. The</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">example personal subscription is</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">named Phone.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Delete a personal URL</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Create a replacement if needed</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">and update the devices that used</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">it.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Reset the main URL</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Reset rotates the main URL and</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">node credentials. Personal URLs</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">stay valid.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Subscription Management → Personal subscriptions</text></g></svg>
