<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 使用充值码并核对到账记录</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">使用充值码并核对到账记录</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">充值</text><g transform="translate(-100 0)"><rect x="245" y="304" width="390" height="191" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="344" font-size="22" fill="#405675" font-weight="600" text-anchor="start">在线支付</text><rect x="267" y="390" width="344" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="439" y="416" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">前往收银台</text><rect x="263" y="386" width="352" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="611" cy="390" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="611" y="395" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="655" y="304" width="398" height="191" rx="12" fill="#fff" stroke="#d5deea"/><text x="677" y="344" font-size="22" fill="#405675" font-weight="600" text-anchor="start">充值码</text><rect x="677" y="365" width="354" height="43" rx="7" fill="#fff" stroke="#d5deea"/><text x="690" y="393" font-size="19" fill="#7a8ca4" font-weight="400" text-anchor="start">EXAMPLE-CODE</text><rect x="677" y="429" width="354" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="854" y="455" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">使用充值码</text><rect x="673" y="425" width="362" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1031" cy="429" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1031" y="434" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="245" y="521" width="808" height="220" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="558" font-size="22" fill="#405675" font-weight="600" text-anchor="start">充值记录</text><rect x="245" y="580" width="808" height="44" rx="0" fill="#edf2fa" stroke="none"/><text x="267" y="609" font-size="17" fill="#5c6e89" font-weight="600" text-anchor="start">充值金额</text><text x="675" y="609" font-size="17" fill="#5c6e89" font-weight="600" text-anchor="start">时间</text><text x="267" y="668" font-size="21" fill="#38836e" font-weight="600" text-anchor="start">CNY 100.00</text><text x="675" y="668" font-size="19" fill="#445a77" font-weight="400" text-anchor="start">2026-11-05 10:00</text><rect x="255" y="634" width="779" height="57" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="638" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="643" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">在线付款从收银台进入</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">付款后返回此页，核对实际入账金额与时间</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">已有充值码再填写</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">示例代码不可使用，不填写 Access</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Token 或订阅地址</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对记录后检查套餐</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">入账不等于套餐生效，也需核对购买或自动</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">扣款结果</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 充值</text></g></svg>
