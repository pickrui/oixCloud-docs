<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 创建策略组</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">创建策略组</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ 取消</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">工作</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">保存</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><circle cx="476" cy="241" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="476" y="246" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="266" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="299" font-size="20" fill="#202124" font-weight="400" text-anchor="start">名称</text><text x="456" y="299" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">工作</text><path d="M84 319H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="352" font-size="20" fill="#202124" font-weight="400" text-anchor="start">类型</text><text x="444" y="352" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">自动测速</text><path d="M454 342l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><rect x="68" y="319" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="323" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="328" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="82" y="413" font-size="15" fill="#727279" font-weight="400" text-anchor="start">成员</text><rect x="68" y="425" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="458" font-size="20" fill="#202124" font-weight="400" text-anchor="start">香港 · 示例 A</text><path d="M84 478H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="511" font-size="20" fill="#202124" font-weight="400" text-anchor="start">日本 · 示例 B</text><path d="M84 531H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="564" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">＋ 添加成员</text><rect x="68" y="531" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="535" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="540" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="82" y="638" font-size="15" fill="#727279" font-weight="400" text-anchor="start">健康检查</text><rect x="68" y="650" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="683" font-size="20" fill="#202124" font-weight="400" text-anchor="start">间隔</text><text x="456" y="683" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">300 秒</text><path d="M84 703H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="736" font-size="20" fill="#202124" font-weight="400" text-anchor="start">容差</text><text x="456" y="736" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">50 ms</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">代理 → 策略 → 添加策略组</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">填写名称与类型</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">先明确手动选择、自动测速、故障转移或智能的用途</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">加入可用成员</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">成员可以来自已有节点；示例使用两个节点</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">保存并选用</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">保存后在首页或路由规则中选择这个组才会使用</text></g></svg>
