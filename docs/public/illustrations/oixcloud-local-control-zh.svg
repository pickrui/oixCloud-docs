<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 开启局域网控制并找到地址</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">开启局域网控制并找到地址</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ 设置</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">局域网控制</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">应用</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="275" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="308" font-size="20" fill="#202124" font-weight="400" text-anchor="start">允许局域网访问</text><rect x="406" y="287" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="301.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M84 328H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="275" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="279" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="284" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="361" font-size="20" fill="#202124" font-weight="400" text-anchor="start">端口</text><text x="456" y="361" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">9091</text><path d="M84 381H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="414" font-size="20" fill="#202124" font-weight="400" text-anchor="start">状态</text><text x="456" y="414" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">可用</text><text x="82" y="476" font-size="15" fill="#727279" font-weight="400" text-anchor="start">局域网地址</text><rect x="68" y="488" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="521" font-size="20" fill="#202124" font-weight="400" text-anchor="start">https://192.0.2.10:9091</text><rect x="68" y="488" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="492" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="497" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="82" y="600" font-size="15" fill="#727279" font-weight="400" text-anchor="start">安全访问</text><rect x="68" y="612" width="404" height="174" rx="14" fill="#fff" stroke="none"/><text x="84" y="645" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">复制访问密钥</text><path d="M84 665H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="612" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="616" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="621" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="84" y="698" font-size="20" fill="#d23d3d" font-weight="400" text-anchor="start">重置访问密钥</text><path d="M84 718H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="745" font-size="20" fill="#202124" font-weight="400" text-anchor="start">证书指纹</text><text x="84" y="769" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">SHA-256 · 示例指纹，不用于连接</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">设置 → 局域网控制</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">开启局域网访问</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">保持 oixCloud 已连接，另一设备须在同一网络</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">打开列出的 HTTPS 地址</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">使用当前设备地址；图中仅为示例</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">核对指纹后使用密钥</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">复制本设备的访问密钥；完成后关闭访问</text></g></svg>
