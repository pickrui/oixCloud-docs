<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 购买时验证折扣并核对续费报价</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">购买时验证折扣并核对续费报价</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">购买套餐</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="450" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="340" font-size="24" fill="#405675" font-weight="600" text-anchor="start">确认购买</text><text x="267" y="382" font-size="20" fill="#405675" font-weight="600" text-anchor="start">示例套餐 A · 季付</text><text x="267" y="430" font-size="17" fill="#596b85" font-weight="400" text-anchor="start">折扣代码</text><rect x="267" y="445" width="560" height="43" rx="7" fill="#fff" stroke="#d5deea"/><text x="282" y="474" font-size="18" fill="#445a77" font-weight="400" text-anchor="start">EXAMPLE-CODE</text><rect x="850" y="446" width="180" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="940" y="472" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">验证</text><rect x="846" y="442" width="188" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="446" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="451" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="531" font-size="19" fill="#3b846c" font-weight="600" text-anchor="start">✓ 循环折扣代码</text><text x="267" y="566" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">20%（节省 ¥20.00）</text><text x="267" y="601" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">当前续费 ¥80.00（最低为当期套餐售价的 70%）</text><rect x="255" y="501" width="787" height="117" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="505" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="510" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="267" y="660" font-size="20" fill="#596b85" font-weight="600" text-anchor="start">实付金额</text><text x="1030" y="660" font-size="24" fill="#405675" font-weight="600" text-anchor="end">CNY 80.00</text><rect x="750" y="697" width="280" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="890" y="723" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">确认购买</text><rect x="746" y="693" width="288" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="697" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="702" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">完整输入一个代码</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">保留大小写，换套餐或周期后重新验证</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对类型与续费报价</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">一次性与循环不同；20% 优惠是支付 80%</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对实付后再购买</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">验证不等于购买，也不会自动开启续费</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 购买套餐 → 确认购买 → 验证</text></g></svg>
