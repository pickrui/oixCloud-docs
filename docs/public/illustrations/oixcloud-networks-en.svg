<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Apply settings for one network</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Apply settings for one network</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="14.021241830065359" fill="#007aff" font-weight="400" text-anchor="start">‹ Network Profiles</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Home Wi-Fi</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">Save</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><text x="82" y="258" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Network</text><rect x="68" y="270" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="303" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Network</text><text x="456" y="303" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Home Wi-Fi</text><rect x="68" y="270" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="274" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="279" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="68" y="377" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="410" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Mode</text><text x="444" y="410" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Rule</text><path d="M454 400l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 430H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="377" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="381" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="386" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="463" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Final Route</text><text x="444" y="463" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Inherit</text><path d="M454 453l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><text x="83" y="536" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Routing Rules</text><rect x="78" y="552" width="384" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="81" y="555" width="186" height="33" rx="6" fill="#fff" stroke="none"/><text x="174" y="577" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Inherit</text><text x="366" y="577" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Custom</text><circle cx="468" cy="552" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="557" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="82" y="648" font-size="15" fill="#727279" font-weight="400" text-anchor="start">DNS</text><rect x="68" y="660" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="693" font-size="20" fill="#a5a5ad" font-weight="400" text-anchor="start">Inherit</text><rect x="68" y="770" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="803" font-size="20" fill="#202124" font-weight="400" text-anchor="start">IPv6</text><text x="444" y="803" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Inherit</text><path d="M454 793l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 823H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="856" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Auto Connect</text><rect x="406" y="835" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="849.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Settings → Network Profiles → Network name</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check the network name</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Match the exact Wi-Fi SSID. Configure</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">cellular networks separately.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Separate Mode and Final Route</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Direct mode differs from sending only</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">unmatched traffic direct.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Save and verify</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Empty DNS inherits global settings. Rules</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">and IPv6 can inherit independently.</text></g></svg>
