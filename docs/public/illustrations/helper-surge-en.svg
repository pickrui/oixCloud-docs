<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud Helper · Apply Helper’s profile in Surge</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud Helper · macOS</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Apply Helper’s profile in Surge</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#dfe7f3" stroke="none"/><rect x="30" y="130" width="1060" height="34" rx="14" fill="#f5f6f9" stroke="none"/><text x="53" y="153" font-size="15" fill="#384052" font-weight="400" text-anchor="start">●   Finder   File   Edit   View   Go   Window</text><text x="1049" y="153" font-size="15" fill="#384052" font-weight="500" text-anchor="end">☁    09:41</text><rect x="85" y="187" width="242" height="203" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="103" y="221" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">oixCloud</text><text x="103" y="258" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Account</text><path d="M303 247l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><circle cx="319" cy="234" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="319" y="239" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="103" y="295" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Nodes</text><p