<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 在服务单说明付款与套餐状态</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在服务单说明付款与套餐状态</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">新建服务单</text><g transform="translate(-100 0)"><text x="246" y="317" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">问题类型</text><rect x="246" y="329" width="372" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="259" y="358" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">购买／支付问题</text><rect x="242" y="325" width="380" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="618" cy="329" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="618" y="334" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="646" y="317" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">标题</text><rect x="646" y="329" width="406" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="659" y="358" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">未见套餐</text><text x="247" y="463" font-size="17" fill="#596b85" font-weight="600" text-anchor="start">问题描述</text><rect x="246" y="482" width="806" height="144" rx="7" fill="#fff" stroke="#d5deea"/><text x="267" y="522" font-size="17" fill="#405675" font-weight="400" text-anchor="start">示例订单 EX-0001，09:10（UTC+8）付款</text><text x="267" y="560" font-size="17" fill="#405675" font-weight="400" text-anchor="start">充值记录显示已到账，套餐管理没有新记录</text><text x="267" y="598" font-size="17" fill="#405675" font-weight="400" text-anchor="start">收到付款后自动购买未完成的通知</text><rect x="242" y="478" width="814" height="152" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="482" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="487" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="248" y="678" width="19" height="19" rx="3" fill="#4c74d8" stroke="none"/><path d="M251 681l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="694" font-size="15" fill="#596b85" font-weight="400" text-anchor="start">我已按「用户指南」完成配置与排查</text><rect x="871" y="667" width="180" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="961" y="693" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">提交服务单</text><rect x="867" y="663" width="188" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1051" cy="667" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1051" y="672" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">选择购买／支付问题</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">若同一问题已有未关闭的服务单，直接在原</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">单补充</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">写清两份记录</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">写明订单号、付款时间，以及充值记录和套</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">餐管理分别显示什么</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对后再提交</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">截图先遮住凭据和个人信息，勾选确认后等</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">待倒计时</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 服务单 → 新建服务单</text></g></svg>
