<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 用同一条赠礼链接自用或送人</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">用同一条赠礼链接自用或送人</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">权益中心</text><g transform="translate(-100 0)"><rect x="245" y="302" width="808" height="427" rx="12" fill="#fff" stroke="#d5deea"/><text x="272" y="351" font-size="23" fill="#405675" font-weight="600" text-anchor="start">奖励链接</text><rect x="763" y="374" width="245" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="885.5" y="400" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">生成领取链接</text><path d="M270 444H1011" stroke="#dedee3" stroke-width="1"/><text x="272" y="498" font-size="22" fill="#405675" font-weight="600" text-anchor="start">我生成的链接</text><rect x="258" y="457" width="754" height="60" rx="10" fill="none" stroke="#d27336"/><circle cx="1008" cy="461" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1008" y="466" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="275" y="566" font-size="20" fill="#405675" font-weight="600" text-anchor="start">链接 1</text><text x="838" y="566" font-size="18" fill="#596b85" font-weight="400" text-anchor="start">等待领取</text><rect x="274" y="620" width="319" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="433.5" y="646" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">领取页面</text><rect x="270" y="616" width="327" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="593" cy="620" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="593" y="625" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="654" y="620" width="350" height="40" rx="7" fill="#fff" stroke="#708ab7"/><text x="829" y="646" font-size="16" fill="#476394" font-weight="600" text-anchor="middle">复制链接</text><rect x="650" y="616" width="358" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1004" cy="620" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1004" y="625" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先看已有链接</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">如有合适的未领取链接可以直接使用，无需</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">另占名额</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">自己领取</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">打开领取页面，核对账户和套餐后确认领取</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">送给朋友</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">复制链接发给领取人，每条只能领取一次</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 权益中心 → 奖励链接</text></g></svg>
