ill="#64748b" font-weight="400" text-anchor="start">智能回退</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">保存后更新客户端订阅</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">回退只在建连时选用传输，旧连接不会迁移</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 流量路由 → HTTP/3</text></g></svg>
