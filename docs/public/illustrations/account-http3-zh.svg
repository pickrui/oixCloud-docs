f" stroke="#d5deea"/><text x="314" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">内部中继</text><text x="448" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">外部中继</text><rect x="517" y="304" width="130" height="35" rx="6" fill="#e2edff" stroke="none"/><text x="582" y="327" font-size="15" fill="#326cc4" font-weight="600" text-anchor="middle">HTTP/3</text><text x="716" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">WARP</text><text x="850" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">IPv4 Only</text><text x="984" y="327" font-size="15" fill="#657b97" font-weight="400" text-anchor="middle">流媒体解锁</text><rect x="245" y="365" width="808" height="410" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="400" font-size="21" fill="#405675" font-weight="600" text-anchor="start">HTTP/3 设置</text><text x="1030" y="399" font-size="15" fill="#657b97" font-weight="400" text-anchor="end">节点 3</text><text x="267" y="435" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">智能回退</text><rect x="267" y="457" width="475" height="39" rx="6" fill="#f7f9fc" stroke="#d5deea"/><text x="283" y="483" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">⌕ 香港</text><rect x="763" y="457" width="267" height="39" rx="6" fill="#fff" stroke="#d5deea"/><text x="780" y="483" font-size="16" fill="#445a77" font-weight="400" text-anchor="start">全部状态 ▾</text><text x="267" y="514" font-size="14" fill="#657b97" font-weight="400" text-anchor="start">显示 3 / 3 个节点</text><rect x="267" y="533" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="294" y="547" font-size="15" fill="#445a77" font-weight="400" text-anchor="start">全选</text><text x="400" y="547" font-size="15" fill="#657b97" font-weight="400" text-anchor="start">已选 0 个节点</text><rect x="246" y="573" width="806" height="37" rx="0" fill="#edf2fa" stroke="none"/><text x="293" y="598" font-size="