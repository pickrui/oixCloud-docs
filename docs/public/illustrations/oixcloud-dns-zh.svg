<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 添加分流 DNS 规则</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">添加分流 DNS 规则</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ DNS</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">DNS 规则</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">保存</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="68" y="260" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="293" font-size="20" fill="#202124" font-weight="400" text-anchor="start">已启用</text><rect x="406" y="272" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="441" cy="286.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="82" y="366" font-size="15" fill="#747780" font-weight="400" text-anchor="start">匹配方式</text><rect x="79" y="383" width="382" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="142.66666666666666" y="408" font-size="16" fill="#222" font-weight="400" text-anchor="middle">精确</text><rect x="209.33333333333331" y="386" width="121.33333333333333" height="33" rx="6" fill="#fff" stroke="none"/><text x="270" y="408" font-size="16" fill="#222" font-weight="600" text-anchor="middle">后缀</text><text x="397.3333333333333" y="408" font-size="16" fill="#222" font-weight="400" text-anchor="middle">通配符</text><circle cx="467" cy="379" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="467" y="384" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="68" y="438" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="471" font-size="20" fill="#202124" font-weight="400" text-anchor="start">corp.example.com</text><rect x="68" y="544" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="577" font-size="20" fill="#202124" font-weight="400" text-anchor="start">操作</text><text x="444" y="577" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">分流 DNS</text><path d="M454 567l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 597H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="544" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="548" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="553" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="630" font-size="20" fill="#202124" font-weight="400" text-anchor="start">192.0.2.53</text><rect x="68" y="597" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="601" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="606" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="84" y="698" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">此规则只用于匹配的域名；其他请求继续按原有设</text><text x="84" y="722.8" font-size="16" fill="#85858d" font-weight="400" text-anchor="start">置解析</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">设置 → DNS → 新增 DNS 规则</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">选匹配方式</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">示例使用后缀，匹配一个内部域名</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">选分流 DNS</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">仅将匹配的域名交给指定服务器解析</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">确认服务器可达</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">图中 192.0.2.53 是文档示例地址，需换成你可达的</text><text x="552" y="765" font-size="20" fill="#64748b" font-weight="400" text-anchor="start"> DNS</text></g></svg>
