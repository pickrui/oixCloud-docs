<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Check the cost of each automatic reset</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Check the cost of each automatic reset</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Plan Management</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="445" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="344" font-size="24" fill="#405675" font-weight="600" text-anchor="start">Example plan A</text><text x="1030" y="344" font-size="18" fill="#3b967b" font-weight="600" text-anchor="end">Active</text><rect x="255" y="310" width="787" height="52" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="314" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="319" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="398" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">Time Left</text><text x="665" y="398" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">Data Left</text><text x="267" y="437" font-size="24" fill="#405675" font-weight="600" text-anchor="start">20 d</text><text x="665" y="437" font-size="24" fill="#c55a18" font-weight="600" text-anchor="start">0 GiB</text><path d="M267 465H1030" stroke="#dedee3" stroke-width="1"/><text x="267" y="504" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">Renewal Price</text><text x="1030" y="504" font-size="22" fill="#405675" font-weight="600" text-anchor="end">—</text><text x="267" y="566" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Auto-renewal</text><rect x="977" y="542" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="992" cy="556.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="267" y="637" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Automatic traffic reset</text><rect x="977" y="613" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="992" cy="627.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="267" y="673" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">¥60.00 each</text><rect x="255" y="604" width="787" height="88" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="608" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="613" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="255" y="370" width="221" height="84" rx="10" fill="none" stroke="#d27336"/><circle cx="472" cy="374" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="472" y="379" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the active record</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">A pending record’s reset setting</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">applies only after activation.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check each reset charge</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Shown off. With depleted data,</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">check the Turn on and pay</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">confirmation.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">The expiry stays the same</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">This is a paid reset, not a</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">renewal. Running out again can</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">trigger another charge.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Plan Management → Automatic traffic reset</text></g></svg>
