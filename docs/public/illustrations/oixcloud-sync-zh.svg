-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">核对同步类别</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">代理、规则、模块、证书及设置按需选择</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">Apple TV 单独开启</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">两台设备使用同一个 Apple 账户，电视端确认接收</text></g></svg>
