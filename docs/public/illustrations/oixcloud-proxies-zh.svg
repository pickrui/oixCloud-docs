x="156" y="527" width="400" height="87" rx="14" fill="#f3f6f4" stroke="none"/><text x="174" y="560" font-size="20" font-weight="650" fill="#162d39">新加坡 · 示例 C</text><text x="174" y="592" font-size="18" font-weight="400" fill="#526772">56 ms</text><rect x="156" y="647" width="400" height="62" rx="14" fill="#e8eeeb" stroke="none"/><text x="170" y="687" font-size="18" font-weight="600" fill="#13543e">新连接 → 所选节点</text><circle cx="556" cy="647" r="17" fill="#16765b"/><text x="550" y="654" font-size="21" font-weight="700" fill="#fff">3</text><circle cx="801" cy="205" r="17" fill="#16765b"/><text x="795" y="212" font-size="21" font-weight="700" fill="#fff">1</text><text x="834" y="213" font-size="23" font-weight="700" fill="#162d39">打开节点选择</text><text x="782" y="253" font-size="18" font-weight="400" fill="#526772">在首页点当前出口</text><text x="782" y="283" font-size="18" font-weight="400" fill="#526772">进入节点或策略组选择列表</text><circle cx="801" cy="372" r="17" fill="#16765b"/><text x="795" y="379" font-size="21" font-weight="700" fill="#fff">2</text><text x="834" y="380" font-size="23" font-weight="700" fill="#162d39">选中可用节点</text><text x="782" y="420" font-size="18" font-weight="400" fill="#526772">在出口列表选择一个节点</text><text x="782" y="450" font-size="18" font-weight="400" fill="#526772">延迟数字只表示示例测试结果</text><circle cx="801" cy="539" r="17" fill="#16765b"/><text x="795" y="546" font-size="21" font-weight="700" fill="#fff">3</text><text x="834" y="547" font-size="23" font-weight="700" fill="#162d39">重新发起连接</text><text x="782" y="587" font-size="18" font-weight="400" fill="#526772">已建立的连接可能继续使用旧出口</text><text x="782" y="617" font-size="18" font-weight="400" fill="#526772">重新访问网站，核对实际出口</text></g></svg>
