<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud Helper · 在 Surge 选择出站和接管方式</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud Helper · macOS</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在 Surge 选择出站和接管方式</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#dfe7f3" stroke="none"/><rect x="30" y="130" width="1060" height="34" rx="14" fill="#f5f6f9" stroke="none"/><text x="53" y="153" font-size="15" fill="#384052" font-weight="400" text-anchor="start">●   Finder   文件   编辑   显示   前往   窗口</text><text x="1049" y="153" font-size="15" fill="#384052" font-weight="500" text-anchor="end">☁    09:41</text><rect x="90" y="207" width="364" height="166" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="108" y="241" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">Surge</text><rect x="95" y="254" width="354" height="34" rx="6" fill="#2676df" stroke="none"/><text x="108" y="278" font-size="17" fill="#fff" font-weight="400" text-anchor="start">出站模式</text><path d="M430 267l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="446" cy="254" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="446" y="259" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="315" font-size="17" fill="#303946" font-weight="400" text-anchor="start">设置为系统代理</text><circle cx="446" cy="291" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="446" y="296" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="108" y="352" font-size="17" fill="#303946" font-weight="400" text-anchor="start">增强模式</text><circle cx="446" cy="328" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="446" y="333" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="467" y="252" width="447" height="129" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="485" y="286" font-size="17" fill="#303946" font-weight="400" text-anchor="start">✓  规则判定</text><text x="485" y="323" font-size="17" fill="#303946" font-weight="400" text-anchor="start">全局代理</text><text x="485" y="360" font-size="17" fill="#303946" font-weight="400" text-anchor="start">直接连接</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">选出站模式</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">规则判定按网站分流；切换后用新请求验证</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">设置为系统代理</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">供遵循 macOS 系统代理的应用使用</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">需要时开增强模式</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">完成系统授权，在 Surge 请求列表核对目</text><text x="772" y="894.35" font-size="17" fill="