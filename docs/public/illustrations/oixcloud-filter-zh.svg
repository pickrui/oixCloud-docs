<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 筛选线路、地区与名称</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">筛选线路、地区与名称</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ oixCloud</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">节点筛选</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">保存</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><circle cx="477" cy="241" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="477" y="246" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="82" y="266" font-size="15" fill="#697384" font-weight="400" text-anchor="start">○ 不筛选    ✓ 仅保留    ⊖ 排除</text><text x="81" y="312" font-size="15" fill="#767982" font-weight="400" text-anchor="start">线路</text><rect x="76" y="328" width="113" height="36" rx="18" fill="#dfebff" stroke="#8db7ff"/><text x="132" y="352" font-size="15" fill="#0068d8" font-weight="500" text-anchor="middle">Fusion</text><rect x="199" y="328" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="255" y="352" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">GIA</text><rect x="322" y="328" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="378" y="352" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">CIA</text><circle cx="468" cy="327" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="332" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="81" y="410" font-size="15" fill="#767982" font-weight="400" text-anchor="start">地区</text><rect x="76" y="426" width="113" height="36" rx="18" fill="#dfebff" stroke="#8db7ff"/><text x="132" y="450" font-size="15" fill="#0068d8" font-weight="500" text-anchor="middle">香港</text><rect x="199" y="426" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="255" y="450" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">日本</text><rect x="322" y="426" width="113" height="36" rx="18" fill="#f4f5f8" stroke="#dbdce2"/><text x="378" y="450" font-size="15" fill="#646771" font-weight="500" text-anchor="middle">新加坡</text><rect x="68" y="503" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="536" font-size="20" fill="#202124" font-weight="400" text-anchor="start">名称包含</text><text x="456" y="536" font-size="16" fill="#85858d" font-weight="400" text-anchor="end">香港|日本</text><path d="M84 556H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="589" font-size="20" fill="#202124" font-weight="400" text-anchor="start">名称排除</text><text x="456" y="589" font-size="16" fill="#85858d" font-weight="400" text-anchor="end">测试|维护</text><text x="83" y="655" font-size="18" fill="#202124" font-weight="600" text-anchor="start">节点预览</text><circle cx="467" cy="647" r="15" fill="#c55a18" stroke="#fff" stroke-widt