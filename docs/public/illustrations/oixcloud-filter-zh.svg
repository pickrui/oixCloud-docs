00" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">保存并刷新</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">至少保留一个节点；保存后刷新托管节点</text></g></svg>
