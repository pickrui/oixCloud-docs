<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Inspect a request’s routing decision</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Inspect a request’s routing decision</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ Requests</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Request</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><text x="82" y="258" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Connection</text><rect x="68" y="270" width="404" height="212" rx="14" fill="#fff" stroke="none"/><text x="84" y="303" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Host</text><text x="456" y="303" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">example.com</text><path d="M84 323H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="270" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="274" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="279" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="356" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Port</text><text x="456" y="356" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">443</text><path d="M84 376H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="409" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Protocol</text><text x="456" y="409" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">HTTPS</text><path d="M84 429H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="462" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Time</text><text x="456" y="462" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">09:41:00</text><text x="82" y="524" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Decision</text><rect x="68" y="536" width="404" height="227" rx="14" fill="#fff" stroke="none"/><text x="84" y="569" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Result</text><text x="456" y="569" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Proxy</text><path d="M84 589H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="536" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="540" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="545" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="622" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Routing</text><text x="456" y="622" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">HK · Example A</text><path d="M84 642H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="675" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Reason</text><text x="456" y="675" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Rule matched</text><path d="M84 695H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="722" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Matched Rule</text><text x="84" y="746" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">DOMAIN-SUFFIX,example.com</text><rect x="68" y="695" width="404" height="68" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="699" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="704" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Activity → Requests → A request</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Find the destination</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">example.com is a fictional request.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check the routing result</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Inspect the route used and the reason for</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">the decision.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check the matched rule</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">After changes, make a new connection and</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">verify the rule and outbound.</text></g></svg>
