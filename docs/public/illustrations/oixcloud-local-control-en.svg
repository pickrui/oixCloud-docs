fill="#fff" stroke="none" stroke-width="1"/><path d="M84 328H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="275" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="279" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="284" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="84" y="361" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Port</text><text x="456" y="361" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">9091</text><path d="M84 381H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="414" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Status</text><text x="456" y="414" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Ready</text><text x="82" y="476" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Local Network Address</text><rect x="68" y="488" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="521" font-size="20" fill="#202124" font-weight="400" text-anchor="start">https://192.0.2.10:9091</text><rect x="68" y="488" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="492" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="497" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="82" y="600" font-size="15" fill="#727279" font-weight="400" text-anchor="start">Secure Access</text><rect x="68" y="612" width="404" height="174" rx="14" fill="#fff" stroke="none"/><text x="84" y="645" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Copy Access Key</text><path d="M84 665H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="612" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="616" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="621" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="84" y="698" font-size="20" fill="#d23d3d" font-weight="400" text-anchor="start">Reset Access Key</text><path d="M84 718H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="745" font-size="20" fill="#202124" font-weight="400" text-anchor="start">Certificate Fingerprint</text><text x="84" y="769" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">SHA-256 · Example only, not for connecting</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Settings → Local Controller</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Enable local access</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Keep oixCloud connected. The other device</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">must be on the same LAN.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Open the listed HTTPS address</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Use the address on your device; the</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">illustrated address is an example.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Check fingerprint, then use the key</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Copy this device’s access key. Disable</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">access when finished.</text></g></svg>
