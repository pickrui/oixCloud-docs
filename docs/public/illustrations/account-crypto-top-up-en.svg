<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Check the crypto order before transferring</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Check the crypto order before transferring</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Cashier</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="451" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="338" font-size="18" fill="#405675" font-weight="600" text-anchor="start">Transfer → On-chain confirmation → Credited</text><text x="1030" y="375" font-size="17" fill="#657b97" font-weight="400" text-anchor="end">Time to pay 45:00</text><text x="267" y="402" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">Amount to receive</text><text x="267" y="445" font-size="32" fill="#405675" font-weight="650" text-anchor="start">12.345 USDT</text><text x="1030" y="445" font-size="23" fill="#405675" font-weight="600" text-anchor="end">BSC</text><text x="267" y="480" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">Top-up amount 80.00 RMB</text><rect x="255" y="378" width="787" height="118" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="382" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="387" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="267" y="531" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">Recipient address</text><rect x="267" y="545" width="763" height="42" rx="6" fill="#edf3fd" stroke="none"/><text x="282" y="573" font-size="18" fill="#405675" font-weight="600" text-anchor="start">EXAMPLE-ADDRESS — NOT FOR PAYMENT</text><rect x="255" y="536" width="787" height="59" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="540" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="545" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="267" y="626" font-size="17" fill="#657b97" font-weight="400" text-anchor="start">Send the exact amount, including every decimal place</text><text x="267" y="674" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Withdrawal fee calculator</text><rect x="255" y="644" width="787" height="50" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="648" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="653" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="267" y="727" font-size="18" fill="#657b97" font-weight="400" text-anchor="start">Order details</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check amount and network</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Keep every decimal place and use</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the asset and network on the</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">order.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Use this order’s address</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The QR contains only an address.</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">This example address is invalid.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check withdrawal fees</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The amount received must match</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the order. Wait for confirmation;</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> do not pay twice.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Cashier → Cryptocurrency order</text></g></svg>
