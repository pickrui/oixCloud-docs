<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Add your own node from a link</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Add your own node from a link</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="67" y="234" font-size="37" fill="#111" font-weight="700" text-anchor="start">Proxies</text><rect x="49" y="854" width="442" height="63" rx="27" fill="#fcfcfd" stroke="#e4e4e9"/><text x="93" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">⌂</text><text x="93" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Home</text><text x="180" y="880" font-size="23" fill="#007aff" font-weight="500" text-anchor="middle">▤</text><text x="180" y="900" font-size="12" fill="#007aff" font-weight="500" text-anchor="middle">Proxies</text><text x="267" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">◴</text><text x="267" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Activity</text><text x="354" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">☁</text><text x="354" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">oixCloud</text><text x="441" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">⚙</text><text x="441" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Settings</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="45" y="245" width="450" height="693" rx="25" fill="#00000022" stroke="none"/><rect x="45" y="319" width="450" height="619" rx="27" fill="#fff" stroke="none"/><rect x="240" y="329" width="60" height="5" rx="3" fill="#d5d5dc" stroke="none"/><text x="70" y="377" font-size="23" fill="#202124" font-weight="650" text-anchor="start">Add Proxy</text><circle cx="460" cy="367" r="16" fill="#f0f0f4" stroke="none" stroke-width="1"/><text x="460" y="373" font-size="23" fill="#727279" font-weight="500" text-anchor="middle">×</text><text x="78" y="411" font-size="25" fill="#007aff" font-weight="400" text-anchor="start">▦</text><text x="121" y="411" font-size="20" fill="#202124" font-weight="600" text-anchor="start">QR Code</text><circle cx="457" cy="404" r="12" fill="#ededf1" stroke="none" stroke-width="1"/><text x="78" y="454" font-size="25" fill="#007aff" font-weight="400" text-anchor="start">↗</text><text x="121" y="454" font-size="20" fill="#202124" font-weight="600" text-anchor="start">Link</text><circle cx="457" cy="447" r="12" fill="#007aff" stroke="none" stroke-width="1"/><path d="M450 440l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="497" font-size="25" fill="#007aff" font-weight="400" text-anchor="start">✎</text><text x="121" y="497" font-size="20" fill="#202124" font-weight="600" text-anchor="start">Manual</text><circle cx="457" cy="490" r="12" fill="#ededf1" stroke="none" stroke-width="1"/><text x="78" y="540" font-size="25" fill="#007aff" font-weight="400" text-anchor="start">☁</text><text x="121" y="540" font-size="20" fill="#202124" font-weight="600" text-anchor="start">oixCloud</text><circle cx="457" cy="533" r="12" fill="#ededf1" stroke="none" stroke-width="1"/><rect x="63" y="381" width="413" height="182" rx="10" fill="none" stroke="#d27336"/><circle cx="472" cy="385" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="472" y="390" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="69" y="584" width="402" height="50" rx="12" fill="#f3f3f7" stroke="none"/><text x="83" y="615" font-size="13" fill="#202124" font-weight="400" text-anchor="start">trojan://example@proxy.example.com:443</text><rect x="65" y="580" width="410" height="58" rx="10" fill="none" stroke="#d27336"/><circle cx="471" cy="584" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="471" y="589" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="83" y="660" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">Supports proxy links and Clash or Surge</text><text x="83" y="681.7" font-size="14" fill="#85858d" font-weight="400" text-anchor="start">subscriptions</text><text x="83" y="713" font-size="18" fill="#202124" font-weight="400" text-anchor="start">Remnawave HWID</text><rect x="407" y="691" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="422" cy="705.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="83" y="753" font-size="13" fill="#85858d" font-weight="400" text-anchor="start">Send this device’s identifier to this subscription</text><text x="83" y="773.15" font-size="13" fill="#85858d" font-weight="400" text-anchor="start">over HTTPS.</text><rect x="69" y="850" width="402" height="46" rx="23" fill="#007aff" stroke="none"/><text x="270" y="880" font-size="20" fill="#fff" font-weight="650" text-anchor="middle">Continue</text><rect x="65" y="846" width="410" height="54" rx="10" fill="none" stroke="#d27336"/><circle cx="471" cy="850" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="471" y="855" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">Proxies → Servers → Add → Link</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Choose an input method</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Choose Link, QR Code or Manual according</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">to the information you have.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Paste a complete node link</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Do not enter an account Access Token. All</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">addresses and credentials shown are</text><text x="552" y="664" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">fictional.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Continue and review</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">After saving, select the node on Home or</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">target it in a rule.</text></g></svg>
