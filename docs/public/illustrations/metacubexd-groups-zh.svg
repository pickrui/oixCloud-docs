<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">MetaCubeXD · 在路由器控制面板选择节点</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">MetaCubeXD · OpenClash / oixClash</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在路由器控制面板选择节点</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f1f5f8" stroke="none"/><rect x="30" y="130" width="1060" height="60" rx="15" fill="#fff" stroke="none"/><text x="63" y="168" font-size="25" fill="#334155" font-weight="650" text-anchor="start">MetaCubeXD</text><text x="348" y="168" font-size="19" fill="#166b85" font-weight="650" text-anchor="start">代理</text><circle cx="439" cy="146" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="439" y="151" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="502" y="168" font-size="19" fill="#506174" font-weight="400" text-anchor="start">连接</text><circle cx="585" cy="146" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="585" y="151" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="78" y="261" width="964" height="281" rx="16" fill="#fff" stroke="#dce4ed"/><text x="104" y="320" font-size="28" fill="#25384b" font-weight="650" text-anchor="start">工作</text><text x="1005" y="316" font-size="17" fill="#627486" font-weight="500" text-anchor="end">Selector</text><rect x="105" y="372" width="432" height="99" rx="12" fill="#e2f3f6" stroke="#669eac"/><text x="129" y="427" font-size="23" fill="#254856" font-weight="600" text-anchor="start">香港 · 示例 A</text><text x="507" y="454" font-size="15" fill="#487987" font-weight="500" text-anchor="end">28 ms</text><circle cx="522" cy="378" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="522" y="383" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="559" y="372" width="449" height="99" rx="12" fill="#f4f6f9" stroke="none"/><text x="582" y="427" font-size="23" fill="#415064" font-weight="400" text-anchor="start">日本 · 示例 B</text><text x="983" y="454" font-size="15" fill="#698094" font-weight="500" text-anchor="end">42 ms</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">打开代理页</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">OpenClash 从运行状态进入；oixClash</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">从运行页打开控制面板</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">选组内的成员</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">展开目标网站使用的手选组，然后点要使用</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">的节点</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对新连接</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">重新访问目标网站，在连接中查看命中规则</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">和出口</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：控制面板 → MetaCubeXD → 代理</text></g></svg>
