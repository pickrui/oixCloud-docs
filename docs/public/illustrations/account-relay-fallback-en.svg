<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Choose the exit when relay targets fail</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Choose the exit when relay targets fail</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Edit individual rule</text><g transform="translate(-100 0)"><rect x="245" y="300" width="808" height="445" rx="12" fill="#fff" stroke="#d5deea"/><text x="275" y="351" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Entry node</text><rect x="275" y="363" width="352" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="288" y="392" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">HK · Example A</text><text x="664" y="351" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Destination node</text><rect x="664" y="363" width="345" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="677" y="392" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">JP · Example B</text><rect x="259" y="317" width="763" height="110" rx="10" fill="none" stroke="#d27336"/><circle cx="1018" cy="321" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1018" y="326" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="275" y="486" font-size="20" fill="#405675" font-weight="600" text-anchor="start">Allow direct egress from the entry when targets are unavailable</text><rect x="276" y="510" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="291" cy="524.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="261" y="446" width="758" height="108" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="450" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="455" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="275" y="609" font-size="18" fill="#596b85" font-weight="400" text-anchor="start">Block connections when no relay target is available.</text><text x="275" y="647" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">When enabled, traffic may use the entry IP.</text><rect x="261" y="562" width="758" height="102" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="566" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="571" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="805" y="680" width="202" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="906" y="706" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Save changes</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check both nodes</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">The client connects to the entry.</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> The target provides the intended</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> exit.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Keep a fixed exit</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">With this switch off, new</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">connections stop if no matched</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">target is available.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check before enabling</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Traffic may leave from the entry</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">IP. Test with a new connection</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">after saving.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Internal Relay → Edit individual rule</text></g></svg>
