<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="982" viewBox="0 0 1120 982" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 为特定网络应用预设</title><desc id="desc">根据当前客户端页面结构模拟渲染；中文界面与虚构数据；界面细节随版本、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="982" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">模拟渲染 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">为特定网络应用预设</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="69" y="215" font-size="18" fill="#007aff" font-weight="400" text-anchor="start">‹ 网络预设</text><text x="270" y="215" font-size="21" fill="#111" font-weight="600" text-anchor="middle">Home Wi-Fi</text><text x="470" y="215" font-size="18" fill="#007aff" font-weight="600" text-anchor="end">完成</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><text x="82" y="258" font-size="15" fill="#727279" font-weight="400" text-anchor="start">网络</text><rect x="68" y="270" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="303" font-size="20" fill="#202124" font-weight="400" text-anchor="start">网络</text><text x="456" y="303" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">Home Wi-Fi</text><rect x="68" y="270" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="274" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="279" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="82" y="365" font-size="15" fill="#727279" font-weight="400" text-anchor="start">路由</text><rect x="68" y="377" width="404" height="106" rx="14" fill="#fff" stroke="none"/><text x="84" y="410" font-size="20" fill="#202124" font-weight="400" text-anchor="start">模式</text><text x="444" y="410" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">规则</text><path d="M454 400l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><path d="M84 430H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="377" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="381" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="386" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="463" font-size="20" fill="#202124" font-weight="400" text-anchor="start">兜底路由</text><text x="444" y="463" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">继承</text><path d="M454 453l5 5-5 5" fill="none" stroke="#aaa" stroke-width="2" stroke-linecap="round"/><text x="83" y="536" font-size="15" fill="#727279" font-weight="400" text-anchor="start">路由规则</text><rect x="78" y="552" width="384" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="81" y="555" width="186" height="33" rx="6" fill="#fff" stroke="none"/><text x="174" y="577" font-size="16" fill="#222" font-weight="600" text-anchor="middle">继承</text><text x="366" y="577" font-size="16" fill="#222" font-weight="400" text-anchor="middle">自定义</text><circle cx="468" cy="552" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="557" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="649" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="682" font-size="20" fill="#202124" font-weight="400" text-anchor="start">DNS</text><text x="456" y="682" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">继承</text><path d="M84 702H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="735" font-size="20" fill="#202124" font-weight="400" text-anchor="start">IPv6</text><text x="456" y="735" font-size="18" fill="#85858d" font-weight="400" text-anchor="end">继承</text><path d="M84 755H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="788" font-size="20" fill="#202124" font-weight="400" text-anchor="start">自动连接</text><rect x="406" y="767" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="421" cy="781.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">操作位置</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">设置 → 网络预设 → 网络</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="24" fill="#273952" font-weight="600" text-anchor="start">核对网络名称</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Wi-Fi 按准确 SSID 匹配，蜂窝网络单独设置</text><circle cx="568" cy="512" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="517" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="519" font-size="24" fill="#273952" font-weight="600" text-anchor="start">区分模式与兜底路由</text><text x="552" y="558" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">直连模式与“只有未匹配流量直连”作用不同</text><circle cx="568" cy="688" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="693" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="695" font-size="24" fill="#273952" font-weight="600" text-anchor="start">继承或自定义</text><text x="552" y="734" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">路由规则、DNS、IPv6 可分别继承全局设置</text></g></svg>
