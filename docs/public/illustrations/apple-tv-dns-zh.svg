<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixFlow · 在电视上设置 DNS</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixFlow · Apple TV</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在电视上设置 DNS</text><rect x="30" y="130" width="1060" height="653" rx="16" fill="#e9edf4" stroke="none"/><text x="87" y="204" font-size="40" fill="#25354d" font-weight="650" text-anchor="start">DNS</text><rect x="84" y="246" width="952" height="76" rx="13" fill="#fff" stroke="none"/><text x="110" y="294" font-size="24" fill="#344961" font-weight="600" text-anchor="start">DNS 同步</text><text x="984" y="294" font-size="22" fill="#526983" font-weight="500" text-anchor="end">关闭</text><circle cx="1017" cy="255" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1017" y="260" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="86" y="386" font-size="19" fill="#657a91" font-weight="600" text-anchor="start">全局 DNS</text><rect x="84" y="407" width="952" height="81" rx="13" fill="#fff" stroke="#becbdb"/><text x="110" y="458" font-size="23" fill="#344961" font-weight="600" text-anchor="start">自定义 DNS</text><text x="985" y="458" font-size="23" fill="#526983" font-weight="500" text-anchor="end">192.0.2.53</text><circle cx="358" cy="422" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="358" y="427" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="84" y="503" width="952" height="68" rx="11" fill="#f8faff" stroke="none"/><text x="110" y="547" font-size="23" fill="#344961" font-weight="400" text-anchor="start">严格 DNS</text><text x="984" y="547" font-size="22" fill="#526983" font-weight="500" text-anchor="end">关闭</text><rect x="84" y="585" width="952" height="68" rx="11" fill="#f8faff" stroke="none"/><text x="110" y="628" font-size="23" fill="#344961" font-weight="400" text-anchor="start">允许回退系统 DNS</text><text x="984" y="628" font-size="22" fill="#526983" font-weight="500" text-anchor="end">开启</text><rect x="776" y="424" width="216" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="988" cy="428" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="988" y="433" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对 DNS 同步</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">开启后从 iPhone 或 iPad 接收 DNS 设</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">置</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">只修改电视</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">关闭 DNS 同步后，选择自定义 DNS 并确</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">认地址</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">验证设置</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">回到此页核对服务器，再从电视应用发起新</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">查询</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：设置 → DNS</text></g></svg>
