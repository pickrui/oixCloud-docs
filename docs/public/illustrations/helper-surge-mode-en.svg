t-size="17" fill="#64748b" font-weight="400" text-anchor="start">macOS proxy settings.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Enable Enhanced Mode</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Approve the system prompt and</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">check the app in Surge’s request</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">list.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: macOS menu bar → Surge</text></g></svg>
