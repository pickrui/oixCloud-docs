<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud Helper · Switch nodes in single-port mode</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud Helper · macOS</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Switch nodes in single-port mode</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#dfe7f3" stroke="none"/><rect x="30" y="130" width="1060" height="34" rx="14" fill="#f5f6f9" stroke="none"/><text x="53" y="153" font-size="15" fill="#384052" font-weight="400" text-anchor="start">●   Finder   File   Edit   View   Go   Window</text><text x="1049" y="153" font-size="15" fill="#384052" font-weight="500" text-anchor="end">☁    09:41</text><rect x="90" y="195" width="292" height="240" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="108" y="229" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">oixCloud</text><rect x="95" y="242" width="282" height="34" rx="6" fill="#2676df" stroke="none"/><text x="108" y="266" font-size="17" fill="#fff" font-weight="400" text-anchor="start">Nodes</text><path d="M358 255l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="374" cy="242" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="374" y="247" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="108" y="303" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Client Setup</text><path d="M358 292l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><text x="108" y="340" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Account</text><path d="M358 329l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><text x="108" y="377" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Settings</text><path d="M358 366l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><text x="108" y="414" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Tools</text><path d="M358 403l5 5-5 5" fill="none" stroke="#6e7885" stroke-width="2" stroke-linecap="round"/><rect x="391" y="246" width="555" height="203" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="409" y="280" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Refresh nodes</text><text x="409" y="317" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Node filter</text><text x="409" y="354" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Auto-select</text><text x="409" y="391" font-size="17" fill="#303946" font-weight="400" text-anchor="start">✓  Hong Kong · Sample A</text><circle cx="938" cy="367" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="938" y="372" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="409" y="428" font-size="17" fill="#303946" font-weight="400" text-anchor="start">Japan · Sample B</text><text x="92" y="590" font-size="18" fill="#53677e" font-weight="600" text-anchor="start">Local multi-port mapping</text><rect x="90" y="612" width="855" height="55" rx="10" fill="#fbfbfdee" stroke="#c8ced8"/><text x="108" y="646" font-size="17" fill="#89909b" font-weight="400" text-anchor="start">Select a node in Surge or OpenSurge</text><circle cx="937" cy="622" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="937" y="627" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Open Nodes</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Single-port mode lets you select</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">the exit in Helper.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose a node</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">A manual selection turns off</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Auto-select. Click Auto-select to</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> restore it.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Use Surge for mappings</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">In multi-port mode, pick a mapped</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> node in a Surge Select group and</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> start a new connection.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: oixCloud menu bar icon → Nodes</text></g></svg>
