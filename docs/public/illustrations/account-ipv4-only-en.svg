x="267" y="680" width="17" height="17" rx="3" fill="#4c74d8" stroke="#9daec5"/><path d="M268 683l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="296" y="696" font-size="18" fill="#314f78" font-weight="600" text-anchor="start">HK · Example B</text><rect x="921" y="675" width="50" height="29" rx="16" fill="#d3d3d8" stroke="none"/><circle cx="936" cy="689.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><path d="M264 718H1034" stroke="#dedee3" stroke-width="1"/><rect x="267" y="734" width="17" height="17" rx="3" fill="#fff" stroke="#9daec5"/><text x="296" y="750" font-size="18" fill="#314f78" font-weight="600" text-anchor="start">HK · Example C</text><rect x="921" y="729" width="50" height="29" rx="16" fill="#34c759" stroke="none"/><circle cx="956" cy="743.5" r="11" fill="#fff" stroke="none" stroke-width="1"/><rect x="905" y="611" width="82" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="983" cy="615" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="983" y="620" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Search and filter nodes</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">No pagination. Select all covers</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">every available node matching the</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> filters.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the count, then</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">apply</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Two disabled nodes are selected.</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Choose Enable selected, then</text><text x="407" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">apply.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Wait for sync and</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">reconnect</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">No subscription refresh. Old</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">connections stay; only</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">destination exits are restricted.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Traffic Routes → IPv4 Only</text></g></svg>
