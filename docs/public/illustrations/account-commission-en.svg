<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Check the payout and the debt offset</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Check the payout and the debt offset</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">Withdraw Commission</text><g transform="translate(-100 0)"><rect x="245" y="299" width="808" height="439" rx="12" fill="#fff" stroke="#d5deea"/><text x="275" y="350" font-size="24" fill="#405675" font-weight="600" text-anchor="start">Withdraw ¥200.00?</text><text x="275" y="410" font-size="19" fill="#405675" font-weight="400" text-anchor="start">To the receiving address over TRC-20</text><text x="275" y="445" font-size="16" fill="#657b97" font-weight="400" text-anchor="start">(Address omitted)</text><rect x="261" y="370" width="757" height="94" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="374" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="379" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="275" y="514" font-size="21" fill="#405675" font-weight="600" text-anchor="start">Fee ¥20.00, you receive ¥180.00</text><rect x="261" y="473" width="757" height="66" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="477" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="482" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="275" y="591" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">Your negative balance uses ¥10.00 of commission first.</text><text x="275" y="627" font-size="20" fill="#94571f" font-weight="600" text-anchor="start">Total commission used: ¥210.00</text><rect x="261" y="548" width="757" height="99" rx="10" fill="none" stroke="#d27336"/><circle cx="1014" cy="552" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1014" y="557" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="275" y="697" font-size="17" fill="#596b85" font-weight="400" text-anchor="start">Verify with a passkey or your current password</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check the destination</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Use the recipient’s network and</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">check the full receiving address.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check what you receive</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">A ¥200 request with a ¥20 fee</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">pays the equivalent of ¥180 in</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">USDT.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Check total commission</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">In this example ¥10 also settles</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">debt, so commission falls by ¥210</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Withdraw or transfer to balance → Withdraw Commission</text></g></svg>
