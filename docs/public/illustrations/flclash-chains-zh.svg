hor="start">日本 · 示例 B</text><text x="170" y="431" font-size="15" fill="#7e7176" font-weight="400" text-anchor="start">出口</text><rect x="930" y="387" width="106" height="37" rx="20" fill="#f0dce2" stroke="none"/><text x="983" y="411" font-size="16" fill="#784f5b" font-weight="500" text-anchor="middle">2</text><path d="M154 448H1052" stroke="#ede5e8" stroke-width="1"/><rect x="150" y="376" width="906" height="72" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="380" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="385" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="169" y="491" width="166" height="43" rx="23" fill="#8a5260" stroke="none"/><text x="252" y="519" font-size="17" fill="#fff" font-weight="500" text-anchor="middle">添加节点</text><rect x="911" y="699" width="135" height="43" rx="23" fill="#8a5260" stroke="none"/><text x="978.5" y="727" font-size="17" fill="#fff" font-weight="500" text-anchor="middle">保存</text><rect x="907" y="695" width="143" height="51" rx="10" fill="none" stroke="#d27336"/><circle cx="1046" cy="699" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1046" y="704" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">添加至少两个节点</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">首个节点是入口，最后一个节点是出口</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">检查转发顺序</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">每个成员先单独验证连通</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">保存后选出口节点</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">这个功能不会另建一个可选的代理链节点</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：配置菜单 → 代理链</text></g></svg>
