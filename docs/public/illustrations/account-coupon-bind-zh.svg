<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 购买后绑定前核对补退差价</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">购买后绑定前核对补退差价</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">套餐管理</text><g transform="translate(-100 0)"><rect x="245" y="303" width="808" height="96" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="342" font-size="22" fill="#405675" font-weight="600" text-anchor="start">示例套餐 A · 待激活</text><rect x="830" y="333" width="200" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="930" y="359" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">绑定折扣</text><rect x="826" y="329" width="208" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="333" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="338" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="245" y="421" width="808" height="333" rx="12" fill="#fff" stroke="#d5deea"/><text x="267" y="461" font-size="23" fill="#405675" font-weight="600" text-anchor="start">绑定折扣代码</text><rect x="267" y="485" width="560" height="42" rx="7" fill="#fff" stroke="#d5deea"/><text x="282" y="513" font-size="18" fill="#445a77" font-weight="400" text-anchor="start">EXAMPLE-CODE</text><rect x="850" y="486" width="180" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="940" y="512" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">验证</text><text x="267" y="566" font-size="18" fill="#596b85" font-weight="400" text-anchor="start">折扣后价格：</text><text x="1030" y="566" font-size="21" fill="#405675" font-weight="600" text-anchor="end">CNY 80.00</text><text x="267" y="608" font-size="18" fill="#596b85" font-weight="400" text-anchor="start">退还差价：</text><text x="1030" y="608" font-size="21" fill="#3b846c" font-weight="600" text-anchor="end">CNY 20.00</text><rect x="255" y="534" width="787" height="93" rx="10" fill="none" stroke="#d27336"/><circle cx="1038" cy="538" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1038" y="543" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="267" y="662" font-size="18" fill="#3b846c" font-weight="400" text-anchor="start">✓ 循环折扣代码</text><rect x="750" y="697" width="280" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="890" y="723" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">确认绑定</text><rect x="746" y="693" width="288" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1030" cy="697" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1030" y="702" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">从原购买记录进入</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">通常首次购买后 7 天内；升级不重算期限</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先验证再核对补退方向</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">图中退还 ¥20；实际也可能要求补款</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">确认后检查余额与续费</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">循环代码更新续费价，开关保持原设置</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 套餐管理 → 绑定折扣 → 验证</text></g></svg>
