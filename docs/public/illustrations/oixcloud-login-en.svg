<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Sign in to your account</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1120" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · iPhone / iPad</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Sign in to your account</text><rect x="38" y="121" width="464" height="823" rx="39" fill="#e6e8ed" stroke="none"/><rect x="44" y="127" width="452" height="811" rx="34" fill="#f2f2f7" stroke="none"/><text x="72" y="164" font-size="17" fill="#161617" font-weight="650" text-anchor="start">9:41</text><text x="456" y="164" font-size="15" fill="#161617" font-weight="600" text-anchor="end">▮▮▮  ▰</text><text x="67" y="234" font-size="37" fill="#111" font-weight="700" text-anchor="start">oixCloud</text><rect x="49" y="854" width="442" height="63" rx="27" fill="#fcfcfd" stroke="#e4e4e9"/><text x="93" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">⌂</text><text x="93" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Home</text><text x="180" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">▤</text><text x="180" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Proxies</text><text x="267" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">◴</text><text x="267" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Activity</text><text x="354" y="880" font-size="23" fill="#007aff" font-weight="500" text-anchor="middle">☁</text><text x="354" y="900" font-size="12" fill="#007aff" font-weight="500" text-anchor="middle">oixCloud</text><text x="441" y="880" font-size="23" fill="#8b8b93" font-weight="500" text-anchor="middle">⚙</text><text x="441" y="900" font-size="12" fill="#8b8b93" font-weight="500" text-anchor="middle">Settings</text><rect x="210" y="924" width="120" height="5" rx="3" fill="#19191b" stroke="none"/><rect x="69" y="262" width="402" height="39" rx="8" fill="#e4e4e9" stroke="none"/><text x="169.5" y="287" font-size="16" fill="#222" font-weight="400" text-anchor="middle">Access Token</text><rect x="273" y="265" width="195" height="33" rx="6" fill="#fff" stroke="none"/><text x="370.5" y="287" font-size="16" fill="#222" font-weight="600" text-anchor="middle">Email &amp; Password</text><rect x="65" y="258" width="410" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="471" cy="262" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="471" y="267" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="68" y="351" width="404" height="159" rx="14" fill="#fff" stroke="none"/><text x="84" y="384" font-size="20" fill="#202124" font-weight="400" text-anchor="start">reader@example.com</text><path d="M84 404H472" stroke="#dedee3" stroke-width="1"/><text x="84" y="437" font-size="20" fill="#202124" font-weight="400" text-anchor="start">••••••••</text><path d="M84 457H472" stroke="#dedee3" stroke-width="1"/><rect x="68" y="404" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="408" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="413" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="84" y="490" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Forgot Password?</text><rect x="68" y="549" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="582" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Sign In</text><rect x="68" y="549" width="404" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="468" cy="553" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="468" y="558" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="68" y="630" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="663" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Sign in with Google</text><rect x="68" y="711" width="404" height="53" rx="14" fill="#fff" stroke="none"/><text x="84" y="744" font-size="20" fill="#007aff" font-weight="400" text-anchor="start">Create Account</text><text x="552" y="175" font-size="17" fill="#748092" font-weight="600" text-anchor="start">Where to go</text><text x="552" y="214" font-size="21" fill="#233955" font-weight="400" text-anchor="start">oixCloud → Sign In</text><circle cx="568" cy="336" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="341" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="598" y="343" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Choose a sign-in method</text><text x="552" y="382" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">Use an Access Token, email and password,</text><text x="552" y="413" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">or Google for an existing account.</text><circle cx="568" cy="556" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="561" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="598" y="563" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Enter your credentials</text><text x="552" y="602" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">The example email is fictional; no</text><text x="552" y="633" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">password is shown.</text><circle cx="568" cy="776" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="568" y="781" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="598" y="783" font-size="23" fill="#273952" font-weight="600" text-anchor="start">Wait for managed nodes</text><text x="552" y="822" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">After sign-in, wait for nodes to load</text><text x="552" y="853" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">before connecting on Home.</text></g></svg>
