<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">OpenClash · 为出口节点指定入口</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">OpenClash · OpenWrt / LuCI</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">为出口节点指定入口</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f5f5f5" stroke="none"/><rect x="30" y="130" width="1060" height="55" rx="15" fill="#283643" stroke="none"/><text x="55" y="166" font-size="25" fill="#fff" font-weight="600" text-anchor="start">OpenWrt</text><text x="242" y="166" font-size="19" fill="#fff" font-weight="400" text-anchor="start">OpenClash</text><text x="64" y="241" font-size="30" fill="#333" font-weight="650" text-anchor="start">编辑服务器配置</text><rect x="64" y="296" width="990" height="426" rx="8" fill="#fff" stroke="#ddd"/><text x="92" y="365" font-size="18" fill="#485767" font-weight="400" text-anchor="start">别名（请勿重名）</text><rect x="311" y="324" width="698" height="57" rx="5" fill="#f8fafc" stroke="#d2dce5"/><text x="330" y="361" font-size="22" fill="#344455" font-weight="400" text-anchor="start">Exit B</text><rect x="307" y="320" width="706" height="65" rx="10" fill="none" stroke="#d27336"/><circle cx="1009" cy="324" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1009" y="329" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="92" y="479" font-size="19" fill="#485767" font-weight="400" text-anchor="start">Dialer-proxy</text><rect x="311" y="441" width="698" height="57" rx="5" fill="#fff" stroke="#aac5da"/><text x="330" y="478" font-size="22" fill="#344455" font-weight="400" text-anchor="start">Entry A</text><rect x="307" y="437" width="706" height="65" rx="10" fill="none" stroke="#d27336"/><circle cx="1009" cy="441" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1009" y="446" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="801" y="648" width="208" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="905" y="674" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">保存配置</text><rect x="797" y="644" width="216" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1009" cy="648" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1009" y="653" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">编辑出口节点</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">读取自己的配置后，在服务器节点配置中打</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">开出口</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">填写入口名称</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Dialer-proxy 填此配置中已有的入口名</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">称</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">保存后应用</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">回节点管理应用配置，切换到该文件，再在</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">手选组选出口</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：配置管理 → ⋮ → 节点管理 → 编辑出口节点</text></g></svg>
