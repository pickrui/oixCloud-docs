<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 在电视设置中打开同步</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Apple TV</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">在电视设置中打开同步</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#edf0f5" stroke="none"/><text x="90" y="212" font-size="39" fill="#25354d" font-weight="650" text-anchor="start">设置</text><rect x="78" y="252" width="962" height="61" rx="12" fill="#e3e7ef" stroke="none"/><text x="102" y="292" font-size="25" fill="#2d3e58" font-weight="400" text-anchor="start">模式</text><text x="1010" y="292" font-size="22" fill="#6a7e98" font-weight="500" text-anchor="end">规则</text><rect x="78" y="330" width="962" height="61" rx="12" fill="#e3e7ef" stroke="none"/><text x="102" y="370" font-size="25" fill="#2d3e58" font-weight="400" text-anchor="start">代理服务</text><text x="1010" y="370" font-size="22" fill="#6a7e98" font-weight="500" text-anchor="end">关闭</text><rect x="78" y="408" width="962" height="61" rx="12" fill="#e3e7ef" stroke="none"/><text x="102" y="448" font-size="25" fill="#2d3e58" font-weight="400" text-anchor="start">局域网控制台</text><text x="1010" y="448" font-size="22" fill="#6a7e98" font-weight="500" text-anchor="end">关闭</text><rect x="78" y="486" width="962" height="61" rx="12" fill="#e3e7ef" stroke="none"/><text x="102" y="526" font-size="25" fill="#2d3e58" font-weight="400" text-anchor="start">允许不安全</text><text x="1010" y="526" font-size="22" fill="#6a7e98" font-weight="500" text-anchor="end">关闭</text><rect x="78" y="564" width="962" height="61" rx="12" fill="#fff" stroke="none"/><text x="102" y="604" font-size="25" fill="#2d3e58" font-weight="600" text-anchor="start">iCloud 同步</text><text x="1010" y="604" font-size="22" fill="#6a7e98" font-weight="500" text-anchor="end">开启</text><rect x="74" y="560" width="970" height="69" rx="10" fill="none" stroke="#d27336"/><circle cx="1040" cy="564" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1040" y="569" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="90" y="738" font-size="20" fill="#64748b" font-weight="400" text-anchor="start">接收来自 iPhone / iPad 的配置</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">先在手机开启电视同步</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">手机的设置 → iCloud 同步 → 同步到</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Apple TV</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">电视打开 iCloud 同步</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">两端使用同一 Apple 账户；按提示处理已</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">有配置</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">等节点出现后再连接</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">用遥控器选择出口，在电视目标应用验证</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：Apple TV → 设置 → iCloud 同步</text></g></svg>
