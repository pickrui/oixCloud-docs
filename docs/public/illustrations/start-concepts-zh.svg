<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 流量接管、分流规则与节点调度模型</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 架构与概念</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">流量接管、分流规则与节点调度模型</text><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><rect x="55" y="165" width="225" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="55" y="165" width="225" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="167" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">1. 本机流量接管</text><text x="75" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">应用网络请求</text><rect x="75" y="260" width="185" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="90" y="287" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">浏览器 / 办公 / 游戏</text><text x="75" y="340" font-size="16" fill="#334155" font-weight="600" text-anchor="start">客户端接管方式</text><rect x="75" y="355" width="185" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="382" font-size="13" fill="#1d4ed8" font-weight="400" text-anchor="start">系统代理 (HTTP/SOCKS5)</text><rect x="75" y="405" width="185" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="432" font-size="13" fill="#1d4ed8" font-weight="400" text-anchor="start">TUN 虚拟网卡 (全局接管)</text><rect x="75" y="455" width="185" height="42" rx="8" fill="#eff6ff" stroke="#93c5fd"/><text x="90" y="482" font-size="13" fill="#1d4ed8" font-weight="400" text-anchor="start">VPN 配置 (iOS / 移动端)</text><rect x="61" y="321" width="213" height="193" rx="10" fill="none" stroke="#d27336"/><circle cx="270" cy="325" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="270" y="330" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="75" y="545" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">将本机请求捕获并送入客户端核心</text><text x="75" y="566.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">路由引擎</text><text x="292" y="430" font-size="26" fill="#94a3b8" font-weight="middle" text-anchor="start">➔</text><rect x="305" y="165" width="235" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="305" y="165" width="235" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="422" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">2. 分流规则匹配</text><text x="325" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">出站工作模式</text><rect x="325" y="260" width="195" height="39" rx="8" fill="#e4e4e9" stroke="none"/><rect x="328" y="263" width="59" height="33" rx="6" fill="#fff" stroke="none"/><text x="357.5" y="285" font-size="16" fill="#222" font-weight="600" text-anchor="middle">规则</text><text x="422.5" y="285" font-size="16" fill="#222" font-weight="400" text-anchor="middle">全局</text><text x="487.5" y="285" font-size="16" fill="#222" font-weight="400" text-anchor="middle">直连</text><text x="325" y="340" font-size="16" fill="#334155" font-weight="600" text-anchor="start">规则命中判定</text><rect x="325" y="355" width="195" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/><text x="340" y="382" font-size="13" fill="#166534" font-weight="400" text-anchor="start">DOMAIN-SUFFIX: 代理</text><rect x="325" y="405" width="195" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="340" y="432" font-size="13" fill="#991b1b" font-weight="400" text-anchor="start">GEOIP,CN: 直连 (Direct)</text><rect x="325" y="455" width="195" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="340" y="482" font-size="13" fill="#475569" font-weight="400" text-anchor="start">MATCH: 兜底策略组</text><rect x="311" y="321" width="223" height="193" rx="10" fill="none" stroke="#d27336"/><circle cx="530" cy="325" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="530" y="330" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="325" y="545" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">自上而下逐条匹配，首条命中即决定</text><text x="325" y="566.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">流量去向</text><text x="552" y="430" font-size="26" fill="#94a3b8" font-weight="middle" text-anchor="start">➔</text><rect x="565" y="165" width="235" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="565" y="165" width="235" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="682" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">3. 策略组与链式代理</text><text x="585" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">出口调度策略</text><rect x="585" y="260" width="195" height="42" rx="8" fill="#faf5ff" stroke="#d8b4fe"/><text x="600" y="287" font-size="14" fill="#6b21a8" font-weight="400" text-anchor="start">自动测速 (URL Test)</text><rect x="585" y="310" width="195" height="42" rx="8" fill="#faf5ff" stroke="#d8b4fe"/><text x="600" y="337" font-size="14" fill="#6b21a8" font-weight="400" text-anchor="start">故障转移 / 负载均衡</text><text x="585" y="385" font-size="16" fill="#334155" font-weight="600" text-anchor="start">多跳链路组合</text><rect x="585" y="400" width="195" height="65" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="600" y="425" font-size="13" fill="#9a3412" font-weight="600" text-anchor="start">链式代理 / 内部中继</text><text x="600" y="450" font-size="13" fill="#c2410c" font-weight="400" text-anchor="start">专线首跳 ➔ 家宽落地</text><rect x="571" y="366" width="223" height="113" rx="10" fill="none" stroke="#d27336"/><circle cx="790" cy="370" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="790" y="375" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="585" y="510" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">动态检测节点健康度，支持专线高速</text><text x="585" y="531.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">中转与代理链</text><text x="812" y="430" font-size="26" fill="#94a3b8" font-weight="middle" text-anchor="start">➔</text><rect x="825" y="165" width="235" height="580" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="825" y="165" width="235" height="48" rx="14" fill="#f1f5f9" stroke="none"/><text x="942" y="196" font-size="18" fill="#1e293b" font-weight="600" text-anchor="middle">4. 节点出口与目标</text><text x="845" y="245" font-size="16" fill="#334155" font-weight="600" text-anchor="start">节点落地网络</text><rect x="845" y="260" width="195" height="40" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="860" y="286" font-size="13" fill="#0369a1" font-weight="400" text-anchor="start">Fusion / GIA (专网优化)</text><rect x="845" y="308" width="195" height="40" rx="8" fill="#f0f9ff" stroke="#bae6fd"/><text x="860" y="334" font-size="13" fill="#0369a1" font-weight="400" text-anchor="start">IXP (云网互联)</text><rect x="845" y="356" width="195" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/><text x="860" y="382" font-size="13" fill="#15803d" font-weight="400" text-anchor="start">Home ISP (家庭宽带住宅 IP)</text><text x="845" y="430" font-size="16" fill="#334155" font-weight="600" text-anchor="start">最终访问目标</text><rect x="845" y="445" width="195" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="860" y="471" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Google / YouTube / GitHub</text><rect x="845" y="493" width="195" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="860" y="519" font-size="13" fill="#475569" font-weight="400" text-anchor="start">海外电商 / 银行支付 / 流媒体</text><text x="845" y="565" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">经由所选出口 IP 访问目标互联网</text><text x="845" y="586.7" font-size="14" fill="#64748b" font-weight="400" text-anchor="start">服务</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">流量接管（第一步）</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">通过系统代理、VPN 或 TUN 虚拟网卡将</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">本机应用网络请求捕获到客户端</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">分流规则匹配（第二步）</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">根据域名或 IP 目标，结合模式（规则／</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">全局／直连）决定走向与目标策略组</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">策略组与出口调度（第三步）</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">策略组根据自动优选、手动指定或代理链，</text><text x="772" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">经由专线与节点出口访问目标</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：本地客户端 → 分流规则 → 策略组 → 节点出口</text></g></svg>
