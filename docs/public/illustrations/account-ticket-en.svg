font-weight="400" text-anchor="start"> of the form.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Describe steps and exact</text><text x="445" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">errors</text><text x="407" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Give time, network, destination</text><text x="407" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">and comparisons. Redact</text><text x="407" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">attachments first.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Review confirmations and</text><text x="810" y="865" font-size="20" fill="#273952" font-weight="600" text-anchor="start">submit</text><text x="772" y="910" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Continue existing open tickets.</text><text x="772" y="936.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Never share passwords or full</text><text x="772" y="962.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">subscriptions.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Tickets → New ticket</text></g></svg>
