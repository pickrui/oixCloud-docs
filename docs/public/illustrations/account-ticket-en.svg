<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">oixCloud · Report the payment and plan status</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · Website</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Report the payment and plan status</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Account ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Services ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Billing ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">Support ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">Example account</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">New ticket</text><g transform="translate(-100 0)"><text x="246" y="317" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Issue type</text><rect x="246" y="329" width="372" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="259" y="358" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Purchase or payment problem</text><rect x="242" y="325" width="380" height="53" rx="10" fill="none" stroke="#d27336"/><circle cx="618" cy="329" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="618" y="334" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="646" y="317" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">Title</text><rect x="646" y="329" width="406" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="659" y="358" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">Plan missing</text><text x="247" y="463" font-size="17" fill="#596b85" font-weight="600" text-anchor="start">Issue description</text><rect x="246" y="482" width="806" height="144" rx="7" fill="#fff" stroke="#d5deea"/><text x="267" y="522" font-size="17" fill="#405675" font-weight="400" text-anchor="start">Example order EX-0001, paid at 09:10 (UTC+8)</text><text x="267" y="560" font-size="17" fill="#405675" font-weight="400" text-anchor="start">Top-up credited. No new record in Plan Management.</text><text x="267" y="598" font-size="17" fill="#405675" font-weight="400" text-anchor="start">Notice received: Automatic purchase was not completed</text><rect x="242" y="478" width="814" height="152" rx="10" fill="none" stroke="#d27336"/><circle cx="1052" cy="482" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1052" y="487" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="248" y="678" width="19" height="19" rx="3" fill="#4c74d8" stroke="none"/><path d="M251 681l5 5 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="694" font-size="15" fill="#596b85" font-weight="400" text-anchor="start">I have followed the User Guide to complete setup and troubleshooting.</text><rect x="871" y="667" width="180" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="961" y="693" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">Submit Ticket</text><rect x="867" y="663" width="188" height="48" rx="10" fill="none" stroke="#d27336"/><circle cx="1051" cy="667" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1051" y="672" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose the payment issue</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">If the issue already has an open</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">ticket, reply in that ticket.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Include both records</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Give the order reference, payment</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> time, top-up result and plan</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">status.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Review and submit</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Redact screenshots. Check the</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">confirmation and wait for the</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">countdown.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Website → Support Tickets → New Ticket</text></g></svg>
