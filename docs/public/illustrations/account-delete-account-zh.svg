<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="975" viewBox="0 0 1120 975" role="img" aria-labelledby="title desc"><title id="title">oixCloud · 核对账户后再确认注销</title><desc id="desc">按维护版本的菜单与表单绘制，非客户端截图；中文界面与虚构数据；界面细节随系统、平台与主题变化</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="975" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">oixCloud · 网站</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">操作示意 · 虚构数据</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">核对账户后再确认注销</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3e8f1" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#f7f9fc" stroke="none"/><rect x="30" y="130" width="1060" height="40" rx="15" fill="#e9edf5" stroke="none"/><text x="560" y="156" font-size="15" fill="#66768b" font-weight="500" text-anchor="middle">oixcloud.com</text><rect x="30" y="170" width="1060" height="55" rx="0" fill="#fff" stroke="none"/><text x="54" y="205" font-size="25" fill="#344b70" font-weight="700" text-anchor="start">oixCloud</text><text x="276" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">我的 ▾</text><text x="413" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">使用 ▾</text><text x="550" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">交易 ▾</text><text x="687" y="203" font-size="17" fill="#65768e" font-weight="400" text-anchor="start">帮助 ▾</text><text x="1060" y="203" font-size="16" fill="#7a879b" font-weight="500" text-anchor="end">示例账户</text><text x="146" y="272" font-size="27" fill="#2b405e" font-weight="650" text-anchor="start">注销账户</text><g transform="translate(-100 0)"><rect x="245" y="295" width="808" height="456" rx="12" fill="#fff" stroke="#d5deea"/><text x="273" y="340" font-size="21" fill="#405675" font-weight="600" text-anchor="start">要注销的账户</text><text x="273" y="377" font-size="20" fill="#405675" font-weight="400" text-anchor="start">reader@example.com</text><text x="273" y="414" font-size="18" fill="#94571f" font-weight="400" text-anchor="start">注销后无法恢复，余额和佣金不予退还</text><rect x="259" y="305" width="760" height="127" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="309" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="314" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="273" y="474" font-size="19" fill="#32765e" font-weight="600" text-anchor="start">Passkey 已验证</text><text x="273" y="516" font-size="16" fill="#596b85" font-weight="600" text-anchor="start">邮箱验证码</text><rect x="273" y="528" width="425" height="45" rx="7" fill="#fff" stroke="#d5deea"/><text x="286" y="557" font-size="17" fill="#445a77" font-weight="400" text-anchor="start">—</text><rect x="734" y="526" width="267" height="40" rx="7" fill="#4c74d8" stroke="none"/><text x="867.5" y="552" font-size="16" fill="#fff" font-weight="600" text-anchor="middle">发送验证码</text><rect x="259" y="486" width="760" height="104" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="490" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="495" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="275" y="626" width="20" height="20" rx="3" fill="#fff" stroke="#8b9ab0"/><text x="310" y="643" font-size="16" fill="#596b85" font-weight="400" text-anchor="start">我已了解删除账户的后果，确认要删除我的账户</text><rect x="273" y="680" width="728" height="41" rx="7" fill="#d5dade" stroke="none"/><text x="637" y="706" font-size="16" fill="#56606b" font-weight="600" text-anchor="middle">确认删除</text><rect x="260" y="606" width="759" height="128" rx="10" fill="none" stroke="#d27336"/><circle cx="1015" cy="610" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="1015" y="615" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text></g><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">核对账号和损失</text><text x="42" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">核对账户邮箱，余额、佣金和套餐会作废，</text><text x="42" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">记录会删除</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">完成两项验证</text><text x="407" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">验证身份后，还需填写账户邮箱收到的验证</text><text x="407" y="894.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">码</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="21" fill="#273952" font-weight="600" text-anchor="start">确认永久删除</text><text x="772" y="868" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">仅在接受后果时勾选并确认删除</text><text x="34" y="966" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">入口：网站 → 账户设置 → 前往注销</text></g></svg>
