<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1100" viewBox="0 0 1120 1100" role="img" aria-labelledby="title desc"><title id="title">FlClash for oixCloud · Add a custom node to this profile</title><desc id="desc">English interface simulation based on maintained client labels; fictional data, not a screenshot. Layout varies by OS, platform and theme.</desc><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',Arial,sans-serif"><rect x="0" y="0" width="1120" height="1100" rx="0" fill="#f3f5f8" stroke="none"/><text x="34" y="38" font-size="18" fill="#697386" font-weight="600" text-anchor="start">FlClash for oixCloud · Desktop</text><text x="1085" y="38" font-size="16" fill="#788392" font-weight="500" text-anchor="end">Illustration · Fictional data</text><text x="34" y="87" font-size="31" fill="#263245" font-weight="700" text-anchor="start">Add a custom node to this profile</text><rect x="28" y="128" width="1064" height="657" rx="16" fill="#e3dbde" stroke="none"/><rect x="30" y="130" width="1060" height="653" rx="15" fill="#fffbfc" stroke="none"/><rect x="30" y="130" width="1060" height="35" rx="15" fill="#f2eaed" stroke="none"/><circle cx="49" cy="148" r="5" fill="#df8e94" stroke="none" stroke-width="1"/><circle cx="66" cy="148" r="5" fill="#e7c87c" stroke="none" stroke-width="1"/><circle cx="83" cy="148" r="5" fill="#95bda4" stroke="none" stroke-width="1"/><text x="560" y="152" font-size="14" fill="#68575e" font-weight="500" text-anchor="middle">FlClash for oixCloud</text><rect x="31" y="165" width="90" height="617" rx="0" fill="#f7f0f2" stroke="none"/><text x="76" y="215" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▦</text><text x="76" y="242" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Dashboard</text><text x="76" y="287" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">▤</text><text x="76" y="314" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Proxies</text><rect x="40" y="335" width="71" height="35" rx="18" fill="#edd9df" stroke="none"/><text x="76" y="359" font-size="23" fill="#754651" font-weight="500" text-anchor="middle">▱</text><text x="76" y="386" font-size="12" fill="#754651" font-weight="500" text-anchor="middle">Profiles</text><text x="76" y="431" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">☁</text><text x="76" y="458" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">oixCloud</text><text x="76" y="503" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">≡</text><text x="76" y="530" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Requests</text><text x="76" y="575" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⌕</text><text x="76" y="602" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">DNS queries</text><text x="76" y="647" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⇄</text><text x="76" y="674" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Connections</text><text x="76" y="719" font-size="23" fill="#72676b" font-weight="500" text-anchor="middle">⚒</text><text x="76" y="746" font-size="12" fill="#72676b" font-weight="500" text-anchor="middle">Tools</text><text x="153" y="205" font-size="27" fill="#2d2528" font-weight="500" text-anchor="start">Proxy chains</text><rect x="30" y="165" width="1060" height="618" rx="0" fill="#00000044" stroke="none"/><rect x="155" y="235" width="810" height="440" rx="27" fill="#fff6f8" stroke="#ddcbd2"/><text x="179" y="277" font-size="26" fill="#8a5260" font-weight="400" text-anchor="start">‹</text><text x="560" y="278" font-size="23" fill="#332b2e" font-weight="600" text-anchor="middle">Custom node</text><text x="937" y="278" font-size="24" fill="#8a5260" font-weight="600" text-anchor="end">✓</text><circle cx="952" cy="253" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="952" y="258" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="183" y="315" width="754" height="39" rx="20" fill="#f7edef" stroke="#a8959a"/><rect x="186" y="318" width="245.33333333333334" height="33" rx="17" fill="#f0d9df" stroke="none"/><text x="308.6666666666667" y="340" font-size="16" fill="#593c44" font-weight="600" text-anchor="middle">URI</text><text x="560" y="340" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">Quick edit</text><text x="811.3333333333334" y="340" font-size="16" fill="#593c44" font-weight="400" text-anchor="middle">YAML</text><rect x="179" y="311" width="762" height="47" rx="10" fill="none" stroke="#d27336"/><circle cx="937" cy="315" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="937" y="320" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><rect x="183" y="403" width="754" height="143" rx="7" fill="#fffbfc" stroke="#9d8d92"/><text x="200" y="433" font-size="15" fill="#756067" font-weight="400" text-anchor="start">URI</text><text x="200" y="472" font-size="19" fill="#2f272a" font-weight="400" text-anchor="start">trojan://example@proxy.example.com:443</text><rect x="179" y="399" width="762" height="151" rx="10" fill="none" stroke="#d27336"/><circle cx="937" cy="403" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="937" y="408" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="183" y="585" font-size="17" fill="#897181" font-weight="400" text-anchor="start">Example link; cannot connect as written</text><text x="183" y="625" font-size="17" fill="#897181" font-weight="400" text-anchor="start">See the input hint and validation result for supported protocols</text><circle cx="54" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="54" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="80" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Choose an input method</text><text x="42" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">URI accepts a share link. Use</text><text x="42" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Quick edit or YAML for other</text><text x="42" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">supplied parameters.</text><circle cx="419" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="419" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="445" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Paste one node link</text><text x="407" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Use a distinct name so you do not</text><text x="407" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start"> replace an existing node</text><text x="407" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">definition.</text><circle cx="784" cy="829" r="15" fill="#c55a18" stroke="#fff" stroke-width="2"/><text x="784" y="834" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="810" y="835" font-size="20" fill="#273952" font-weight="600" text-anchor="start">Save, enable and select it</text><text x="772" y="880" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">Apply the profile and select the</text><text x="772" y="906.35" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">node in a manual group. No chain</text><text x="772" y="932.7" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">is required.</text><text x="34" y="1080" font-size="14" fill="#7c8797" font-weight="400" text-anchor="start">Where to go: Profile menu → Proxy chains → Custom nodes → Add</text></g></svg>
